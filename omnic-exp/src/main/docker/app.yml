version: '2'
services:
    omnicanalpresentation-app:
        image: omnicanalpresentation
        environment:
            - SPRING_PROFILES_ACTIVE=prod,swagger
            - SPRING_DATASOURCE_URL=jdbc:mysql://omnicanalpresentation-mysql:3306/omnicanalpresentation?useUnicode=true&characterEncoding=utf8&useSSL=false
            - JHIPSTER_SLEEP=10 # gives time for the database to boot before the application
        ports:
            - 8080:8080
    omnicanalpresentation-mysql:
        extends:
            file: mysql.yml
            service: omnicanalpresentation-mysql
