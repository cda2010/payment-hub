<div>
    <h2>Parametre Methodes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                    <button class="btn btn-primary" ui-sref="ligne-schema-ecriture({idSchema:vm.schema})" >
                    <span class="glyphicon glyphicon-arrow-left"></span>
                    <span >
                      Retour
                    </span>
                </button>
                <button class="btn btn-primary" ui-sref="parametre-schema.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Parametre Schema
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Nom Parametre </span></th>
                     <th><span>code Parametre </span></th>
                   
                    <th><span>Catégorie</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="parametreSchema in vm.parametreSchemas track by parametreSchema.id">
                    <td>{{parametreSchema.id}}</td>
                    <td>{{parametreSchema.nomParametre}}</td>
                     <td>{{parametreSchema.codeParametre}}</td>
                   
                   
                     <td>
                       {{parametreSchema.categorieParam}}
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="parametre-schema-detail({id:parametreSchema.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-schema.edit({id:parametreSchema.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-schema.delete({id:parametreSchema.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
