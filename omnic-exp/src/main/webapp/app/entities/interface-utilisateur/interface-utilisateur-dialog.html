
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myInterfaceUtilisateurLabel">Create or edit a Interface Utilisateur</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.interfaceUtilisateur.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.interfaceUtilisateur.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codeInterface">Code Interface</label>
            <input type="text" class="form-control" name="codeInterface" id="field_codeInterface"
                    ng-model="vm.interfaceUtilisateur.codeInterface"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomInterface">Nom Interface</label>
            <input type="text" class="form-control" name="nomInterface" id="field_nomInterface"
                    ng-model="vm.interfaceUtilisateur.nomInterface"
                    />
        </div>
        <div class="form-group">
            <label for="field_fournisseurService">Service</label>
            <select class="form-control" id="field_Service" name="Service" ng-model="vm.interfaceUtilisateur.service" ng-options="serviceTraitement as serviceTraitement.nomService for serviceTraitement in vm.servicetraitements track by serviceTraitement.id">
                <option value=""></option>
            </select>
        </div>
       
        <div class="form-group">
            <label class="control-label" for="field_typeInterface">Type Interface</label>
            <select class="form-control" name="typeInterface" ng-model="vm.interfaceUtilisateur.typeInterface" id="field_typeInterface">
                <option value="REQUEST">REQUEST</option>
                <option value="RESPONSE">RESPONSE</option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
