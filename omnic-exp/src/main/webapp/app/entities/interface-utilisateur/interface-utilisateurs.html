<div>
    <h2>Interface Utilisateurs</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="interface-utilisateur.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Interface Utilisateur
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Code Interface</span></th>
                    <th><span>Nom Interface</span></th>
                    <th><span>Type Interface</span></th>
                     <th><span>Service</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="interfaceUtilisateur in vm.interfaceUtilisateurs track by interfaceUtilisateur.id">
                    <td><a ui-sref="interface-utilisateur-detail({id:interfaceUtilisateur.id})">{{interfaceUtilisateur.id}}</a></td>
                    <td>{{interfaceUtilisateur.codeInterface}}</td>
                    <td>{{interfaceUtilisateur.nomInterface}}</td>
                    <td>{{interfaceUtilisateur.typeInterface}}</td>
                      <td>{{interfaceUtilisateur.service.nomService}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="interface-utilisateur-detail({id:interfaceUtilisateur.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="interface-utilisateur.edit({id:interfaceUtilisateur.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="interface-utilisateur.delete({id:interfaceUtilisateur.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            
                              <button type="submit"
                                    ui-sref="parametre-utilisateur({idinterface:interfaceUtilisateur.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-cog"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
