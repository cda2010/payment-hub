
<div>
    <h2><span>Interface Utilisateur</span> {{vm.interfaceUtilisateur.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Code Interface</span></dt>
        <dd>
            <span>{{vm.interfaceUtilisateur.codeInterface}}</span>
        </dd>
        <dt><span>Nom Interface</span></dt>
        <dd>
            <span>{{vm.interfaceUtilisateur.nomInterface}}</span>
        </dd>
        <dt><span>Type Interface</span></dt>
        <dd>
            <span>{{vm.interfaceUtilisateur.typeInterface}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="interface-utilisateur-detail.edit({id:vm.interfaceUtilisateur.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
