
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myParametreLabel">Create or edit a Parametre</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.parametre.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.parametre.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomParametre">Nom Parametre</label>
            <input type="text" class="form-control" name="nomParametre" id="field_nomParametre"
                    ng-model="vm.parametre.nomParametre"
                    required/>
            <div ng-show="editForm.nomParametre.$invalid">
                <p class="help-block"
                    ng-show="editForm.nomParametre.$error.required">
                    This field is required.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="field_typeParametre">Type Parametre</label>
            <select class="form-control" name="typeParametre" ng-model="vm.parametre.typeParametre" id="field_typeParametre" required>
                <option value="STRING">STRING</option>
                <option value="DOUBLE">DOUBLE</option>
                <option value="INTEGER">INTEGER</option>
                <option value="FLOAT">FLOAT</option>
                <option value="LONG">LONG</option>
            </select>
            <div ng-show="editForm.typeParametre.$invalid">
                <p class="help-block"
                    ng-show="editForm.typeParametre.$error.required">
                    This field is required.
                </p>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
