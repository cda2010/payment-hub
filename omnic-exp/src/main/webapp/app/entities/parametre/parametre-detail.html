
<div>
    <h2><span>Parametre</span> {{vm.parametre.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Nom Parametre</span></dt>
        <dd>
            <span>{{vm.parametre.nomParametre}}</span>
        </dd>
        <dt><span>Type Parametre</span></dt>
        <dd>
            <span>{{vm.parametre.typeParametre}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="parametre-detail.edit({id:vm.parametre.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
