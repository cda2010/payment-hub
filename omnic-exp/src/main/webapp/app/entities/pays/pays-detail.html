
<div>
    <h2><span>Pays</span> {{vm.pays.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Nom Pays</span></dt>
        <dd>
            <span>{{vm.pays.nomPays}}</span>
        </dd>
        <dt><span>Fournisseur Service</span></dt>
        <dd>
            <a ui-sref="fournisseur-service-detail({id:vm.pays.fournisseurService.id})">{{vm.pays.fournisseurService.id}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="pays-detail.edit({id:vm.pays.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
