<div>
    <h2>Parametre Methodes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="parametre-methode.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Parametre Methode
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Nom Parametre </span></th>
                     <th><span>code Parametre </span></th>
                    <th><span>Valeur</span></th>
                    <th><span>Methode</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="parametreMethode in vm.parametreMethodes track by parametreMethode.id">
                    <td>{{parametreMethode.id}}</td>
                    <td>{{parametreMethode.nomParametre}}</td>
                     <td>{{parametreMethode.codeParametre}}</td>
                    <td>{{parametreMethode.valeur}}</td>
                    <td>
                       {{parametreMethode.methode.id}}
                    </td>
                     <td>
                       {{parametreMethode.categorieParam}}
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="parametre-methode-detail({id:parametreMethode.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-methode.edit({id:parametreMethode.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-methode.delete({id:parametreMethode.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
