
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myServiceTraitementLabel">Create or edit a Service Traitement</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.serviceTraitement.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.serviceTraitement.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codeService">Code Service</label>
            <input type="text" class="form-control" name="codeService" id="field_codeService"
                    ng-model="vm.serviceTraitement.codeService"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomService">Nom Service</label>
            <input type="text" class="form-control" name="nomService" id="field_nomService"
                    ng-model="vm.serviceTraitement.nomService"
                    />
        </div>

        <div class="form-group">
            <label for="field_fournisseurService">Fournisseur Service</label>
            <select class="form-control" id="field_fournisseurService" name="fournisseurService" ng-model="vm.serviceTraitement.fournisseurService" ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurservices track by fournisseurService.id">
                <option value=""></option>
            </select>
        </div>
       
       
        <div class="form-group">
            <label for="field_typeService">Type Service</label>
            <select class="form-control" id="field_typeService" name="typeService" ng-model="vm.serviceTraitement.typeService">
                <option value="PAIEMENTFACTURE"> Paiement de facture</option>
                <option value="TRANSFERTARGENT">Transfert d'argent</option>
                
                <option value="ENVOIARGENT"> Envoi d'argent</option>
                <option value="RECEPTIONARGENT">Réception d'argent</option>
                 <option value="ACHATUNITE"> Achat d'unité</option>
                           
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
