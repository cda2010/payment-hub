
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFournisseurServiceLabel">Create or edit a Fournisseur Service</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.fournisseurService.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.fournisseurService.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codeFse">Code Fse</label>
            <input type="text" class="form-control" name="codeFse" id="field_codeFse"
                    ng-model="vm.fournisseurService.codeFse"
                    required/>
            <div ng-show="editForm.codeFse.$invalid">
                <p class="help-block"
                    ng-show="editForm.codeFse.$error.required">
                    This field is required.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nom">Nom</label>
            <input type="text" class="form-control" name="nom" id="field_nom"
                    ng-model="vm.fournisseurService.nom"
                    required/>
            <div ng-show="editForm.nom.$invalid">
                <p class="help-block"
                    ng-show="editForm.nom.$error.required">
                    This field is required.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" for="field_statut">Statut</label>
            <input type="text" class="form-control" name="statut" id="field_statut"
                    ng-model="vm.fournisseurService.statut"
                    />
        </div>
        
          <div class="form-group">
            <label class="control-label" for="field_groupe">Pays</label>
             <select class="form-control" id="field_pays" name="fournisseurPays" ng-model="vm.fournisseurService.pays" ng-options="pays as pays.nomPays for pays in vm.payss track by pays.id">
                <option value=""></option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="control-label" for="field_groupe">Groupe</label>
            <select class="form-control" name="groupe" ng-model="vm.fournisseurService.groupe" id="field_groupe">
                <option value="ETA">ETA</option>
                <option value="ETC">ETC</option>
                <option value="ENF">ENF</option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
