<div>
    <h2>Services</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="service.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Service
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Code Service</span></th>
                    <th><span>Nom Service</span></th>
                    <th><span>Fournisseur Service</span></th>
                    <th><span>Interface Utilisateur</span></th>
                    <th><span>Utilise</span></th>
                    <th><span>Type Service</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="service in vm.services track by service.id">
                    <td><a ui-sref="service-detail({id:service.id})">{{service.id}}</a></td>
                    <td>{{service.codeService}}</td>
                    <td>{{service.nomService}}</td>
                    <td>
                        <a ui-sref="fournisseur-service-detail({id:service.fournisseurService.id})">{{service.fournisseurService.id}}</a>
                    </td>
                    <td>
                        <a ui-sref="interface-utilisateur-detail({id:service.interfaceUtilisateur.id})">{{service.interfaceUtilisateur.id}}</a>
                    </td>
                    <td>
                        <span ng-repeat="utilise in service.utilises">
                            <a class="form-control-static" ui-sref="methode-detail({id: utilise.id})">{{utilise.id}}</a>{{$last ? '' : ', '}}
                        </span>
                    </td>
                    <td>
                        <a ui-sref="type-service-detail({id:service.typeService.id})">{{service.typeService.id}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="service-detail({id:service.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="service.edit({id:service.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="service.delete({id:service.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
