
<div>
    <h2><span>Ligne Operation</span> {{vm.ligneOperation.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Text Ligne Transaction</span></dt>
        <dd>
            <span>{{vm.ligneOperation.textLigneTransaction}}</span>
        </dd>
        <dt><span>Reponse</span></dt>
        <dd>
            <span>{{vm.ligneOperation.reponse}}</span>
        </dd>
        <dt><span>Codereponse</span></dt>
        <dd>
            <span>{{vm.ligneOperation.codereponse}}</span>
        </dd>
        <dt><span>Operation</span></dt>
        <dd>
            <a ui-sref="operation-detail({id:vm.ligneOperation.operation.id})">{{vm.ligneOperation.operation.id}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="ligne-operation-detail.edit({id:vm.ligneOperation.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
