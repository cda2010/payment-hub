
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneOperationLabel">Create or edit a Ligne Operation</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ligneOperation.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ligneOperation.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_textLigneTransaction">Text Ligne Transaction</label>
            <input type="text" class="form-control" name="textLigneTransaction" id="field_textLigneTransaction"
                    ng-model="vm.ligneOperation.textLigneTransaction"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_reponse">Reponse</label>
            <input type="text" class="form-control" name="reponse" id="field_reponse"
                    ng-model="vm.ligneOperation.reponse"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codereponse">Codereponse</label>
            <input type="text" class="form-control" name="codereponse" id="field_codereponse"
                    ng-model="vm.ligneOperation.codereponse"
                    />
        </div>

        <div class="form-group">
            <label for="field_operation">Operation</label>
            <select class="form-control" id="field_operation" name="operation" ng-model="vm.ligneOperation.operation" ng-options="operation as operation.id for operation in vm.operations track by operation.id">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
