
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="mySchemaEcritureLabel">Create or edit a Schema Ecriture</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.schemaEcriture.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.schemaEcriture.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomSchema">Nom Schema</label>
            <input type="text" class="form-control" name="nomSchema" id="field_nomSchema"
                    ng-model="vm.schemaEcriture.nomSchema"
                    />
        </div>
        <div class="form-group">
            <label for="field_typeService">Type Service</label>
            <select class="form-control" id="field_typeService" name="typeService" ng-model="vm.schemaEcriture.typeService">
                <option value="PAIEMENTFACTURE"> Paiement de facture</option>
                <option value="TRANSFERTARGENT">Transfert d'argent</option>
                
                <option value="ENVOIARGENT"> Envoi d'argent</option>
                <option value="RECEPTIONARGENT">Réception d'argent</option>
                 <option value="ACHATUNITE"> Achat d'unité</option>
                           
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codeGroovy">Code Groovy</label>
          
            
              <textarea rows="4" cols="50" style="height:150px;" class="form-control" name="codeGroovy" id="field_codeGroovy"
                  ng-model="vm.schemaEcriture.codeGroovy">
                            
              </textarea>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
