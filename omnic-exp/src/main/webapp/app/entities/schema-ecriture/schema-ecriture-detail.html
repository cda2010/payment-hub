
<div>
    <h2><span>Schema Ecriture</span> {{vm.schemaEcriture.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Nom Schema</span></dt>
        <dd>
            <span>{{vm.schemaEcriture.nomSchema}}</span>
        </dd>
        <dt><span>Code Groovy</span></dt>
        <dd>
            <span>{{vm.schemaEcriture.codeGroovy}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="schema-ecriture-detail.edit({id:vm.schemaEcriture.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
