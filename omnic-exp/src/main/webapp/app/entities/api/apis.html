<div>
    <h2>Apis</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="api.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Api
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Nom Api</span></th>
                    <th><span>Type</span></th>
                    <th><span>Host</span></th>
                    <th><span>Port</span></th>
                    <th><span>Code Api</span></th>
                    <th><span>Fournisseur Service</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="api in vm.apis track by api.id">
                    <td><a ui-sref="api-detail({id:api.id})">{{api.id}}</a></td>
                    <td>{{api.nomApi}}</td>
                    <td>{{api.type}}</td>
                    <td>{{api.host}}</td>
                    <td>{{api.port}}</td>
                    <td>{{api.codeApi}}</td>
                    <td>
                       {{api.fournisseurService.nom}}
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="api-detail({id:api.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="api.edit({id:api.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="api.delete({id:api.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                              <button type="submit"
                                    ui-sref="methode({idapi:api.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-cog"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
