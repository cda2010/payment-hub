<div>
    <h2>Comptes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                 <button class="btn btn-primary" ui-sref="relation" >
                    <span class="glyphicon glyphicon-arrow-left"></span>
                    <span >
                      Retour
                    </span>
                </button>
                <button class="btn btn-primary" ui-sref="compte.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Compte
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Code Banque</span></th>
                    <th><span>Code Agence</span></th>
                     <th><span>Numero Compte</span></th>
                      <th><span>Clé</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="compte in vm.comptes track by compte.id">
                    <td><a ui-sref="compte-detail({id:compte.id})">{{compte.id}}</a></td>
                      <td>{{compte.codeBanque}}</td>
                    <td>{{compte.codeAgence}}</td>
                      <td>{{compte.numeroCompte}}</td>
                        <td>{{compte.cle}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="compte-detail({id:compte.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="compte.edit({id:compte.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="compte.delete({id:compte.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
