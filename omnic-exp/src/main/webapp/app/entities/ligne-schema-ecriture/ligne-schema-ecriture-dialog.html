
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneSchemaEcritureLabel">Create or edit a Ligne Schema Ecriture</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ligneSchemaEcriture.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ligneSchemaEcriture.id" readonly />
        </div>
     
  <div class="form-group">
            <label class="control-label" for="field_typeMethode">Type méthode</label>
            <select class="form-control" name="typeMethode" ng-model="vm.ligneSchemaEcriture.typeMethode" id="field_typeMethode">
                <option value="DEBIT">DEBIT</option>
                <option value="CREDIT">CREDIT</option>
                  <option value="CONSULTATION">CONSULTATION</option>
            </select>
        </div>
           <div class="form-group">
            <label class="control-label" for="field_valeur">Api à utiliser</label>
             <select class="form-control" id="field_categorieParam" name="categorieParam" ng-model="vm.ligneSchemaEcriture.apiUtil">
                <option value="FSESOURCE">FSE SOURCE</option>
                <option value="FSEDESTINATAIRE">FSE DESTINATAIRE</option>
               
            </select>
        </div>
        <div class="form-group" >
            <label for="field_relligneschema">Relligneschema</label>
            <select class="form-control" id="field_relligneschema" name="relligneschema" ng-model="vm.ligneSchemaEcriture.schemaEcriture" ng-options="schemaEcriture as schemaEcriture.id for schemaEcriture in vm.schemaecritures track by schemaEcriture.id" required>
                <option value=""></option>
            </select>
        </div>
        <div ng-show="editForm.relligneschema.$invalid">
            <p class="help-block"
                ng-show="editForm.relligneschema.$error.required">
                This field is required.
            </p>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
