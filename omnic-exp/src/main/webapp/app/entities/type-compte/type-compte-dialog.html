
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTypeCompteLabel">Create or edit a Type Compte</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.typeCompte.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.typeCompte.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomTypeCompte">Nom Type Compte</label>
            <input type="text" class="form-control" name="nomTypeCompte" id="field_nomTypeCompte"
                    ng-model="vm.typeCompte.nomTypeCompte"
                    />
        </div>
   <div class="form-group">
       
            <label class="control-label" for="field_nomTypeCompte">Code Parametre(le code paramètre doit être celui définit dans le schéma d'écriture) </label>
            <input type="text" class="form-control" name="nomTypeCompte" id="field_nomTypeCompte"
                    ng-model="vm.typeCompte.codeParametre"
                    />
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>
