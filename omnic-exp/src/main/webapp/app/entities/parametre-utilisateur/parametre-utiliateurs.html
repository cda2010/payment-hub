<div>
    <h2>Parametre Utiliateurs</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="parametre-utilisateur.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span >
                        Create new Parametre Utiliateur
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                     <th><span>code Parametre Util</span></th>
                    <th><span>Nom Parametre Util</span></th>
                    <th><span>Valeur</span></th>
                    <th><span>Interface Utilisateur</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="parametreUtiliateur in vm.parametreUtiliateurs track by parametreUtiliateur.id">
                    <td><a ui-sref="parametre-utiliateur-detail({id:parametreUtiliateur.id})">{{parametreUtiliateur.id}}</a></td>
                      <td>{{parametreUtiliateur.codeParametre}}</td>
                    <td>{{parametreUtiliateur.nomParametre}}</td>
                    
                    <td>{{parametreUtiliateur.valeur}}</td>
                    <td>
                        <a ui-sref="interface-utilisateur-detail({id:parametreUtiliateur.interfaceUtilisateur.id})">{{parametreUtiliateur.interfaceUtilisateur.id}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="parametre-utiliateur-detail({id:parametreUtiliateur.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-utiliateur.edit({id:parametreUtiliateur.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-utiliateur.delete({id:parametreUtiliateur.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
