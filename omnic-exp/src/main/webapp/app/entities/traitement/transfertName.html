




{{vm.liste}}


<form id="editForm" name="editForm" role="form" novalidate ng-submit="vm.send()">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myInterfaceUtilisateurLabel">Transfertss</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        
        
        <select class="form-control" id="field_service" name="codeService" ng-model="vm.codeservice" ng-options="service as service.nomService for service in vm.servicetraitements track by service.id" ng-change="vm.onChangeService(vm.codeservice.id)">
                <option value=""></option>
        </select>
         <div class="form-group">
            <label class="control-label" for="field_valeur">Valeur</label>
            <input type="text" class="form-control" name="cardNumberCredit" id="field_valeur"
                    ng-model="vm.virement.compteSource"
                    />
        </div>
 
           <div class="form-group">
            <label class="control-label" for="field_valeur">Valeur</label>
            <input type="text" class="form-control" name="cardNumberDebit" id="field_valeur"
                    ng-model="vm.virement.compteDest"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Save</span>
        </button>
    </div>
</form>

{{vm.resultat}}
<table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span>ID</span></th>
                    <th><span>Code</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
               
                <tr ng-repeat="traitement in vm.resultat">
                  
                    <td>{{traitement.errCode}}</td>
                     <td>{{traitement.msg}}</td>
                    <td class="text-right">
                        
                        <div ng-repeat="fact in traitement.responseEntity"> 
                        {{fact.montant}}-{{fact.numeroPolice}} -{{fact.numeroFacture}}
                         </div>
                    </td>
                </tr>
            </tbody>
        </table>
