spring:
  application:
    name: payment-pricing
  profiles:
    default: prod
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5437/payment_pricing}
    username: ${PRICING_DB_USER:pricing}
    password: ${PRICING_DB_PASSWORD:pricing}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        # Paramètres JSONB des tranches : décimaux lus en BigDecimal, jamais en double.
        type:
          json_format_mapper: com.gateway.payment.pricing.tarif.config.DecimalJsonFormatMapper
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      use-big-decimal-for-floats: true
    generator:
      write-bigdecimal-as-plain: true
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8095}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

pricing:
  # payment-network : positions des unités ciblées par les grilles (source, destination).
  reseau:
    url: ${NETWORK_URL:http://localhost:8096}
    cache-ttl: ${NETWORK_CACHE_TTL:PT1M}
    timeout: ${NETWORK_TIMEOUT:PT3S}
  security:
    keycloak:
      enabled: ${KEYCLOAK_ENABLED:true}
      issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/payment}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
      audience: ${KEYCLOAK_AUDIENCE:payment-api}
    # Anciens tokens payment-2 : identiques à gateway.security.jwt.* de payment-2 (émetteur).
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits}
      issuer: ${JWT_ISSUER:payment-gateway}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4210,http://127.0.0.1:4210,http://localhost:8100,http://127.0.0.1:8100}

logging:
  level:
    root: INFO
    com.gateway.payment.pricing: INFO
