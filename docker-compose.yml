services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      # Connexions max pour PgBouncer / 3–4 backends
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - gateway_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: gateway-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/payment_gateway
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 400
      DEFAULT_POOL_SIZE: 80
      MIN_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 10
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: payment-channel-api/Dockerfile
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: payment_gateway
      DB_USER: gateway
      DB_PASSWORD: gateway
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer:5432/payment_gateway
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_REDIS_ENABLED: "true"
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:4200
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
    # Scale: docker compose up --scale backend=3
    deploy:
      replicas: 3
    ports:
      - "8080-8082:8080"

  # Référentiel Identité : application et base dédiées (contrat /api/v1/identity/**)
  identity-postgres:
    image: postgres:16-alpine
    container_name: identity-postgres
    environment:
      POSTGRES_DB: payment_identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5436:5432"
    volumes:
      - identity_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d payment_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: payment-identity/Dockerfile
    depends_on:
      identity-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IDENTITY_DB_URL: jdbc:postgresql://identity-postgres:5432/payment_identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: identity
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      # Anciens tokens payment-2 (même secret et même issuer que le backend), le temps de la bascule
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8094
    ports:
      - "8094:8094"

  # Moteur Pricing (frais, taux, limites) : application et base dédiées (contrat /api/v1/pricing/**)
  pricing-postgres:
    image: postgres:16-alpine
    container_name: pricing-postgres
    environment:
      POSTGRES_DB: payment_pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports:
      - "5437:5432"
    volumes:
      - pricing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d payment_pricing"]
      interval: 5s
      timeout: 5s
      retries: 10

  pricing:
    build:
      context: .
      dockerfile: payment-pricing/Dockerfile
    depends_on:
      pricing-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PRICING_DB_URL: jdbc:postgresql://pricing-postgres:5432/payment_pricing
      PRICING_DB_USER: pricing
      PRICING_DB_PASSWORD: pricing
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      # Anciens tokens payment-2 (même secret et même issuer que le backend), le temps de la bascule
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8095
      # Positions des unités ciblées par les grilles (source, destination)
      NETWORK_URL: http://network:8096
    ports:
      - "8095:8095"

  # Réseau de distribution (unités d'organisation, regroupements) : application et base dédiées (contrat /api/v1/network/**)
  network-postgres:
    image: postgres:16-alpine
    container_name: network-postgres
    environment:
      POSTGRES_DB: payment_network
      POSTGRES_USER: network
      POSTGRES_PASSWORD: network
    ports:
      - "5438:5432"
    volumes:
      - network_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U network -d payment_network"]
      interval: 5s
      timeout: 5s
      retries: 10

  network:
    build:
      context: .
      dockerfile: payment-network/Dockerfile
    depends_on:
      network-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NETWORK_DB_URL: jdbc:postgresql://network-postgres:5432/payment_network
      NETWORK_DB_USER: network
      NETWORK_DB_PASSWORD: network
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      # Anciens tokens payment-2 (même secret et même issuer que le backend), le temps de la bascule
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8096
    ports:
      - "8096:8096"

  # Alias de comptes (Party / Org identity, Unité network) : application et base dédiées
  alias-postgres:
    image: postgres:16-alpine
    container_name: alias-postgres
    environment:
      POSTGRES_DB: payment_alias
      POSTGRES_USER: alias
      POSTGRES_PASSWORD: alias
    ports:
      - "5439:5432"
    volumes:
      - alias_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alias -d payment_alias"]
      interval: 5s
      timeout: 5s
      retries: 10

  alias:
    build:
      context: .
      dockerfile: payment-alias/Dockerfile
    depends_on:
      alias-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ALIAS_DB_URL: jdbc:postgresql://alias-postgres:5432/payment_alias
      ALIAS_DB_USER: alias
      ALIAS_DB_PASSWORD: alias
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8097
    ports:
      - "8097:8097"

  content-postgres:
    image: postgres:16-alpine
    container_name: content-postgres
    environment:
      POSTGRES_DB: payment_content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
    ports:
      - "5443:5432"
    volumes:
      - content_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d payment_content"]
      interval: 5s
      timeout: 5s
      retries: 10

  content:
    build:
      context: .
      dockerfile: payment-content/Dockerfile
    depends_on:
      content-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONTENT_DB_URL: jdbc:postgresql://content-postgres:5432/payment_content
      CONTENT_DB_USER: content
      CONTENT_DB_PASSWORD: content
      CONTENT_MEDIA_DIR: /var/lib/content-media
      CONTENT_MEDIA_PUBLIC_URL: http://localhost:8098/api/v1/content/media
      CONTENT_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONTENT_REDIS_DB: "2"
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210,http://localhost:8100
      SERVER_PORT: 8098
    volumes:
      - content_media_data:/var/lib/content-media
    ports:
      - "8098:8098"

  # Commissionnement (répartition des droits) — ports distincts de payment-content (8098/5443)
  commission-postgres:
    image: postgres:16-alpine
    container_name: commission-postgres
    environment:
      POSTGRES_DB: payment_commission
      POSTGRES_USER: commission
      POSTGRES_PASSWORD: commission
    ports:
      - "5444:5432"
    volumes:
      - commission_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commission -d payment_commission"]
      interval: 5s
      timeout: 5s
      retries: 10

  commission:
    build:
      context: .
      dockerfile: payment-commission/Dockerfile
    depends_on:
      commission-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      COMMISSION_DB_URL: jdbc:postgresql://commission-postgres:5432/payment_commission
      COMMISSION_DB_USER: commission
      COMMISSION_DB_PASSWORD: commission
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8100
    ports:
      - "8100:8100"

  # Moteur de règles métier / réglementaires (plafonds, cumuls) — distinct de soft-rules catalogue
  rules-postgres:
    image: postgres:16-alpine
    container_name: rules-postgres
    environment:
      POSTGRES_DB: payment_rules
      POSTGRES_USER: rules
      POSTGRES_PASSWORD: rules
    ports:
      - "5441:5432"
    volumes:
      - rules_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rules -d payment_rules"]
      interval: 5s
      timeout: 5s
      retries: 10

  rules:
    build:
      context: .
      dockerfile: payment-rules/Dockerfile
    depends_on:
      rules-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RULES_DB_URL: jdbc:postgresql://rules-postgres:5432/payment_rules
      RULES_DB_USER: rules
      RULES_DB_PASSWORD: rules
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8099
    ports:
      - "8099:8099"

  # Fournisseur d'identité (OIDC). Realm importé au premier démarrage depuis keycloak/realm-payment.json.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: payment-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer fixe (http://localhost:8180/realms/payment) même quand les services passent par keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  # Coffre documentaire (KYC / justificatifs) — métadonnées Postgres + fichiers volume
  documents-postgres:
    image: postgres:16-alpine
    container_name: documents-postgres
    environment:
      POSTGRES_DB: payment_documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents
    ports:
      - "5442:5432"
    volumes:
      - documents_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d payment_documents"]
      interval: 5s
      timeout: 5s
      retries: 10

  documents:
    build:
      context: .
      dockerfile: payment-documents/Dockerfile
    depends_on:
      documents-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DOCUMENTS_DB_URL: jdbc:postgresql://documents-postgres:5432/payment_documents
      DOCUMENTS_DB_USER: documents
      DOCUMENTS_DB_PASSWORD: documents
      DOCUMENTS_STORAGE_DIR: /var/lib/payment-documents
      DOCUMENTS_PUBLIC_URL: http://localhost:8101/api/v1/documents
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4210,http://127.0.0.1:4210,http://localhost:8100
      SERVER_PORT: 8101
    volumes:
      - documents_files_data:/var/lib/payment-documents
    ports:
      - "8101:8101"

  # Coffre et tontine — ports distincts de payment-documents (8101/5442)
  divers-postgres:
    image: postgres:16-alpine
    container_name: divers-postgres
    environment:
      POSTGRES_DB: payment_divers
      POSTGRES_USER: divers
      POSTGRES_PASSWORD: divers
    ports:
      - "5445:5432"
    volumes:
      - divers_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divers -d payment_divers"]
      interval: 5s
      timeout: 5s
      retries: 10

  divers:
    build:
      context: .
      dockerfile: payment-divers/Dockerfile
    depends_on:
      divers-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DIVERS_DB_URL: jdbc:postgresql://divers-postgres:5432/payment_divers
      DIVERS_DB_USER: divers
      DIVERS_DB_PASSWORD: divers
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205,http://127.0.0.1:4205,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8102
    ports:
      - "8102:8102"

  kafka:
    image: apache/kafka:3.8.1
    container_name: payment-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

  fidelite:
    build:
      context: .
      dockerfile: payment-fidelite/Dockerfile
    depends_on:
      fidelite-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FIDELITE_DB_URL: jdbc:postgresql://fidelite-postgres:5432/payment_fidelite
      FIDELITE_DB_USER: fidelite
      FIDELITE_DB_PASSWORD: fidelite
      KEYCLOAK_ISSUER: http://localhost:8180/realms/payment
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/payment/protocol/openid-connect/certs
      JWT_SECRET: change-me-to-a-very-long-secret-key-at-least-256-bits
      JWT_ISSUER: payment-gateway
      CORS_ORIGINS: http://localhost:4200,http://localhost:4205,http://127.0.0.1:4205,http://localhost:4210,http://127.0.0.1:4210
      SERVER_PORT: 8103
    ports:
      - "8103:8103"

  fidelite-postgres:
    image: postgres:16-alpine
    container_name: fidelite-postgres
    environment:
      POSTGRES_DB: payment_fidelite
      POSTGRES_USER: fidelite
      POSTGRES_PASSWORD: fidelite
    ports:
      - "5446:5432"
    volumes:
      - fidelite_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fidelite -d payment_fidelite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gateway_pg_data:
  identity_pg_data:
  pricing_pg_data:
  network_pg_data:
  alias_pg_data:
  content_pg_data:
  content_media_data:
  commission_pg_data:
  rules_pg_data:
  documents_pg_data:
  documents_files_data:
  divers_pg_data:
  fidelite_pg_data:
  keycloak_data:
