# Profil dev : lancement local via PaymentGatewayApplication (IDE ou Maven)
# Base H2 en mémoire — aucune dépendance Docker/PostgreSQL requise.
gateway:
  bootstrap:
    providers: true

spring:
  datasource:
    url: jdbc:h2:mem:payment_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.gateway.payment: DEBUG
