spring:
  application:
    name: payment-documents
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB
  datasource:
    url: ${DOCUMENTS_DB_URL:jdbc:postgresql://localhost:5442/payment_documents}
    username: ${DOCUMENTS_DB_USER:documents}
    password: ${DOCUMENTS_DB_PASSWORD:documents}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8101}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

documents:
  storage:
    dir: ${DOCUMENTS_STORAGE_DIR:./data/documents}
    max-size-bytes: ${DOCUMENTS_MAX_BYTES:10485760}
    public-base-url: ${DOCUMENTS_PUBLIC_URL:http://127.0.0.1:8101/api/v1/documents}
  security:
    keycloak:
      enabled: ${KEYCLOAK_ENABLED:true}
      issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/payment}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
      audience: ${KEYCLOAK_AUDIENCE:payment-api}
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits}
      issuer: ${JWT_ISSUER:payment-gateway}
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4205,http://127.0.0.1:4205,http://localhost:4210,http://127.0.0.1:4210,http://localhost:8100,http://127.0.0.1:8100}

inbox:
  kafka:
    enabled: ${INBOX_KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${INBOX_KAFKA_TOPIC:party.actions}

logging:
  level:
    root: INFO
    com.gateway.payment.documents: INFO
