spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/payment_documents
    username: documents
    password: documents

# spring-boot:run a pour répertoire le module : les fichiers déjà déposés sont à la racine du dépôt.
documents:
  storage:
    dir: ../data/documents

inbox:
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    topic: party.actions

logging:
  level:
    com.gateway.payment.documents: DEBUG
