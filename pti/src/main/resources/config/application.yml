# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================
logging:
  level:
    ROOT: INFO
    com.m2i.pti: INFO
   # org.apache.http.impl.conn.PoolingHttpClientConnectionManager: TRACE
   # org.springframework.transaction.interceptor: TRACE
    com.zaxxer.hikari: INFO
    
   # io.undertow: TRACE
management:
  security:
    roles: ADMIN
  context-path: /management
  health:
    mail:
      enabled: false #When using the MailService, configure an SMTP server and set this to true
spring:
  application:
    name: pti
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/payment
  main:
    lazy-initialization: true  
  zipkin:
      base-url: http://localhost:9411
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filevled in by maven when building the WAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
 
    active: dev
  cache:
    jcache:
       provider: org.ehcache.jsr107.EhcacheCachingProvider
  jackson:
    serialization.write_dates_as_timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  batch:
    job:
      enabled: false
  messages:
    basename: i18n/messages
  mvc:
    favicon:
      enabled: false
  thymeleaf:
    mode: XHTML
  http:
        multipart:
                  max-file-size: 128MB
                  max-request-size: 128MB
                  enabled: true
  kafka:
    consumer:
      bootstrapAddress: localhost:9092
    producer:
      bootstrapAddress: localhost:9092
security:
  basic:
    enabled: false
  oauth2:
    resource:
      filter-order: 3
    client:
      clientId: foo
      clientSecret: bar
      accessTokenUri: http://localhost:8080/sso-server/oauth/token
      userAuthorizationUri: http://localhost:8080/sso-server/oauth/authorize
server:
  session:
    cookie:
      http-only: true
  servlet:
    session:
       timeout: 120s     
