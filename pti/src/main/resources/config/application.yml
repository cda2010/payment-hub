jhipster:
  async:
    core-pool-size: 5
    max-pool-size: 10000
    queue-capacity: 10000
  # By default CORS is disabled. Uncomment to enable.
  cors:
    allowed-origins: "*"
    allowed-methods: GET, PUT, POST, DELETE, OPTIONS
    allowed-headers: "*"
    exposed-headers:
    allow-credentials: true
    max-age: 1800
 # mail:
  #  from: pti@localhost
  swagger:
    default-include-pattern: /api/.*
    title: pti API
    description: pti API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license:
    license-url:
  ribbon:
    display-on-active-profiles: dev
  



