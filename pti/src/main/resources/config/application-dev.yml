jhipster:
    http:
        version: V_1_1 # To use HTTP/2 you will need SSL support (see above the "server.ssl" configuration)
    cache: # Cache configuration
        ehcache: # Ehcache configuration
            time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
            max-entries: 100 # Number of objects in each cache entry
    #CORS is only enabled by default with the "dev" profile, so BrowserSync can access the API
    cors:
        allowed-origins: "*"
        allowed-methods: GET, PUT, POST, DELETE, OPTIONS
        allowed-headers: "*"
        exposed-headers:
        allow-credentials: true
        max-age: 1800
    mail: # specific JHipster mail property, for standard properties see MailProperties
        from: pti@localhost
        base-url: http://127.0.0.1:8080
    metrics: # DropWizard Metrics configuration, used by MetricsConfiguration
        jmx.enabled: true
        graphite: # Use the "graphite" Maven profile to have the Graphite dependencies
            enabled: false
            host: localhost
            port: 2003
            prefix: pti
        prometheus: # Use the "prometheus" Maven profile to have the Prometheus dependencies
            enabled: false
            endpoint: /prometheusMetrics
        logs: # Reports Dropwizard metrics in the logs
            enabled: false
            report-frequency: 60 # in seconds
    logging:
        logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
            enabled: false
            host: localhost
            port: 5000
            queue-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://jhipster.github.io/common-application-properties/
# ===================================================================

application:

minio:
    folder: pti

pentaho:
    trans:
        dir: target/pti-trans

m2i:
    security:
        pti:
            ca:
                file:
                    linux: target/pti-files/ca
                    windows: target/pti-files/ca
            clientAllow:
                file:
                    linux: target/pti-files/client
                    windows: target/pti-files/client
            images:
                linux: target/pti-files/images
                windows: target/pti-files/images
            keys:
                path:
                    linux: target/pti-files/keys
                    windows: target/pti-files/keys
            pem:
                file:
                    linux: target/pti-files/pem
                    windows: target/pti-files/pem
            privatekeys:
                extension: .key
            publickeys:
                extension: .pub
            qrCode:
                linux: target/pti-files/qr
                windows: target/pti-files/qr
            scripts:
                genkeys:
                    linux: target/pti-files/genkeys.sh
                    windows: target/pti-files/genkeys.bat
