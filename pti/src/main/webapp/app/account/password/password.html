<div>
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <fieldset class="mf-fieldset mb10>">

             <legend><h2 data-translate="password.title" translate-values="{username: '{{vm.account.login}}'}">Password for [<b>{{vm.account.login}}</b>]</h2></legend>

                <div class="container">
                    <br/>
                    <div class="alert alert-dismissable alert-success" ng-if="vm.success" >
                        <marquee scrollamount="5" class="text-center">
                            Votre mot de passe a été réinitialisé.Veuillez vous reconnectez avec le mot de passe que vous venez de reçevoir sur votre telephone pour la changer
                        </marquee>
                    </div> <!-- Fin du bandeau d'alerte -->
                </div>

            <div class="alert alert-danger text-center" ng-show="vm.error" >
                Le mot de passe que vous avez saisi est incorrect
            </div>

            <form ng-show="!vm.success" name="form" role="form" novalidate ng-submit="vm.changePassword()" show-validation class="form-horizontal container-fluid">
                <div class="form-group">
                    <label class="control-label col-sm-4" mf-required for="password">Ancien mot de passe</label>
                    <div class="col-sm-8">
                    <input type="password" class="form-control" title="veuillez entrer votre mot de passe" id="password" name="password"
                           ng-model="vm.password.oldPassword" required>
                    </div>
                </div>

                <button type="submit" ng-disabled="form.$invalid" class="btn btn-primary pull-right" data-translate="password.form.button">Save</button>
            </form>
                <div class="mb10"></div>
            </fieldset>
        </div>
    </div>
</div>
