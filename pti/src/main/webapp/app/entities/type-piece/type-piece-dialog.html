<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTypePieceLabel" data-translate="ptiApp.typePiece.home.createOrEditLabel">Create or edit a Type Piece</h4>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.typePiece.codeTypePiece" for="field_codeTypePiece">Code Type Piece</label>

            <div class="col-sm-6">
                <input autocomplete="off"required type="text" class="form-control" name="codeTypePiece" id="field_codeTypePiece" ng-model="vm.typePiece.codeTypePiece" required/>
            </div>

        </div>
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.typePiece.libelleTypePiece" for="field_libelleTypePiece">Libelle Type Piece</label>

            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="libelleTypePiece" id="field_libelleTypePiece" ng-model="vm.typePiece.libelleTypePiece" required/>
            </div>

        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
