
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myPersonneMoraleLabel" data-translate="ptiApp.personneMorale.home.createOrEditLabel">Create or edit a Personne Morale</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.personneMorale.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.personneMorale.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.personneMorale.raisonSociale" for="field_raisonSociale">Raison Sociale</label>
            <div class="col-sm-6">
                    <input autocomplete="off"type="text" class="form-control" name="raisonSociale" id="field_raisonSociale"
                    ng-model="vm.personneMorale.raisonSociale"
                    required/>
            </div>
           
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.personneMorale.registreCommerce" for="field_registreCommerce">Registre Commerce</label>
            <div class="col-sm-6">
                    <input autocomplete="off"type="text" class="form-control" name="registreCommerce" id="field_registreCommerce"
                    ng-model="vm.personneMorale.registreCommerce"
                    />
            </div>
           
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.personneMorale.numreoIfu" for="field_numreoIfu">Numreo Ifu</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="numreoIfu" id="field_numreoIfu"
                    ng-model="vm.personneMorale.numreoIfu"
                    />
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
