<div>
    <h2 data-translate="ptiApp.personneMorale.home.title">Personne Morales</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="personne-morale.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.personneMorale.home.createLabel">
                        Create new Personne Morale
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="raisonSociale"><span data-translate="ptiApp.personneMorale.raisonSociale">Raison Sociale</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="registreCommerce"><span data-translate="ptiApp.personneMorale.registreCommerce">Registre Commerce</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="numreoIfu"><span data-translate="ptiApp.personneMorale.numreoIfu">Numreo Ifu</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="personneMorale in vm.personneMorales track by personneMorale.id">
                    <td><a ui-sref="personne-morale-detail({id:personneMorale.id})">{{personneMorale.id}}</a></td>
                    <td>{{personneMorale.raisonSociale}}</td>
                    <td>{{personneMorale.registreCommerce}}</td>
                    <td>{{personneMorale.numreoIfu}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="personne-morale-detail({id:personneMorale.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="personne-morale.edit({id:personneMorale.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="personne-morale.delete({id:personneMorale.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
