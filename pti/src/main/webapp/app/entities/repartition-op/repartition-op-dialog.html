
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myRepartitionOpLabel" data-translate="ptiApp.repartitionOp.home.createOrEditLabel">Create or edit a Repartition Op</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.repartitionOp.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.repartitionOp.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.repartitionOp.montant" for="field_montant">Montant</label>
            <input autocomplete="off"type="number" class="form-control" name="montant" id="field_montant"
                    ng-model="vm.repartitionOp.montant"
                    required/>
            <div ng-show="editForm.montant.$invalid">
                <p class="help-block"
                    ng-show="editForm.montant.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
                <p class="help-block"
                    ng-show="editForm.montant.$error.number" data-translate="entity.validation.number">
                    This field should be a number.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.repartitionOp.acteur" for="field_acteur">Acteur</label>
            <select class="form-control" name="acteur" ng-model="vm.repartitionOp.acteur" id="field_acteur" required>
                <option value="COMP" data-translate="ptiApp.Acteur.COMP">COMP</option>
                <option value="ACQ" data-translate="ptiApp.Acteur.ACQ">ACQ</option>
                <option value="EM" data-translate="ptiApp.Acteur.EM">EM</option>
            </select>
            <div ng-show="editForm.acteur.$invalid">
                <p class="help-block"
                    ng-show="editForm.acteur.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
            </div>
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.repartitionOp.operation" for="field_operation">Operation</label>
            <select class="form-control" id="field_operation" name="operation" ng-model="vm.repartitionOp.operationId" ng-options="operation.id as operation.id for operation in vm.operations"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
