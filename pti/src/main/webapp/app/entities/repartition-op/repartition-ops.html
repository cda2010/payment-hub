<div>
    <h2 data-translate="ptiApp.repartitionOp.home.title">Repartition Ops</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="repartition-op.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.repartitionOp.home.createLabel">
                        Create new Repartition Op
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="montant"><span data-translate="ptiApp.repartitionOp.montant">Montant</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="acteur"><span data-translate="ptiApp.repartitionOp.acteur">Acteur</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="operationId"><span data-translate="ptiApp.repartitionOp.operation">Operation</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="repartitionOp in vm.repartitionOps track by repartitionOp.id">
                    <td><a ui-sref="repartition-op-detail({id:repartitionOp.id})">{{repartitionOp.id}}</a></td>
                    <td>{{repartitionOp.montant}}</td>
                    <td data-translate="{{'ptiApp.Acteur.' + repartitionOp.acteur}}">{{repartitionOp.acteur}}</td>
                    <td>
                        <a ui-sref="operation-detail({id:repartitionOp.operationId})">{{repartitionOp.operationId}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="repartition-op-detail({id:repartitionOp.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartition-op.edit({id:repartitionOp.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartition-op.delete({id:repartitionOp.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
