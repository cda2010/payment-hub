
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFactureLabel" >
            <span ng-if="vm.facture.id">Modifier la facture N°: {{vm.facture.id}} </span>
            <span ng-if="! vm.facture.id">Générer des factures</span>
        </h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.facture.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.facture.id" readonly />
        </div>

        <div class="form-group">
            <label for="field_facturier">Produit</label>
            <select class="form-control" id="field_facturier" name="facturier"
                    ng-model="vm.facture.produit.id"
                    ng-options="produit.id as produit.nomProduit+'( '+produit.facturier.nomFacturier+' )' for produit in vm.produits">
            </select>
        </div>

        <div class="form-group">
            <label class="control-label"  for="field_referenceFacature">Préfixe référence</label>
            <input type="text" class="form-control" name="referenceFacature" id="field_referenceFacature"
                    ng-model="vm.facture.referenceFacature" required
                    />
        </div>

        <div class="form-group">
            <label class="control-label" for="field_montantFacture">Montant</label>
            <input type="text" class="form-control" name="montantFacture" id="field_montantFacture"
                    ng-model="vm.facture.montantFacture" required
                    />
        </div>

        <div ng-if="! vm.facture.id" class="form-group">
            <label class="control-label" for="field_nombre">Nombre</label>
            <input type="number" min="1" class="form-control" name="montantFacture" id="field_nombre"
                   ng-model="vm.nombre" required
            />
        </div>
        <div ng-if="vm.facture.id" class="form-group">
            <label class="control-label" data-translate="ptiApp.facture.referencePaiement" for="field_referencePaiement">Reference Paiement</label>
            <input type="text" class="form-control" name="referencePaiement" id="field_referencePaiement"
                    ng-model="vm.facture.referencePaiement"
                    />
        </div>
        <div ng-if="vm.facture.id" class="form-group">
            <label class="control-label" data-translate="ptiApp.facture.datePaiement" for="field_datePaiement">Date Paiement</label>
            <input type="date" class="form-control" name="datePaiement" id="field_datePaiement"
                    ng-model="vm.facture.datePaiement"
                    />
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
