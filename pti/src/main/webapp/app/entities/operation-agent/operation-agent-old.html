<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal well">

    <div class="modal-header">
        <h4 class="modal-title" id="myDeviseLabel">Choisir Organisation</h4>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div id="simplewizard" class="wizard" data-target="#simplewizard-steps">
                    <ul class="steps">
                        <li data-target="#simplewizardstep1" ng-repeat="step in vm.steps"
                            ng-class="{active: $index == vm.getCurrentStepIndex()}">
                            <span class="step">{{$index + 1}}</span>{{step}}<span class="chevron"></span>
                        </li>
                    </ul>
                </div>

                <div class="step-content" id="simplewizard-steps">
                    <div ng-if="vm.showOnglet('Organisations')" class="step-pane active"
                         ng-class="{active: $index == vm.getCurrentStepIndex()}" id="simplewizardstep1">
                        <fieldset class="mf-fieldset">
                            <legend>Choisir l'organisation</legend>
                            <div class="form-group" ng-if="(vm.typeActeur=='MASTER'||vm.typeActeur=='MARCHAND' || vm.typeActeur=='SOUS_DISTRIBUTEUR' || vm.typeActeur=='FSE' || vm.typeActeur=='AGENCE' || vm.typeActeur=='PAYS') || vm.paysId!=null">
                                <label mf-required class="control-label col-sm-4" for="field_pays">Pays</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_pays" name="pays" ng-model="vm.paysId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationPays">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" title="Sélectionnez le pays" class="btn btn-primary btn-xs" j-select-dialog
                                   j-multiple="false" j-model="vm.paysId" j-list="vm.organisationPays" j-columns='vm.organisationColums'
                                   j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>

                            <div class="form-group" ng-if="(vm.typeActeur=='MASTER'||vm.typeActeur=='MARCHAND' || vm.typeActeur=='SOUS_DISTRIBUTEUR' || vm.typeActeur=='FSE' || vm.typeActeur=='AGENCE') || vm.fseId!=null">
                                <label mf-required class="control-label col-sm-4" for="field_fse">FSE</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_fse" name="fse" ng-model="vm.fseId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationFSE">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.paysId==null " title="Sélectionnez le fse"
                                   class="btn btn-primary btn-xs" j-select-dialog j-multiple="false" j-model="vm.fseId"
                                   j-list="vm.organisationFSE" j-columns='vm.organisationColums' j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4" for="field_typeUoActeur">Type acteur</label>
                                <div class="col-sm-6">
                                    <select id="field_typeUoActeur" required class="form-control" name="type" ng-model="vm.typeActeur"
                                            ng-options="type for type in vm.typeActeurs">
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeActeur=='MASTER' ||vm.typeActeur=='MARCHAND'|| vm.typeActeur=='SOUS_DISTRIBUTEUR' || vm.typeActeur=='AGENCE'">
                                <label mf-required class="control-label col-sm-4" for="field_agence">Agence</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_agence" name="agence"
                                            ng-model="vm.agenceId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationAgence">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.fseId==null" title="Sélectionnez le agence"
                                   class="btn btn-primary btn-xs" j-select-dialog j-multiple="false" j-model="vm.agenceId"
                                   j-list="vm.organisationAgence" j-columns='vm.organisationColums'
                                   j-event-name="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in ">Choisir...</i>
                            </div>
                            <div class="form-group" ng-if="vm.typeActeur=='MASTER' ||vm.typeActeur=='MARCHAND'|| vm.typeActeur=='SOUS_DISTRIBUTEUR' || vm.typeActeur=='AGENCE'">
                                <label class="control-label col-sm-4" for="field_regroupement">Unite Regroupement</label>
                                <div class="col-sm-6">
                                    <select disabled  class="form-control" id="field_regroupement" name="regroupement"
                                            ng-model="vm.regroupementId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationRegroupement">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.fseId==null" title="Sélectionnez le regroupement"
                                   class="btn btn-primary btn-xs" j-select-dialog j-multiple="false" j-model="vm.regroupementId"
                                   j-list="vm.organisationRegroupement" j-columns='vm.organisationColums'
                                   j-event-name="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in ">Choisir...</i>
                            </div>


                            <div class="form-group" ng-if="vm.typeActeur=='MASTER' || vm.typeActeur=='SOUS_DISTRIBUTEUR'">
                                <label mf-required class="control-label col-sm-4" for="field_type">Master</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_type" name="master" ng-model="vm.masterId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationMaster">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.agenceId==null" title="Sélectionnez le master"
                                   class="btn btn-primary btn-xs"
                                   j-select-dialog
                                   j-multiple="false"
                                   j-model="vm.masterId"
                                   j-list="vm.organisationMaster"
                                   j-columns='vm.organisationColums'
                                   j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>

                            <div class="form-group" ng-if="vm.typeActeur=='MARCHAND'">
                                <label mf-required class="control-label col-sm-4" for="field_typeM">Marchand</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_typeM" multiple name="marchand" ng-model="vm.marchandId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationMarchand">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.agenceId==null" title="Sélectionnez le marchand"
                                   class="btn btn-primary btn-xs"
                                   j-select2-dialog
                                   j-multiple="true"
                                   j-model="vm.marchandId"
                                   j-list="vm.organisationMarchand"
                                   j-columns='vm.organisationColums'
                                   j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>

                            <div class="form-group" ng-if="vm.typeActeur=='SOUS_DISTRIBUTEUR'">
                                <label mf-required class="control-label col-sm-4" for="field_sousDistributeur">SousDistributeur</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_sousDistributeur" multiple name="sousDistributeur"
                                            ng-model="vm.sousDistributeurId"
                                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationSousDistributeur">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.agenceId==null" title="Sélectionnez le sousDistributeur"
                                   class="btn btn-primary btn-xs"
                                   j-select2-dialog
                                   j-multiple="true"
                                   j-model="vm.sousDistributeurId"
                                   j-list="vm.organisationSousDistributeur"
                                   j-columns='vm.organisationColums'
                                   j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>
                        </fieldset>

                    </div>
                    <div class="step-pane active" ng-class="{active: $index == vm.getCurrentStepIndex()}"
                         id="simplewizardstep2" ng-if="vm.showOnglet('Export')">
                        <div class="form-group">
                            <select  id="filed_format" name="format" ng-model="vm.type" >
                                <option value="">Options</option>
                                <option value="OSD">Opération sans détail</option>
                                <option value="OAD">Opération avec détail</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_dateDebut">Date début</label>
                            <div class="input-group col-xs-6 col-sm-6 col-lg-6">
                                <input id="field_dateDebut" type="text" class="form-control" name="dateDebut" datetime-picker="{{dateformat}}" ng-model="vm.dateDebut" is-open="vm.datePickerOpenStatus.dateDebut"
                                />
                                <span class="input-group-btn">
                                <button type="button" class="btn btn-default" ng-click="vm.openCalendar('dateDebut')"><i class="glyphicon glyphicon-calendar"></i></button>
                                </span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_dateFin">Date fin</label>
                            <div class="input-group col-xs-6 col-sm-6 col-lg-6">
                                <input id="field_dateFin" type="text" class="form-control" name="dateFin" datetime-picker="{{dateformat}}" ng-model="vm.dateFin" is-open="vm.datePickerOpenStatus.dateFin"
                                />
                                <span class="input-group-btn">
                                <button type="button" class="btn btn-default" ng-click="vm.openCalendar('dateFin')"><i class="glyphicon glyphicon-calendar"></i></button>
                                </span>
                            </div>
                        </div>
                        <div class="form-group" >
                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_agents">
                                Récapitulatif des Unités d'organisations</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <select    class="form-control input-xs" id="field_agents" multiple name="numVersement"
                                           ng-model="vm.listeAgents"
                                           ng-options="list for list in vm.agenceId">
                                </select> </div>
                            <!--                            <button type="button" ng-click="vm.getListEvenement(vm.operation.montantOp)" class="btn-info">-->
                            <!--                                <span class="glyphicon glyphicon-search"></span>-->
                            <!--                            </button>-->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="footer actions actions-footer" id="simplewizard-actions">
        <div class="btn-group">
            <button ng-if="!vm.isViewing" ng-click="vm.clear()" type="button" class="btn btn-default btn-sm btn-prev"
                    ng-click="vm.precedent()">Annuler</button>
            <button ng-if="vm.isViewing" ng-click="vm.clear()" type="button" class="btn btn-default btn-sm btn-prev"
                    ng-click="vm.precedent()">Fermer</button>
            <button ng-click="vm.decrementStep()" ng-show="vm.hasPreviousStep()" type="button"
                    class="btn btn-default btn-sm btn-prev" ng-click="vm.precedent()">Precedent</button>
            <button ng-if="vm.hasNextStep()" ng-click=" vm.incrementStep()" type="button"
                    class="btn btn-primary btn-sm btn-next" ng-click="vm.suivant()"
                    ng-disabled="editForm.$invalid || vm.isSaving" data-last="Finish">Suivant</button>
            <button ng-if="!vm.hasNextStep() && !vm.isViewing" type="submit" class="btn btn-success btn-sm "
                    ng-click="vm.suivant()" ng-disabled="editForm.$invalid || vm.isSaving" data-last="Finish"><span
                    class="glyphicon glyphicon-save"></span>Valider</button>
        </div>
    </div>
</form>
