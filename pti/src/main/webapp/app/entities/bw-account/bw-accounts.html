<div>
    <h2 data-translate="ptiApp.bwAccount.home.title">Bw Accounts</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="bw-account.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.bwAccount.home.createLabel">
                        Create new Bw Account
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="codeBanque"><span data-translate="ptiApp.bwAccount.codeBanque">Code Banque</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="codeAgence"><span data-translate="ptiApp.bwAccount.codeAgence">Code Agence</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="numeroCompte"><span data-translate="ptiApp.bwAccount.numeroCompte">Numero Compte</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="bwCustomer.id"><span data-translate="ptiApp.bwAccount.bwCustomer">Bw Customer</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="bwAccount in vm.bwAccounts track by bwAccount.id">
                    <td><a ui-sref="bw-account-detail({id:bwAccount.id})">{{bwAccount.id}}</a></td>
                    <td>{{bwAccount.codeBanque}}</td>
                    <td>{{bwAccount.codeAgence}}</td>
                    <td>{{bwAccount.numeroCompte}}</td>
                    <td>
                        <a ui-sref="bw-customer-detail({id:bwAccount.bwCustomer.id})">{{bwAccount.bwCustomer.id}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="bw-account-detail({id:bwAccount.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="bw-account.edit({id:bwAccount.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="bw-account.delete({id:bwAccount.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
