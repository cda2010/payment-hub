
<div>
    <h2><span data-translate="ptiApp.bwAccount.detail.title">Bw Account</span> {{vm.bwAccount.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.bwAccount.codeBanque">Code Banque</span></dt>
        <dd>
            <span>{{vm.bwAccount.codeBanque}}</span>
        </dd>
        <dt><span data-translate="ptiApp.bwAccount.codeAgence">Code Agence</span></dt>
        <dd>
            <span>{{vm.bwAccount.codeAgence}}</span>
        </dd>
        <dt><span data-translate="ptiApp.bwAccount.numeroCompte">Numero Compte</span></dt>
        <dd>
            <span>{{vm.bwAccount.numeroCompte}}</span>
        </dd>
        <dt><span data-translate="ptiApp.bwAccount.bwCustomer">Bw Customer</span></dt>
        <dd>
            <a ui-sref="bw-customer-detail({id:vm.bwAccount.bwCustomer.id})">{{vm.bwAccount.bwCustomer.id}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="bw-account-detail.edit({id:vm.bwAccount.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
