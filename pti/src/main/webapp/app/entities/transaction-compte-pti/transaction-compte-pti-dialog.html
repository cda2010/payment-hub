
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTransactionComptePtiLabel" data-translate="ptiApp.transactionComptePti.home.createOrEditLabel">Create or edit a Transaction Compte Pti</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.transactionComptePti.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.transactionComptePti.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.type" for="field_type">Type</label>
            <select class="form-control" name="type" ng-model="vm.transactionComptePti.type" id="field_type" required>
                <option value="DEBIT" data-translate="ptiApp.TypeTransactionCompte.DEBIT">DEBIT</option>
                <option value="CREDIT" data-translate="ptiApp.TypeTransactionCompte.CREDIT">CREDIT</option>
            </select>
            <div ng-show="editForm.type.$invalid">
                <p class="help-block"
                    ng-show="editForm.type.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.etat" for="field_etat">Etat</label>
            <select class="form-control" name="etat" ng-model="vm.transactionComptePti.etat" id="field_etat" required>
                <option value="PROVISOIRE" data-translate="ptiApp.EtatValidite.PROVISOIRE">PROVISOIRE</option>
                <option value="VALIDE" data-translate="ptiApp.EtatValidite.VALIDE">VALIDE</option>
                <option value="ANNULEE" data-translate="ptiApp.EtatValidite.ANNULEE">ANNULEE</option>
            </select>
            <div ng-show="editForm.etat.$invalid">
                <p class="help-block"
                    ng-show="editForm.etat.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.date" for="field_date">Date</label>
                <div class="input-group">
                    <input autocomplete="off"tooltip-placement="top" id="field_date" type="text" class="form-control" name="date" datetime-picker="{{dateformat}}" ng-model="vm.transactionComptePti.date" is-open="vm.datePickerOpenStatus.date"
                    required/>
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('date')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
            <div ng-show="editForm.date.$invalid">
                <p class="help-block"
                    ng-show="editForm.date.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
                <p class="help-block"
                    ng-show="editForm.date.$error.ZonedDateTimelocal" data-translate="entity.validation.ZonedDateTimelocal">
                    This field should be a date and time.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.montant" for="field_montant">Montant</label>
            <input autocomplete="off"type="number" class="form-control" name="montant" id="field_montant"
                    ng-model="vm.transactionComptePti.montant"
                    required/>
            <div ng-show="editForm.montant.$invalid">
                <p class="help-block"
                    ng-show="editForm.montant.$error.required" data-translate="entity.validation.required">
                    This field is required.
                </p>
                <p class="help-block"
                    ng-show="editForm.montant.$error.number" data-translate="entity.validation.number">
                    This field should be a number.
                </p>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.soldeCourant" for="field_soldeCourant">Solde Courant</label>
            <input autocomplete="off"type="number" class="form-control" name="soldeCourant" id="field_soldeCourant"
                    ng-model="vm.transactionComptePti.soldeCourant"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.transactionComptePti.soldeApres" for="field_soldeApres">Solde Apres</label>
            <input autocomplete="off"type="number" class="form-control" name="soldeApres" id="field_soldeApres"
                    ng-model="vm.transactionComptePti.soldeApres"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.transactionComptePti.operation" for="field_operation">Operation</label>
            <select class="form-control" id="field_operation" name="operation" ng-model="vm.transactionComptePti.operationId" ng-options="operation.id as operation.id for operation in vm.operations | orderBy:'id'">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
