<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneRepartitionCommissionLabel" >Créer ou modifier une Ligne Repartition Commission</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_niveau">Niveau</label>
            <div class="col-sm-6">
                <select class="form-control" required name="niveau" id="field_niveau" ng-model="vm.ligneRepartitionCommission.niveau" ng-options="typeUo.niveau as typeUo.libelleTypeUO for typeUo in vm.typeUos">
                    <option value="" ></option>
                </select>
            </div>
        </div>
        
       
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_min">Min</label>
            <div class="col-sm-6">
                <input autocomplete="off"min="0" required class="form-control" name="min" id="field_min" ng-model="vm.ligneRepartitionCommission.min" numeric />
            </div>
        </div>
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_max">Max</label>
            <div class="col-sm-6">
                <input autocomplete="off"min="0" required class="form-control" name="max" id="field_max" ng-model="vm.ligneRepartitionCommission.max" numeric />
            </div>
        </div>
        
         
        
        
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_type_tarif">Type Tarif</label>
            <div class="col-sm-6">
                <select class="form-control" required name="type_tarif" id="field_type_tarif" ng-model="vm.ligneRepartitionCommission.typeTarif">
                    <option value="POURCENTAGE">POURCENTAGE</option>
                    <option value="FIXE" >FIXE</option>
                </select>
            </div>
        </div>
        <div class="form-group" ng-if="vm.ligneRepartitionCommission.typeTarif&&vm.ligneRepartitionCommission.typeTarif=='FIXE'">
            <label mf-required class="control-label col-sm-4" for="field_somme">Somme</label>
            <div class="col-sm-6">
                <input autocomplete="off"min="0" required class="form-control" name="somme" id="field_somme" ng-model="vm.ligneRepartitionCommission.somme" numeric />
            </div>
        </div>
        <div class="form-group" ng-if="vm.ligneRepartitionCommission.typeTarif&&vm.ligneRepartitionCommission.typeTarif!='FIXE'">
            <label mf-required class="control-label col-sm-4" for="field_valeur">Valeur(%)</label>
            <div class="col-sm-6">
                <input autocomplete="off"min="0" required class="form-control" name="valeur" id="field_valeur" ng-model="vm.ligneRepartitionCommission.valeur" numeric />
            </div>
        </div>
        <div class="checkbox col-sm-offset-5">
            <label>
                <input autocomplete="off" type="checkbox" class="checkbox-slider colored-blue checkbox-lg"
                        ng-model="vm.ligneRepartitionCommission.surFrais" />
                <span class="text">Sur frais ?</span>
            </label>
        </div>
  <div class="form-group" ng-if="vm.ligneRepartitionCommission.surFrais">
            <label mf-required class="control-label col-sm-4" for="field_type_tarif">Type intervalle</label>
            <div class="col-sm-6">
                <select class="form-control" required name="type_tarif" id="field_type_tarif" ng-model="vm.ligneRepartitionCommission.typeIntervalle">
                    <option value="FRAIS">FRAIS</option>
                    <option value="MONTANT" >MONTANT</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
