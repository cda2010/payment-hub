<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneFraisLabel" data-translate="ptiApp.ligneFrais.home.createOrEditLabel">Create or edit a Ligne Frais</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.ligneFrais.typeFrais" for="field_typeFrais">Type Frais</label>
            <div class="col-sm-6">
                <select required class="form-control" name="typeFrais" ng-model="vm.ligneFrais.typeFrais" id="field_typeFrais">
                            <option value="FIXE" data-translate="ptiApp.TypeTarif.FIXE">FIXE</option>
                            <option value="POURCENTAGE" data-translate="ptiApp.TypeTarif.POURCENTAGE">POURCENTAGE</option>
                        </select>
            </div>
        </div>

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.ligneFrais.minimun" for="field_minimun">Minimun</label>
            <div class="col-sm-6">
                <input autocomplete="off"required type="text" class="form-control" name="minimun" id="field_minimun" ng-model="vm.ligneFrais.minimun" min="0" oninput="validity.valid||(value='');"/>
            </div>
        </div>

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.ligneFrais.maximun" for="field_maximun">Maximun</label>
            <div class="col-sm-6">
                <input autocomplete="off" required type="number" class="form-control" name="maximun" id="field_maximun" ng-model="vm.ligneFrais.maximun" min="0" oninput="validity.valid||(value='');"/>
            </div>
        </div>

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.ligneFrais.valeur" for="field_valeur">Valeur</label>
            <div class="col-sm-6">
                <input autocomplete="off"required type="number" step="0.01" class="form-control" name="valeur" id="field_valeur" ng-model="vm.ligneFrais.valeur" />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
