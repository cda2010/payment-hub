
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myDetailListeDiffusionLabel" data-translate="ptiApp.detailListeDiffusion.home.createOrEditLabel">Create or edit a Detail Liste Diffusion</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.detailListeDiffusion.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.detailListeDiffusion.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.detailListeDiffusion.numero" for="field_numero">Numero</label>
            <input type="text" class="form-control" name="numero" id="field_numero"
                    ng-model="vm.detailListeDiffusion.numero"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.detailListeDiffusion.liste" for="field_liste">Liste</label>
            <select class="form-control" id="field_liste" name="liste" ng-model="vm.detailListeDiffusion.listeId" ng-options="listeDiffusion.id as listeDiffusion.id for listeDiffusion in vm.listediffusions"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
