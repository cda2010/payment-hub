<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEtapeServiceLabel" data-translate="ptiApp.canalApplication.home.createOrEditLabel">
            Create or edit a Type Service Fse Step</h4>
    </div> 
    <!--  {{vm.canals}} -->
    <div class="modal-body">
    </div>
    <div class="form-group">
        <label class="control-label col-sm-4" for="field_uniteOrganisation" data-translate="ptiApp.facturier.uniteOrganisation">FSE</label>
        <div class="col-sm-6">
            <select class="form-control" id="field_uniteOrganisation" name="fse" ng-model="vm.typeServiceFse.uniteOrganisation.id"
                    ng-options="uo.id as uo.libelleUniteOrganisation for uo in vm.FSEs">
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-4" for="field_typeService">Type Service</label>
        <div class="col-sm-6">
            <ui-select multiple tagging tagging-label="false" ng-model="vm.typeServiceFse.typeService" theme="bootstrap" title="Choisis un type">
                <ui-select-match placeholder="Sélectionner un type de service...">{{$item.libelle}}</ui-select-match>
                <ui-select-choices repeat="typeService in vm.typeservices | filter: $select.search">
                    <span ng-bind="typeService.libelle"></span>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
            data-translate="entity.action.cancel">Cancel</span>
    </button>
    <button type="submit" class="btn btn-primary">
        <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
    </button>
</div>
</form>
