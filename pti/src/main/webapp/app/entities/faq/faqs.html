<div class="well with-header" style="margin-top:10px ">
    <!--<h2 data-translate="ptiApp.faq.home.title">Faqs</h2>
    <jhi-alert></jhi-alert>-->
    <div class="header bg-blue ">
        <div class="col-xs-8">
            FAQ
        </div>
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="faq.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.faq.home.createLabel">
                        Create new Faq
                    </span>
                </button>
            </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-hover">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                
                    <th jh-sort-by="question"><span data-translate="ptiApp.faq.question">Question</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="reponse"><span data-translate="ptiApp.faq.reponse">Reponse</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="faq in vm.faqs track by faq.id">
                 
                    <td>{{faq.question}}</td>
                    <td>{{faq.reponse}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="faq-detail({id:faq.id})" data-original-title="Voir"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="faq.edit({id:faq.id})" data-original-title="Modifier"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="faq.delete({id:faq.id})" data-original-title="Supprimer"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
