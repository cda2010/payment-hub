
<div>
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFaqLabel" data-translate="ptiApp.faq.home.createOrEditLabel">Create or edit a Faq</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.faq.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input disabled type="text" class="form-control" id="id" name="id"
                   ng-model="vm.faq.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.faq.question" for="field_question">Question</label>
            <input disabled type="text" class="form-control" name="question" id="field_question"
                   ng-model="vm.faq.question"
            />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.faq.reponse" for="field_reponse">Reponse</label>
            <textarea disabled class="form-control" name="reponse" id="field_reponse"
                      ng-model="vm.faq.reponse" ></textarea>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
    </div>
</div>
