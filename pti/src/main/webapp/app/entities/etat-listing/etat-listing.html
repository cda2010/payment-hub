<div class="col-sm-8 col-xs-offset-3">
<form class="form-group" name="editForm" role="form" ng-submit="vm.genererL()" >
    <div class="col-sm-8">
        <div class="modal-body">
            <div class="modal-header text-center"><B style="color: white">ETAT LISTE DES CLIENTS OU ORGANISATIONS</B></div>
            <br>
            <select ng-change="vm.getEtatL(vm.etatIdent)" required class="form-control" name="etat" id="etat"
                    ng-model="vm.etatIdent"
                    ng-options="etat.ident as etat.libelle for etat in vm.etats"><option value="">Choisir</option>
            </select>
            <br>
            <div class="form-group" ng-if="vm.etat.params.type">
                <label class="control-label" for="statut" >Statut</label>
                <select  class="form-control input-xs" id="statut" name="statut" ng-model="vm.etatClient" ng-change="vm.selectClient()">
                    <option value="">Choisir</option>
                    <option value="Actif">Actif</option>
                    <option value="Inactif">Inactif</option>

                </select>
            </div>

            <div class="form-group" ng-if="vm.etat.params.typeUO">
                    <label class="control-label" for="field_typeUo">TypeUo</label>
                    <select name="type" id="field_typeUo"  class="form-control"
                            ng-model="vm.item.typeUO"
                            ng-options="typeUniteOrganisation.libelleTypeUO as typeUniteOrganisation.libelleTypeUO for typeUniteOrganisation in vm.typeuniteorganisations"
                            ng-change="vm.selectTypeUO()">
                    </select>
            </div>
            <div class="form-group" ng-if="vm.etat.params.typeUO">
                <label class="control-label " for="etat">Date Debut</label>
                <div class=" ">
                    <input autocomplete="off" id="dateOperation" show-button-bar="false"  popup-placement="top"
                           placeholder=" Date debut" is-open="vm.datePickerOpenStatus.dateOperation"
                           uib-datepicker-popup="dd/MM/yyyy" ng-focus="vm.openCalendar('dateOperation')"
                           class="form-control"  ng-model="vm.item.dateDebut" name="dateOperation"/>
                </div>
            </div>

            <div class="form-group" ng-if="vm.etat.params.typeUO">
                <label class="control-label " for="etat">Date Fin</label>
                <div class=" ">
                    <input autocomplete="off" id="dateFin" show-button-bar="false"  popup-placement="top"
                           placeholder=" Date fin" is-open="vm.datePickerOpenStatus.dateFin"
                           uib-datepicker-popup="dd/MM/yyyy" ng-focus="vm.openCalendar('dateFin')"
                           class="form-control"  ng-model="vm.item.dateFin" name="dateFin"/>
                </div>
            </div>
            <br>
            <div class="form-group">
                <select  id="filed_format" name="format" ng-model="vm.format" >
                    <option value="">Format</option>
                    <option value="PDF">PDF</option>
                    <option value="XLSX">XLSX</option>
                    <option value="CSV">CSV</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" ng-disabled=" vm.UO===false" class="btn btn-primary btn-sm">
                <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Générer</span>
            </button>
        </div>
    </div>
</form>
</div>
