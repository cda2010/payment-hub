
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTauxChangeLabel" data-translate="ptiApp.tauxChange.home.createOrEditLabel">Create or edit a Taux Change</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.tauxChange.typeChange" for="field_typeChange">Type Change</label>
            <div class="col-sm-6">
                    <select required class="form-control" name="typeChange" ng-model="vm.tauxChange.typeChange" id="field_typeChange">
                            <option value="ACHAT" data-translate="ptiApp.TypeChange.ACHAT">ACHAT</option>
                            <option value="VENTE" data-translate="ptiApp.TypeChange.VENTE">VENTE</option>
                        </select>
            </div>
        </div>

        <div class="form-group">
            <label mf-required  class="control-label col-sm-4" data-translate="ptiApp.tauxChange.deviseDepart" for="field_deviseDepart">Devise Depart</label>
            <div class="col-sm-6">
                    <select required class="form-control" id="field_deviseDepart" name="deviseDepart" ng-model="vm.tauxChange.deviseDepartId" ng-options="devise.id as devise.libelle for devise in vm.devises"            >
                            <option value=""></option>
                        </select>
            </div>
        </div>
        

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.tauxChange.deviseArrivee" for="field_deviseArrivee">Devise Arrivee</label>
            <div class="col-sm-6">
                    <select required class="form-control" id="field_deviseArrivee" name="deviseArrivee" ng-model="vm.tauxChange.deviseArriveeId" ng-options="devise.id as devise.libelle for devise in vm.devises"            >
                            <option value=""></option>
                        </select>
            </div>
        </div>
        <div class="form-group">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.tauxChange.taux" for="field_taux">Taux</label>
                <div class="col-sm-6">
                        <input autocomplete="off"type="number" class="form-control" name="taux" id="field_taux"
                        ng-model="vm.tauxChange.taux"
                        required/>
                </div>
            </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
