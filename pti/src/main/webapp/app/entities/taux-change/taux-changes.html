<div>
    <h2 data-translate="ptiApp.tauxChange.home.title">Taux Changes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="taux-change.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.tauxChange.home.createLabel">
                        Create new Taux Change
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="dateTaux"><span data-translate="ptiApp.tauxChange.dateTaux">Date Taux</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="taux"><span data-translate="ptiApp.tauxChange.taux">Taux</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="typeChange"><span data-translate="ptiApp.tauxChange.typeChange">Type Change</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="deviseDepartLibelle"><span data-translate="ptiApp.tauxChange.deviseDepart">Devise Depart</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="deviseArriveeLibelle"><span data-translate="ptiApp.tauxChange.deviseArrivee">Devise Arrivee</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="tauxChange in vm.tauxChanges track by tauxChange.id">
                    <td><a ui-sref="taux-change-detail({id:tauxChange.id})">{{tauxChange.id}}</a></td>
                        <td>{{tauxChange.dateTaux | date:'mediumDate'}}</td>
                    <td>{{tauxChange.taux}}</td>
                    <td data-translate="{{'ptiApp.TypeChange.' + tauxChange.typeChange}}">{{tauxChange.typeChange}}</td>
                    <td>
                        <a ui-sref="devise-detail({id:tauxChange.deviseDepartId})">{{tauxChange.deviseDepartLibelle}}</a>
                    </td>
                    <td>
                        <a ui-sref="devise-detail({id:tauxChange.deviseArriveeId})">{{tauxChange.deviseArriveeLibelle}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="taux-change-detail({id:tauxChange.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="taux-change.edit({id:tauxChange.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="taux-change.delete({id:tauxChange.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
    </div>
    <uib-pager total-items="vm.totalItems" ng-model="vm.page" ng-change="vm.transition()"></uib-pager>
</div>
