
<div>
    <h2><span data-translate="ptiApp.tauxChange.detail.title">Taux Change</span> {{vm.tauxChange.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.tauxChange.dateTaux">Date Taux</span></dt>
        <dd>
            <span>{{vm.tauxChange.dateTaux | date:'mediumDate'}}</span>
        </dd>
        <dt><span data-translate="ptiApp.tauxChange.taux">Taux</span></dt>
        <dd>
            <span>{{vm.tauxChange.taux}}</span>
        </dd>
        <dt><span data-translate="ptiApp.tauxChange.typeChange">Type Change</span></dt>
        <dd>
            <span data-translate="{{'ptiApp.TypeChange.' + vm.tauxChange.typeChange}}">{{vm.tauxChange.typeChange}}</span>
        </dd>
        <dt><span data-translate="ptiApp.tauxChange.deviseDepart">Devise Depart</span></dt>
        <dd>
            <a ui-sref="devise-detail({id:vm.tauxChange.deviseDepartId})">{{vm.tauxChange.deviseDepartLibelle}}</a>
        </dd>
        <dt><span data-translate="ptiApp.tauxChange.deviseArrivee">Devise Arrivee</span></dt>
        <dd>
            <a ui-sref="devise-detail({id:vm.tauxChange.deviseArriveeId})">{{vm.tauxChange.deviseArriveeLibelle}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="taux-change-detail.edit({id:vm.tauxChange.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
