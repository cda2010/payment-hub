
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myClassificationFacturierLabel" data-translate="ptiApp.classificationFacturier.home.createOrEditLabel">Create or edit a Classification Facturier</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.classificationFacturier.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.classificationFacturier.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_uniteOrganisation">Unité d'organisation</label>

            <select ng-change="vm.initClassifications(vm.classificationFacturier.uniteOrganisation.id)" name="uniteOrganisation" id="field_uniteOrganisation" ng-disabled="vm.isViewing" class="form-control"
                    ng-model="vm.classificationFacturier.uniteOrganisation.id" required
                    ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.uoFSE"
            >
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.classificationFacturier.libelleClassification" for="field_libelleClassification">Libelle Classification</label>
            <input type="text" class="form-control" name="libelleClassification" id="field_libelleClassification"
                    ng-model="vm.classificationFacturier.libelleClassification"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_niveauSuperieur">Niveau Superieur</label>
            <select name="uniteOrganisation" id="field_niveauSuperieur" ng-disabled="vm.isViewing" class="form-control"
                    ng-model="vm.classificationFacturier.niveauSuperieur.id"
                    ng-options="classification.id as classification.libelleClassification for classification in vm.classificationFacturiers"
            >
                <option value="">Choisir</option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
