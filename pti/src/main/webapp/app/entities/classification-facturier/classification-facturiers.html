<div class="container-fluid">
<div class="row">
    <div class="well with-header" style="margin-top:10px ">
        <div class="header bg-blue ">
            <div class="col-xs-11">
                <h4 >Classifications Facturiers</h4>
            </div>
            <div class="no-padding-left col-xs-1">
                <button class="btn btn-default  btn-circle btn-xs" ui-sref="classification-facturier.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                </button>
            </div>
        </div>
        <table class="jh-table table table-hover">
            <thead>
                <tr>
<!--                    <th><span data-translate="global.field.id">ID</span></th>-->
                    <th><span>Libelle Classification</span></th>
                    <th><span >Niveau Superieur</span></th>
                    <th><span>Unite Organisation</span></th>
                    <th><span>Statut</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="classificationFacturier in vm.datas track by classificationFacturier.id">
<!--                    <td><a ui-sref="classification-facturier-detail({id:classificationFacturier.id})">{{classificationFacturier.id}}</a></td>-->
                    <td>{{classificationFacturier.libelleClassification}}</td>
                    <td>{{classificationFacturier.niveauSuperieur.libelleClassification}}</td>
                    <td>{{classificationFacturier.uniteOrganisation.libelleUniteOrganisation}}</td>
                    <td>
                        <button class="btn btn-danger btn-xs" ng-click="vm.setActive(classificationFacturier, true)"
                                ng-show="!classificationFacturier.activated"
                        >Desactivé
                        </button>
                        <button class="btn btn-success btn-xs" ng-click="vm.setActive(classificationFacturier, false)"
                                ng-show="classificationFacturier.activated"
                        >Activé
                        </button>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                           <!-- <button type="submit"
                                    ui-sref="classification-facturier-detail({id:classificationFacturier.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>-->
                            <button type="submit"
                                    ui-sref="classification-facturier.edit({id:classificationFacturier.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <!--<span class="hidden-sm-down" data-translate="entity.action.edit"></span>-->
                            </button>
                            <button type="submit"
                                    ui-sref="classification-facturier.delete({id:classificationFacturier.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <!--<span class="hidden-sm-down" data-translate="entity.action.delete"></span>-->
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
    <div class="center-block text-center" ng-show="vm.canShowPagination()">
        <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage">
        </uib-pagination>
    </div>
</div>
