
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title"  ng-show="vm.compteAutre.id === undefined || vm.compteAutre.id === null" id="myCompteAutreLabel">Créer un Compte Autre</h4>
        <h4 class="modal-title"  ng-show="vm.compteAutre.id" id="myCompteAutreLabel">Editer un Compte Autre</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.compteAutre.id">
            <label for="id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.compteAutre.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_solde">Solde</label>
            <input autocomplete="off"type="number" class="form-control" name="solde" id="field_solde"
                    ng-model="vm.compteAutre.solde"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_codeFse">Code Fse</label>
            <input autocomplete="off"type="text" class="form-control" name="codeFse" id="field_codeFse"
                   ng-model="vm.compteAutre.codeFse"
            />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
