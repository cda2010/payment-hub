
<div>
    <h2><span data-translate="ptiApp.alarme.detail.title">Alarme</span> {{vm.alarme.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.alarme.etiquette">Etiquette</span></dt>
        <dd>
            <span>{{vm.alarme.etiquette}}</span>
        </dd>
        <dt><span data-translate="ptiApp.alarme.emails">Emails</span></dt>
        <dd>
            <span>{{vm.alarme.emails}}</span>
        </dd>
        <dt><span data-translate="ptiApp.alarme.sms">Sms</span></dt>
        <dd>
            <span>{{vm.alarme.sms}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="alarme-detail.edit({id:vm.alarme.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
