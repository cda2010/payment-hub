
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myPersonnePhysiqueLabel" data-translate="ptiApp.personnePhysique.home.createOrEditLabel">Create or edit a Personne Physique</h4>
    </div>
    <div class="modal-body">
       
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.personnePhysique.nomClient" for="field_nomClient">Nom Client</label>
            <div class="col-sm-6">
            
            </div>
            
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.personnePhysique.prenomClient" for="field_prenomClient">Prenom Client</label>
            
             <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" name="prenomClient" id="field_prenomClient"
                    ng-model="vm.personnePhysique.prenomClient"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.personnePhysique.dateNaissance" for="field_dateNaissance">Date Naissance</label>
                <div class="input-group">
                    <div class="col-sm-6">
             <input autocomplete="off"id="field_dateNaissance" type="text" class="form-control" name="dateNaissance" uib-datepicker-popup="{{dateformat}}" ng-model="vm.personnePhysique.dateNaissance" is-open="vm.datePickerOpenStatus.dateNaissance"
                    />
                    </div>
                </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.personnePhysique.personnePrevenir" for="field_personnePrevenir">Personne Prevenir</label>
             <div class="col-sm-6">
             <input autocomplete="off"type="text" class="form-control" name="personnePrevenir" id="field_personnePrevenir"
                    ng-model="vm.personnePhysique.personnePrevenir"
                    />
            </div>
           
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.personnePhysique.lieuNaissance" for="field_lieuNaissance">Lieu Naissance</label>
             <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" name="lieuNaissance" id="field_lieuNaissance"
                    ng-model="vm.personnePhysique.lieuNaissance"
                    />
            </div>
            
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.personnePhysique.sexe" for="field_sexe">Sexe</label>
             <div class="col-sm-6">
            <select class="form-control" name="sexe" ng-model="vm.personnePhysique.sexe" id="field_sexe">
                <option value="MASCULIN" data-translate="ptiApp.Sexe.MASCULIN">MASCULIN</option>
                <option value="FEMININ" data-translate="ptiApp.Sexe.FEMININ">FEMININ</option>
            </select>
            </div> 
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.personnePhysique.nationalite" for="field_nationalite">Nationalite</label>
             <div class="col-sm-6">
            <select class="form-control" id="field_nationalite" name="nationalite" ng-model="vm.personnePhysique.nationaliteId" ng-options="nationalite.id as nationalite.libelle for nationalite in vm.nationalites"            >
                <option value=""></option>
            </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
