<div class="container-fluid">
    <div class="row">
        <div>
                <div class="well with-header" style="margin-top:10px ">
                        <div class="header bg-blue " >
                            <div class="col-xs-9">
                               <h4>Liste des profils</h4>
                            </div>
                                <div class="no-padding-left col-xs-3" >
                                        <button  class="btn btn-default  btn-circle btn-xs
                                        " ng-click="vm.addItem()">
                                            <span class="glyphicon glyphicon-plus"></span>
                                        </button>
                                        <div class="btn-group mr15" uib-dropdown>
                                            <button type="button" class="btn btn-default dropdown-toggle btn-xs" data-toggle="dropdown" aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}} 
                                                éléments par page <span class="caret"></span>
                                            </button>
                                            <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                                                <li>
                                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15 éléments par page</a>
                                                </li>
                                                <li>
                                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20 éléments par page</a>
                                                </li>
                                                <li>
                                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30 éléments par page</a>
                                                </li>
                                                <li>
                                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40 éléments par page</a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                        </div>
            <table class="table table-hover">
                <thead class="bordered-blue">
                    <tr >
                    <th ng-click="vm.sortBy('nom') "  class="col-lg-3">
                        <span>Nom</span>
                        <span ng-if="vm.isCurrentColumn('nom')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>

                    <th ng-click="vm.sortBy('description') "  class="col-lg-3">
                        <span>Description</span>
                        <span ng-if="vm.isCurrentColumn('description')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>

                    <th ng-click="vm.sortBy('typeUONom') "  class="col-lg-3">
                        <span>Type Unite Organisation</span>
                        <span ng-if="vm.isCurrentColumn('typeUONom')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr ng-repeat="profil in vm.datas track by profil.id">
                    <td>{{profil.nom}}</td>
                    <td>{{profil.description}}</td>
                    <td>{{profil.typeUONom}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container mt5">
                            <button type="submit"
                                    ng-click="vm.editItem($event,profil)"
                                    class="btn btn-warning btn-xs btn-round">
                                <span class="glyphicon glyphicon-pencil"></span>
                            </button>
                            <button type="submit"
                                    ng-click="vm.deleteItem($event,profil)"
                                    class="btn btn-danger btn-xs btn-round">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="center-block text-center" ng-show="vm.canShowPagination()">
            <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage" >
            </uib-pagination>
        </div>
    </div>
</div>
