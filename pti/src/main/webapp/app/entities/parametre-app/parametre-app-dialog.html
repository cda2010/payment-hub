<form name="editForm" role="form" novalidate ng-submit="vm.save()" class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;
        </button>
        <h4 class="modal-title" id="myParametreAppLabel" data-translate="ptiApp.parametreApp.home.createOrEditLabel">
            Create or edit a Parametre App</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.parametreApp.nom" for="field_nom">Nom</label>
            <div class="col-sm-6">
                <input autocomplete="off"required type="text" class="form-control" name="nom" id="field_nom"
                       ng-model="vm.parametreApp.nom"
                />
            </div>
        </div>

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.parametreApp.valeur" for="field_valeur">Valeur</label>
           <div class="col-sm-6">
               <input autocomplete="off"required type="text" class="form-control" name="valeur" id="field_valeur"
                      ng-model="vm.parametreApp.valeur"
               />
           </div>
        </div>

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.parametreApp.type" for="field_type">Type</label>
           <div class="col-sm-6">
               <select required class="form-control" name="type" ng-model="vm.parametreApp.type" id="field_type">
                   <option value="SYSTEM" data-translate="ptiApp.TypeParametre.SYSTEM">SYSTEM</option>
                   <option value="AUTRE" data-translate="ptiApp.TypeParametre.AUTRE">AUTRE</option>
               </select>
           </div>
        </div>
        
           <div class="form-group">
            <label mf-required class="control-label col-sm-4"  for="field_fse">Fournisseur Service</label>
           <div class="col-sm-6">
               <input autocomplete="off"  type="text" class="form-control" name="valeur" id="field_valeur"
                      ng-model="vm.parametreApp.codeFse"
               />
           </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
                data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
