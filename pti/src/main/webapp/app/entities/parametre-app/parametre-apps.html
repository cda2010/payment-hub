<div>
    <h2 data-translate="ptiApp.parametreApp.home.title">Parametre Apps</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="parametre-app.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.parametreApp.home.createLabel">
                        Create new Parametre App
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span data-translate="global.field.id">ID</span></th>
                    <th><span data-translate="ptiApp.parametreApp.nom">Nom</span></th>
                    <th><span data-translate="ptiApp.parametreApp.valeur">Valeur</span></th>
                    <th><span data-translate="ptiApp.parametreApp.type">Type</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="parametreApp in vm.parametreApps track by parametreApp.id">
                    <td><a ui-sref="parametre-app-detail({id:parametreApp.id})">{{parametreApp.id}}</a></td>
                    <td>{{parametreApp.nom}}</td>
                    <td>{{parametreApp.valeur}}</td>
                    <td data-translate="{{'ptiApp.TypeParametre.' + parametreApp.type}}">{{parametreApp.type}}</td>
                    
                      <td>{{parametreApp.codeFse}}</td>
                      
                      
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="parametre-app-detail({id:parametreApp.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-app.edit({id:parametreApp.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-app.delete({id:parametreApp.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
