
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTypeDocumentLabel" data-translate="ptiApp.typeDocument.home.createOrEditLabel">Create or edit a Type Document</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.typeDocument.code" for="field_code">Code</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="code" id="field_code"
                       ng-model="vm.typeDocument.code"
                       required/>
            </div>
        </div>
        <div class="form-group">
            <label  mf-required class="control-label col-sm-4"  for="field_libelle">Etiquette</label>
            <div class="col-sm-6"> 
                <input autocomplete="off"type="text" class="form-control" name="libelle" id="field_etiquette"
                       ng-model="vm.typeDocument.etiquette"
                       required/>
            </div>
        </div>
        <div class="form-group">
            <label  mf-required class="control-label col-sm-4" data-translate="ptiApp.typeDocument.libelle" for="field_libelle">Libelle</label>
            <div class="col-sm-6"> 
                <input autocomplete="off"type="text" class="form-control" name="libelle" id="field_libelle"
                       ng-model="vm.typeDocument.libelle"
                       required/>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
