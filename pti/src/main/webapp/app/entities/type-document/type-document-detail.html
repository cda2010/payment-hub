
<div>
    <h2><span data-translate="ptiApp.typeDocument.detail.title">Type Document</span> {{vm.typeDocument.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.typeDocument.code">Code</span></dt>
        <dd>
            <span>{{vm.typeDocument.code}}</span>
        </dd>
        <dt><span data-translate="ptiApp.typeDocument.libelle">Libelle</span></dt>
        <dd>
            <span>{{vm.typeDocument.libelle}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="type-document-detail.edit({id:vm.typeDocument.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
