<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myPubliciteLabel" data-translate="ptiApp.publicite.home.createOrEditLabel">
            Create or edit a Publicite </h4>
    </div> 
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" for="field_pays">Pays</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_pays" name="pays" ng-model="vm.configPublicite.pays"
                    ng-options="pays as pays.libellePays for pays in vm.pay">
                    <!--pays in vm.pays track by pays.id-->
                </select>
            </div>   
        </div>
        <div class="form-group">
            <label  class="col-sm-4 control-label" mf-required class="control-label" for="field_frequence">Fréquence</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_frequence" name="frequence" type="number" ng-model="vm.configPublicite.frequence"/>
            </div>
        </div>
        <div class="form-group">
            <label  class="col-sm-4 control-label" mf-required class="control-label" for="field_dateDebut">Date Début</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_dateDebut" name="dateDebut" type="date" required ng-model="vm.configPublicite.dateDebut">
            </div>
          </div>
        
        <div class="form-group">
            <label  class="col-sm-4 control-label" mf-required class="control-label" for="field_dateFin">Date Fin</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_dateFin" name="dateFin" type="date" required ng-model="vm.configPublicite.dateFin">
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" for="field_image">Image</label>
            <div class="col-sm-6">
                <input type="file" class="form-control" id="field_image" name="image" ng-model="vm.configPublicite.urlMinioPublicite"/>
            </div>
        </div>
    </div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
            data-translate="entity.action.cancel">Cancel</span>
    </button>
      <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
    <!-- <button type="submit" class="btn btn-primary" ng-disabled="!vm.configPublicite.canal">-->
        <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
    </button>
</div>
</form>
