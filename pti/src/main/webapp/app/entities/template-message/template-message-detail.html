
<div>
    <h2><span data-translate="ptiApp.templateMessage.detail.title">Template Message</span> {{vm.templateMessage.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.templateMessage.etiquette">Etiquette</span></dt>
        <dd>
            <span>{{vm.templateMessage.etiquette}}</span>
        </dd>
        <dt><span data-translate="ptiApp.templateMessage.contenu">Contenu</span></dt>
        <dd>
            <span>{{vm.templateMessage.contenu}}</span>
        </dd>
        <dt><span data-translate="ptiApp.templateMessage.langue">Langue</span></dt>
        <dd>
            <span data-translate="{{'ptiApp.Langues.' + vm.templateMessage.langue}}">{{vm.templateMessage.langue}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="template-message-detail.edit({id:vm.templateMessage.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
