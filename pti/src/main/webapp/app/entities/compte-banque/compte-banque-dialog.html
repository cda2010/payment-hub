
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myCompteBanqueLabel" data-translate="ptiApp.compteBanque.home.createOrEditLabel">Create or edit a Compte Banque</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required data-translate="ptiApp.compteBanque.codeAgence" for="field_codeAgence">Code Agence</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="codeAgence" id="field_codeAgence"
                    ng-model="vm.compteBanque.codeAgence"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required data-translate="ptiApp.compteBanque.codeBanque" for="field_codeBanque">Code Banque</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="codeBanque" id="field_codeBanque"
                    ng-model="vm.compteBanque.codeBanque"
                    required/>
            </div>
        </div>

        <div class="form-group">
            <label class="form-control" mf-required data-translate="ptiApp.compteBanque.devise" for="field_devise">Devise</label>
            <div class="col-sm-6">
            <select class="form-control" ng-disabled="vm.isViewing" id="field_devise" name="devise" ng-model="vm.compteBanque.deviseId" ng-options="devise.id as devise.code for devise in vm.devises" required="">
                <option value=""></option>
            </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" ng-if="!vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-if="!vm.isViewing" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
        <button type="button" ng-if="vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;
            <span>Fermer</span>
        </button>
    </div>
</form>
