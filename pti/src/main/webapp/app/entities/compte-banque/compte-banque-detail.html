
<div>
    <h2><span data-translate="ptiApp.compteBanque.detail.title">Compte Banque</span> {{vm.compteBanque.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.compteBanque.codeAgence">Code Agence</span></dt>
        <dd>
            <span>{{vm.compteBanque.codeAgence}}</span>
        </dd>
        <dt><span data-translate="ptiApp.compteBanque.codeBanque">Code Banque</span></dt>
        <dd>
            <span>{{vm.compteBanque.codeBanque}}</span>
        </dd>
        <dt><span data-translate="ptiApp.compteBanque.devise">Devise</span></dt>
        <dd>
            <a ui-sref="devise-detail({id:vm.compteBanque.deviseId})">{{vm.compteBanque.deviseCode}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="compte-banque-detail.edit({id:vm.compteBanque.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
