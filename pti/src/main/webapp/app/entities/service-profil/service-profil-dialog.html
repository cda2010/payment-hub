<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myServiceProfilLabel" data-translate="ptiApp.serviceProfil.home.createOrEditLabel">
            Create or edit a Service Profil</h4>
    </div>
    <div class="modal-body">

        <div class="form-group">
        <label class="col-sm-4 control-label" mf-required class="control-label" data-translate="ptiApp.serviceProfil.nom"
               for="field_nom">Nom</label>
        <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" name="nom" id="field_nom" ng-model="vm.serviceProfil.nom"
                   required />
        </div>
    </div>

        <div class="form-group">
            <label class="col-sm-4 control-label" mf-required class="control-label"
                   for="field_nom">Type</label>
            <div class="col-sm-6">
                <select class="form-control" name="type" id="field_type" ng-model="vm.serviceProfil.typeProfilService">
                    <option value="CLIENT">CLIENT</option>
                    <option value="ORGANISATION">ORGANISATION</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.serviceProfil.description"
                for="field_description">Description</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="description" id="field_description"
                    ng-model="vm.serviceProfil.description" />
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.serviceProfil.typeService"
                for="field_typeService">Type Service</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_typeService" multiple name="typeService"
                    ng-model="vm.serviceProfil.typeServices"
                    ng-options="typeService as typeService.libelle for typeService in vm.typeservices track by typeService.id"></select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
                data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
