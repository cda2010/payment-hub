
<div>
    <h2><span data-translate="ptiApp.serviceProfil.detail.title">Service Profil</span> {{vm.serviceProfil.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.serviceProfil.nom">Nom</span></dt>
        <dd>
            <span>{{vm.serviceProfil.nom}}</span>
        </dd>
        <dt><span data-translate="ptiApp.serviceProfil.description">Description</span></dt>
        <dd>
            <span>{{vm.serviceProfil.description}}</span>
        </dd>
        <dt><span data-translate="ptiApp.serviceProfil.typeService">Type Service</span></dt>
        <dd>
            <span ng-repeat="typeService in vm.serviceProfil.typeServices">
                <a ui-sref="type-service-detail({id: typeService.id})">{{typeService.y}}</a>{{$last ? '' : ', '}}
            </span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="service-profil-detail.edit({id:vm.serviceProfil.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
