
<div>
    <h2><span data-translate="ptiApp.chargementCompte.detail.title">Chargement Compte</span> {{vm.chargementCompte.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.chargementCompte.nom_fichier">Nom Fichier</span></dt>
        <dd>
            <span>{{vm.chargementCompte.nom_fichier}}</span>
        </dd>
    </dl>

            class="btn btn-info">

    </button>

    <button type="button" ui-sref="chargement-compte-detail.edit({id:vm.chargementCompte.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
