<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEtapeServiceLabel" data-translate="ptiApp.categorieService.home.createOrEditLabel">
            Create or edit a Categorie Service</h4>
    </div> 
    <!--  {{vm.canals}} -->
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Code Catégorie</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_code" name="code" type="text" ng-model="vm.categorieService.code" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Libelle Catégorie</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_libelleCategorie" name="libelleCategorie" type="text" ng-model="vm.categorieService.libelle" required/>
            </div>
        </div>
        <div class="form-group">
            <label  class="col-sm-4 control-label" mf-required class="control-label" for="field_ordre">Ordre Categorie</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_ordre" name="ordre" type="number" ng-model="vm.categorieService.ordre"/>
            </div>
        </div>
    </div>

<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
            data-translate="entity.action.cancel">Cancel</span>
    </button>
     <!-- <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">-->
    <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
   <!-- <button type="submit" class="btn btn-primary">-->
        <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
    </button>
</div>
</form>
