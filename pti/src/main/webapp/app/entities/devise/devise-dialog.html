
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal ">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myDeviseLabel" data-translate="ptiApp.devise.home.createOrEditLabel">Create or edit a Devise</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required data-translate="ptiApp.devise.code" for="field_code">Code</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" ng-disabled="vm.isViewing" class="form-control" name="code" id="field_code"
                    ng-model="vm.devise.code"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required data-translate="ptiApp.devise.libelle" for="field_libelle">Libelle</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" ng-disabled="vm.isViewing" class="form-control" name="libelle" id="field_libelle"
                    ng-model="vm.devise.libelle"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.devise.symbole" for="field_symbole">Symbole</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" ng-disabled="vm.isViewing" class="form-control" name="symbole" id="field_symbole"
                    ng-model="vm.devise.symbole"
                    />
            </div>
        </div>

    </div>
   <div class="modal-footer">
        <button type="button" ng-if="!vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-if="!vm.isViewing" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
        <button type="button" ng-if="vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;
            <span>Fermer</span>
        </button>
    </div>
</form>
