

<div class="container-fluid">
    <div class="row">
        <div class="row mt5">
            <div class="row mt5">
                <div class="col-sm-2" ng-if="vm.filtrer">
                    <select class="form-control input-xs" id="field_nationalite" name="nationalite"
                        ng-model="vm.itemSearch.code"
                        ng-options="nationalite.code as nationalite.libelle for nationalite in vm.nationalites">
                        <option value="">Code</option>
                    </select>
                </div>
                <div class="form-group col-sm-4" ng-if="vm.filtrer">
                    <input autocomplete="off" title="Telephone" placeholder="Telephone" ng-disabled="vm.isViewing"
                        type="number" class="form-control" name="telephone" id="field_telephoneE"
                        ng-model="vm.itemSearch.telephone" />
                </div>
                
            </div>
               <div class="row mt5">
                <div class="col-sm-2" ng-if="vm.filtrer">
                   <input autocomplete="off" title="Nom" placeholder="Nom" ng-disabled="vm.isViewing"
                        type="text" class="form-control" name="nom" id="field_nom"
                        ng-model="vm.itemSearch.nom" />
                </div>
                <div class="form-group col-sm-4" ng-if="vm.filtrer">
                    <input autocomplete="off" title="Prenom" placeholder="Prenom" ng-disabled="vm.isViewing"
                        type="text" class="form-control" name="prenom" id="field_prenom"
                        ng-model="vm.itemSearch.prenom" />
                </div>
                
            </div>
            <div class="row" ng-if="vm.filtrer">

                <div class="form-group col-sm-4">
                    <div class="col-sm-4">
                        <button class="btn btn-warnig btn-md" ng-click="vm.initFiltre()">
                            <span class="glyphicon glyphicon-search">Annuler</span>
                        </button>
                    </div>
                    <div class="col-sm-4">
                        <button class="btn btn-info btn-md " ng-click="vm.filtre()">
                            <span class="glyphicon glyphicon-search">Filtrer</span>
                        </button>
                    </div>
                </div>
            </div>


            <div class="form-group " ng-if="!vm.filtrer">
                <div class="col-sm-3">
                    <button class="btn btn-info btn-md" ng-click="vm.filtrer=true">
                        <span class="glyphicon glyphicon-search">Filtrer</span>
                    </button>
                </div>
            </div>
        </div>
            <div class="well with-header" style="margin-top:10px ">
                <div class="header bg-blue ">
                    <div class="col-xs-8">
                        Liste des clients
                    </div>
                    <div class="no-padding-left col-xs-4">
                        <div class="btn-group mr15" uib-dropdown>
                            <button type="button" class="btn btn-default dropdown-toggle btn-xs" data-toggle="dropdown"
                                aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}}
                                éléments par page <span class="caret"></span>
                            </button>
                            <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15 éléments par page</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20 éléments par page</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30 éléments par page</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40 éléments par page</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <table class="table table-hover">
                    <thead class="bordered-blue">
                        <tr>
                            <th>Nom </th>
                            <th>Telephone</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="client in vm.datas">
                            <td>{{client.nom}}</td>
                            <td>{{client.telephone}}</td>

                            <td class="text-right">
                                <div class="btn-group flex-btn-group-container">
                                    <button type="button" ng-click="vm.details($event,client,true)"
                                        class="btn btn-primary btn-xs btn-round">
                                        <span class="glyphicon glyphicon-eye-open"></span>
                                    </button>
                                    <button title="Mise à jour" type="button" ng-click="vm.details($event,client,false)"
                                        class="btn btn-warning btn-xs btn-round">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="center-block text-center" ng-show="vm.canShowPagination()">
                <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage">
                </uib-pagination>
            </div>
        </div>
    </div>
