
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEcranLabel" >Créer ou modifier un écran</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ecran.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ecran.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_numeroOrdre">Numero Ordre</label>
            <input type="number" class="form-control" name="numeroOrdre" id="field_numeroOrdre"
                    ng-model="vm.ecran.numeroOrdre"
                    />
        </div>

        <div class="form-group">
            <label  for="field_produit">Produit</label>
            <select ng-disabled="vm.ecran.produit.id" class="form-control" id="field_produit" name="produit" ng-model="vm.ecran.produit.id"
                    ng-options="produit.id as produit.nomProduit for produit in vm.produits" required>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
