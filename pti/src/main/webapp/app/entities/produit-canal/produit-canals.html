<div>
    <h2 data-translate="ptiApp.produitCanal.home.title">Produit Canals</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="produit-canal.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.produitCanal.home.createLabel">
                        Create new Produit Canal
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="canalId"><span data-translate="ptiApp.produitCanal.canal">Canal</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="produitId"><span data-translate="ptiApp.produitCanal.produit">Produit</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="produitCanal in vm.produitCanals track by produitCanal.id">
                    <td><a ui-sref="produit-canal-detail({id:produitCanal.id})">{{produitCanal.id}}</a></td>
                    <td>
                        <a ui-sref="canal-detail({id:produitCanal.canalId})">{{produitCanal.canalId}}</a>
                    </td>
                    <td>
                        <a ui-sref="produit-detail({id:produitCanal.produitId})">{{produitCanal.produitId}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="produit-canal-detail({id:produitCanal.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="produit-canal.edit({id:produitCanal.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="produit-canal.delete({id:produitCanal.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
