
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myProduitCanalLabel" data-translate="ptiApp.produitCanal.home.createOrEditLabel">Create or edit a Produit Canal</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.produitCanal.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.produitCanal.id" readonly />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.produitCanal.canal" for="field_canal">Canal</label>
            <select class="form-control" id="field_canal" name="canal" ng-model="vm.produitCanal.canalId" ng-options="canal.id as canal.id for canal in vm.canals"            >
                <option value=""></option>
            </select>
        </div>
        <div class="form-group">
            <label data-translate="ptiApp.produitCanal.produit" for="field_produit">Produit</label>
            <select class="form-control" id="field_produit" name="produit" ng-model="vm.produitCanal.produitId" ng-options="produit.id as produit.id for produit in vm.produits"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
