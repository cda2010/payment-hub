
<div>
    <h2><span data-translate="ptiApp.produitCanal.detail.title">Produit Canal</span> {{vm.produitCanal.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.produitCanal.canal">Canal</span></dt>
        <dd>
            <a ui-sref="canal-detail({id:vm.produitCanal.canalId})">{{vm.produitCanal.canalId}}</a>
        </dd>
        <dt><span data-translate="ptiApp.produitCanal.produit">Produit</span></dt>
        <dd>
            <a ui-sref="produit-detail({id:vm.produitCanal.produitId})">{{vm.produitCanal.produitId}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="produit-canal-detail.edit({id:vm.produitCanal.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
