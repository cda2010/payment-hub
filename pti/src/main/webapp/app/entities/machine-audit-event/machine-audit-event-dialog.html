
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myMachineAuditEventLabel" data-translate="ptiApp.machineAuditEvent.home.createOrEditLabel">Create or edit a Machine Audit Event</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.machineAuditEvent.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.machineAuditEvent.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.machineAuditEvent.statut" for="field_statut">Statut</label>
            <select class="form-control" name="statut" ng-model="vm.machineAuditEvent.statut" id="field_statut">
                <option value="EN_COURS" data-translate="ptiApp.Statut.EN_COURS">EN_COURS</option>
                <option value="TERMINEE" data-translate="ptiApp.Statut.TERMINEE">TERMINEE</option>
                <option value="ANNULEE" data-translate="ptiApp.Statut.ANNULEE">ANNULEE</option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
