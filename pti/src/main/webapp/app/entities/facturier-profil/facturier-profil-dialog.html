<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFacturierProfilLabel" data-translate="ptiApp.facturierProfil.home.createOrEditLabel">
            Create or edit a Facturier Profil Step</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="col-sm-4 control-label" mf-required class="control-label"
                   for="field_nom">Facturier</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_facturier" name="field_facturier"
                    ng-model="vm.facturierProfil.facturier"
                    ng-options="facturiers as facturiers.nomFacturier for facturiers in vm.facturiers">></select> 
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" 
                for="field_actionService">Type Acteur</label>
            <div class="col-sm-6">
                <select class="form-control" name="field_typeActeur" id="field_typeActeur" ng-model="vm.facturierProfil.typeActeur">
                    <option value="CLIENT">CLIENT</option>
                    <option value="ACTEUR">ACTEUR</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" 
                for="field_actionService">Groupe Profil</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_groupeProfil" name="field_groupeProfil" multiple
                    ng-model="vm.facturierProfil.groupeProfilActeur"
                    ng-options="groupeProfilActeur as groupeProfilActeur.nom for groupeProfilActeur in vm.groupeProfilActeurs"></select> 
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
                data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
