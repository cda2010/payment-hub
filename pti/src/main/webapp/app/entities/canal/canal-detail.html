
<div>
    <h2><span data-translate="ptiApp.canal.detail.title">Canal</span> {{vm.canal.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.canal.codeCanal">Code Canal</span></dt>
        <dd>
            <span>{{vm.canal.codeCanal}}</span>
        </dd>
        <dt><span data-translate="ptiApp.canal.libelleCanal">Libelle Canal</span></dt>
        <dd>
            <span>{{vm.canal.libelleCanal}}</span>
        </dd>
        <dt><span data-translate="ptiApp.canal.typeService">Type Service</span></dt>
        <dd>
            <span ng-repeat="typeService in vm.canal.typeServices">
                <a ui-sref="type-service-detail({id: typeService.id})">{{typeService.id}}</a>{{$last ? '' : ', '}}
            </span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="canal-detail.edit({id:vm.canal.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
