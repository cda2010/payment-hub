<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myCanalLabel" data-translate="ptiApp.canal.home.createOrEditLabel">Create or edit a Canal</h4>
    </div>
    <div class="modal-body">

        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.canal.codeCanal" for="field_codeCanal">Code Canal</label>
            <div class="col-sm-6">
                <input autocomplete="off"ng-disabled="vm.isViewing" required type="text" class="form-control" name="codeCanal" id="field_codeCanal" ng-model="vm.canal.codeCanal" required/>
            </div>
        </div>
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.canal.libelleCanal" for="field_libelleCanal">Libelle Canal</label>
            <div class="col-sm-6">
                <input autocomplete="off"ng-disabled="vm.isViewing" required type="text" class="form-control" name="libelleCanal" id="field_libelleCanal" ng-model="vm.canal.libelleCanal" required/>
            </div>
        </div>

        <div class="form-group">
            <label mf-required class="col-sm-4 control-label" data-translate="ptiApp.canal.typeService" for="field_typeService">Type Service</label>
            <div class="col-sm-6">
                <select ng-disabled="vm.isViewing" required class="form-control" id="field_typeService" multiple name="typeService" ng-model="vm.canal.typeServices" ng-options="typeService as typeService.libelle for typeService in vm.typeservices track by typeService.id"></select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
