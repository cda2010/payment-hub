
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEmetteurLabel" data-translate="ptiApp.emetteur.home.createOrEditLabel">Create or edit a Emetteur</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.emetteur.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.emetteur.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.emetteur.code" for="field_code">Code</label>
            <input autocomplete="off"type="text" class="form-control" name="code" id="field_code"
                    ng-model="vm.emetteur.code"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.emetteur.personne" for="field_personne">Personne</label>
            <select class="form-control" id="field_personne" name="personne" ng-model="vm.emetteur.personneId" ng-options="personne.id as personne.id for personne in vm.personnes"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
