<div class="container-fluid">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <span class="widget-caption">
                    <h4 class="modal-title text-center" id="myOperationLabel"></strong>
                        Détail
                    </h4>
                </span>
    </div>
    <div class="modal-body">
        <form class="bg-white">
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.resource_ids">
                <label for="resource_ids" data-translate="ptiApp.credentialApi.resource_ids">Resource Ids</label>
                <input type="text" class="form-control" id="resource_ids" name="resource_ids"
                       ng-model="vm.credentialApi.resource_ids" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.client_secret">
                <label for="client_secret" data-translate="ptiApp.credentialApi.client_secret">Resource Ids</label>
                <input type="text" class="form-control" id="client_secret" name="client_secret"
                       ng-model="vm.credentialApi.client_secret" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.autoapprove">
                <label for="autoapprove" data-translate="ptiApp.credentialApi.autoapprove">Autoapprove</label>
                <input type="text" class="form-control" id="autoapprove" name="autoapprove"
                       ng-model="vm.credentialApi.autoapprove" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.additional_information">
                <label for="additional_information" data-translate="ptiApp.credentialApi.additional_information">Additional Information</label>
                <input type="text" class="form-control" id="additional_information" name="additional_information"
                       ng-model="vm.credentialApi.additional_information" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.web_server_redirect_uri">
                <label for="web_server_redirect_uri" data-translate="ptiApp.credentialApi.web_server_redirect_uri">Web Server Redirect Uri</label>
                <input type="text" class="form-control" id="web_server_redirect_uri" name="web_server_redirect_uri"
                       ng-model="vm.credentialApi.web_server_redirect_uri" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.client_id">
                <label for="client_id" data-translate="ptiApp.credentialApi.client_id">Client Id</label>
                <input type="text" class="form-control" id="client_id" name="client_id"
                       ng-model="vm.credentialApi.client_id" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.access_token_validity">
                <label for="access_token_validity" data-translate="ptiApp.credentialApi.access_token_validity">Access Token Validity</label>
                <input type="text" class="form-control" id="access_token_validity" name="access_token_validity"
                       ng-model="vm.credentialApi.access_token_validity" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.refresh_token_validity">
                <label for="refresh_token_validity" data-translate="ptiApp.credentialApi.refresh_token_validity">Refresh Token Validity</label>
                <input type="text" class="form-control" id="refresh_token_validity" name="refresh_token_validity"
                       ng-model="vm.credentialApi.refresh_token_validity" readonly />
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.authorized_grant_types">
                <label for="authorized_grant_types" data-translate="ptiApp.credentialApi.authorized_grant_types">Refresh Token Validity</label>
                <select type="text" class="form-control" id="authorized_grant_types" name="authorized_grant_types" multiple
                       ng-model="vm.credentialApi.authorized_grant_types"
                        ng-options="authorized_grant_types for authorized_grant_types in vm.credentialApi.authorized_grant_types"
                        readonly >
                </select>
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.scope">
                <label for="scope" data-translate="ptiApp.credentialApi.scope">Scope</label>
                <select type="text" class="form-control" id="scope" name="scope" multiple
                        ng-model="vm.credentialApi.scope"
                        ng-options="scope for scope in vm.credentialApi.scope"
                        readonly >
                </select>
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.authorities">
                <label for="authorities" data-translate="ptiApp.credentialApi.authorities">Scope</label>
                <select type="text" class="form-control" id="authorities" name="authorities" multiple
                        ng-model="vm.credentialApi.authorities"
                        ng-options="authorities for authorities in vm.credentialApi.authorities"
                        readonly >
                </select>
            </div>
            <div class="form-group col-md-4">
                <label for="codeTypeUo">Type acteur</label>
                <select disabled class="form-control" id="codeTypeUo" ng-model="vm.codeTypeUO"
                        ng-options="type.id as type.libelleTypeUO for type in vm.typeUniteOrganisations">
                </select>
            </div>
            <div class="form-group col-md-4" ng-if="vm.codeTypeUO">
                <label for="field_acteur">Acteur</label>
                <select disabled required class="form-control" id="field_acteur" name="acteur"
                        ng-model="vm.credentialApi.uniteOrganisation.id"
                        ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationFSE">
                </select>
            </div>
            <div class="form-group col-md-4" ng-if="vm.codeTypeUO">
                <label for="profil">Profil</label>
                <select disabled class="form-control" id="profil" name="profil"
                        ng-model="vm.credentialApi.profilId"
                        ng-options="profil.id as profil.nom for profil in vm.profils">
                </select>
            </div>
            <div class="col-sm-4 form-group" ng-show="vm.credentialApi.adresse_authorise">
                <label class="control-label" for="field_adresse_authorise">Adresse autorisée</label>
                <textarea class="form-control" name="adresse_authorise" id="field_adresse_authorise"
                          ng-model="vm.credentialApi.adresse_authorise" readonly ></textarea>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <div class="col-sm-12">
            <button type="button" class="btn btn-info"
                    ui-sref="{{ vm.previousState }}"  data-translate="entity.action.back">
                <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Fermer</span>
            </button>
        </div>
    </div>
</div>
