
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myCredentialApiLabel" data-translate="ptiApp.credentialApi.home.createOrEditLabel">Create or edit a Credential Api</h4>
    </div>
    <div class="modal-body">
<!--        <div class="form-group" ng-show="vm.credentialApi.id">-->
<!--            <label for="id" data-translate="global.field.id">ID</label>-->
<!--            <input type="text" class="form-control" id="id" name="id"-->
<!--                    ng-model="vm.credentialApi.id" readonly />-->
<!--        </div>-->
        <!--<div class="col-sm-offset-11" ng-if="vm.credentialApi.client_id==null">
        <button type="submit"
                class="btn btn-primary btn-xs btn-round" ng-click="vm.ClientSecret()">
            <span class="glyphicon glyphicon-download"></span>
        </button>
        </div>-->
        <div class="row">
            <div class="form-group col-md-6">
                <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.resource_ids" for="field_resource_ids">Resource Ids</label>
                <div class="col-sm-9">
                <input type="text" class="form-control" name="resource_ids" id="field_resource_ids"
                        ng-model="vm.credentialApi.resource_ids"
                        />
                </div>
            </div>
            <div class="form-group col-md-6">
                <label mf-required class="control-label col-sm-3" data-translate="ptiApp.credentialApi.client_secret" for="field_client_secret">Client Secret</label>
                <div class="col-sm-8">
                    <input required disabled type="text" class="form-control" name="client_secret" id="field_client_secret"
                            ng-model="vm.credentialApi.client_secret"
                            />
                </div>
                <div ng-if="vm.credentialApi.client_id==null">
                    <button type="submit"
                            class="btn btn-primary btn-xs btn-round" ng-click="vm.ClientSecret()">
                        <span class="glyphicon glyphicon-download"></span>
                    </button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6">
                <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.autoapprove" for="field_autoapprove">Autoapprove</label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" name="autoapprove" id="field_autoapprove"
                           ng-model="vm.credentialApi.autoapprove"
                    />
                </div>
            </div>
        <div class="form-group  col-md-6">
            <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.additional_information" for="field_additional_information">Additional Information</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="additional_information" id="field_additional_information"
                       ng-model="vm.credentialApi.additional_information"
                />
            </div>
        </div>
        </div>
        <div class="row">
        <div class="form-group col-md-6">
            <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.web_server_redirect_uri" for="field_web_server_redirect_uri">Web Server Redirect Uri</label>
            <div class="col-sm-9">
            <input type="text" class="form-control" name="web_server_redirect_uri" id="field_web_server_redirect_uri"
                    ng-model="vm.credentialApi.web_server_redirect_uri"
                    />
            </div>
        </div>
            <div class="form-group col-md-6">
                <label mf-required class="control-label col-sm-3" data-translate="ptiApp.credentialApi.client_id" for="field_client_id">Client Id</label>
                <div class="col-sm-9">
                    <input required type="text" class="form-control" name="client_id" id="field_client_id"
                           ng-model="vm.credentialApi.client_id"
                    />
                </div>
            </div>
        </div>
        <div class="row">
        <div class="form-group col-md-6">
            <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.access_token_validity" for="field_access_token_validity">Access Token Validity</label>
            <div class="col-sm-9">
            <input type="number" class="form-control" name="access_token_validity" id="field_access_token_validity"
                    ng-model="vm.credentialApi.access_token_validity"
                    />
            </div>
        </div>
        <div class="form-group col-md-6">
            <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.refresh_token_validity" for="field_refresh_token_validity">Refresh Token Validity</label>
            <div class="col-sm-9">
                <input type="number" class="form-control" name="refresh_token_validity" id="field_refresh_token_validity"
                        ng-model="vm.credentialApi.refresh_token_validity"
                        />
            </div>
        </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6">
                <label mf-required class="control-label col-sm-3" data-translate="ptiApp.credentialApi.authorized_grant_types" for="field_authorized_grant_types">Authorized Grant Types</label>
                <div class="col-sm-7">
                    <select multiple disabled required class="form-control"  name="authorized_grant_types" ng-model="vm.credentialApi.authorized_grant_types" id="field_authorized_grant_types"
                            ng-options="grant for grant in vm.grants">
                    </select>
                </div>
                <i  title="Sélectionnez les privilèges" class="btn btn-primary btn-xs"
                    j-select2-dialog
                    j-multiple="true"
                    j-model="vm.grantIds"
                    j-list="vm.grantList"
                    j-columns='vm.columsGrant'
                    j-event-name="onLoadRoles"
                >Choisir...</i>
            </div>
            <div class="form-group  col-md-6">
                <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.scope" for="field_scope" mf-required>Scope</label>
                <div class="col-sm-7">
                    <select disabled required class="form-control" multiple name="scope" ng-model="vm.credentialApi.scope"
                            ng-options="scope for scope in vm.scopes">
                    </select>
                </div>
                <i  title="Sélectionnez les pribilèges" class="btn btn-primary btn-xs"
                    j-select2-dialog
                    j-multiple="true"
                    j-model="vm.scopeIds"
                    j-list="vm.scopeList"
                    j-columns='vm.columsScope'
                    j-event-name="onLoadRoles"
                >Choisir...</i>
            </div>
        </div>

        <div class="row">
            <div class="form-group col-md-6">
                <label class="control-label col-sm-3" for="codeTypeUo" mf-required>Type acteur</label>
                <div class="col-sm-9">
                    <select class="form-control" id="codeTypeUo" ng-change="vm.load()"
                            ng-model="vm.codeTypeUO"
                            ng-options="type.id as type.libelleTypeUO for type in vm.typeUniteOrganisations" required>
                        <option value=""></option>
                    </select>
                </div>
            </div>
            <div class="form-group col-md-6">
                <label mf-required="" class="control-label col-sm-3" for="field_adresse_authorise">Adresse autorisée</label>
                <div class="col-sm-9">
                    <textarea required class="form-control" name="adresse_authorise" id="field_adresse_authorise"
                              placeholder="Séparer les adresses par un point virgule ( ; )" ng-model="vm.credentialApi.adresse_authorise" ></textarea>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6" ng-if="vm.codeTypeUO">
                <div class="form-group">
                    <label class="control-label col-sm-3" for="profil" mf-required>Profil</label>
                    <div class="col-sm-9">
                        <select class="form-control" id="profil" name="profil" ng-change="vm.getAuthorities(vm.credentialApi.profilId)" ng-disabled="vm.isViewing"
                                ng-model="vm.credentialApi.profilId" ng-options="profil.id as profil.nom for profil in vm.profils"
                                required>
                            <option value=""></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group col-md-6" ng-if="vm.codeTypeUO">
                <label mf-required class="control-label col-sm-3" for="field_acteur">Acteur</label>
                <div class="col-sm-7">
                    <select disabled required class="form-control" id="field_acteur" name="acteur"
                            ng-model="vm.credentialApi.uniteOrganisation.id"
                            ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationFSE">
                        <option value=""></option>
                    </select>
                </div>
                <i title="Sélectionnez l'acteur"
                   class="btn btn-primary btn-xs"
                   j-select2-dialog
                   j-multiple="false"
                   j-model="vm.credentialApi.uniteOrganisation.id"
                   j-list="vm.organisationFSE"
                   j-columns='vm.organisationColums'
                   j-event-name="onLoadOrganisation">Choisir...</i>
            </div>
        </div>
        <!--<div class="row">
            <div class="form-group col-md-6">
                <label class="control-label col-sm-3" data-translate="ptiApp.credentialApi.authorities">Authorities</label>
                <div class="col-sm-8">
                    <select disabled required class="form-control" multiple name="authorities" ng-model="vm.credentialApi.authorities"
                            ng-options="authority for authority in vm.authoritie">
                    </select>
                </div>
                <i  title="Sélectionnez les roles" class="btn btn-primary btn-xs"
                    j-select2-dialog
                    j-multiple="true"
                    j-model="vm.authIds"
                    j-list="vm.auth"
                    j-columns='vm.colums'
                    j-event-name="onLoadRoles"
                >Choisir...</i>
            </div>
        </div>-->
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
