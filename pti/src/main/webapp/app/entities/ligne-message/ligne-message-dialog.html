
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneMessageLabel" data-translate="ptiApp.ligneMessage.home.createOrEditLabel">Create or edit a Ligne Message</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ligneMessage.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ligneMessage.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneMessage.codeIndicatif" for="field_codeIndicatif">Code Indicatif</label>
            <input type="text" class="form-control" name="codeIndicatif" id="field_codeIndicatif"
                    ng-model="vm.ligneMessage.codeIndicatif"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneMessage.numeroTelephone" for="field_numeroTelephone">Numero Telephone</label>
            <input type="text" class="form-control" name="numeroTelephone" id="field_numeroTelephone"
                    ng-model="vm.ligneMessage.numeroTelephone"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneMessage.email" for="field_email">Email</label>
            <input type="text" class="form-control" name="email" id="field_email"
                    ng-model="vm.ligneMessage.email"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneMessage.message" for="field_message">Message</label>
            <input type="text" class="form-control" name="message" id="field_message"
                    ng-model="vm.ligneMessage.message"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneMessage.error" for="field_error">Error</label>
            <input type="text" class="form-control" name="error" id="field_error"
                    ng-model="vm.ligneMessage.error"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.ligneMessage.chargementMessage" for="field_chargementMessage">Chargement Message</label>
            <select class="form-control" id="field_chargementMessage" name="chargementMessage" ng-model="vm.ligneMessage.chargementMessage" ng-options="chargementMessage as chargementMessage.id for chargementMessage in vm.chargementmessages track by chargementMessage.id">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
