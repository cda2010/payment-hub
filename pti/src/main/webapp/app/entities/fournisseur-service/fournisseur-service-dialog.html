
<form  class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFournisseurServiceLabel" data-translate="ptiApp.fournisseurService.home.createOrEditLabel">Create or edit a Fournisseur Service</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.fournisseurService.codeFse" for="field_codeFse">Code Fse</label>
           <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="codeFse" id="field_codeFse"
                ng-model="vm.fournisseurService.codeFse"
                required/>
           </div>
        </div>
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_libelleFse">Libelle </label>
           <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="libelleFse" id="field_libelleFse"
                ng-model="vm.fournisseurService.libelleFse"
                required/>
           </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.fournisseurService.pays" for="field_pays">Pays</label>
            
            <div class="col-sm-6">
                    <select class="form-control" id="field_pays" name="pays" ng-model="vm.fournisseurService.paysId" ng-options="pays.id as pays.libellePays for pays in vm.pays"            >
                            <option value=""></option>
                        </select>
                </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
