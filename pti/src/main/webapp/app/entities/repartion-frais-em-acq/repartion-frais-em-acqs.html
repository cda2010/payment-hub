<div>
    <h2 data-translate="ptiApp.repartionFraisEmAcq.home.title">Repartion Frais Em Acqs</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="repartion-frais-em-acq.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.repartionFraisEmAcq.home.createLabel">
                        Create new Repartion Frais Em Acq
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="partEm"><span data-translate="ptiApp.repartionFraisEmAcq.partEm">Part Em</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="partAcq"><span data-translate="ptiApp.repartionFraisEmAcq.partAcq">Part Acq</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="typeServiceLibelle"><span data-translate="ptiApp.repartionFraisEmAcq.typeService">Type Service</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="repartionFraisEmAcq in vm.repartionFraisEmAcqs track by repartionFraisEmAcq.id">
                    <td><a ui-sref="repartion-frais-em-acq-detail({id:repartionFraisEmAcq.id})">{{repartionFraisEmAcq.id}}</a></td>
                    <td>{{repartionFraisEmAcq.partEm}}</td>
                    <td>{{repartionFraisEmAcq.partAcq}}</td>
                    <td>
                        <a ui-sref="type-service-detail({id:repartionFraisEmAcq.typeServiceId})">{{repartionFraisEmAcq.typeServiceLibelle}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="repartion-frais-em-acq-detail({id:repartionFraisEmAcq.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartion-frais-em-acq.edit({id:repartionFraisEmAcq.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartion-frais-em-acq.delete({id:repartionFraisEmAcq.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
