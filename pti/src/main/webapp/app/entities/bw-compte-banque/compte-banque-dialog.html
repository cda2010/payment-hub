
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" ng-show="vm.compteBanque.id === undefined || vm.compteBanque.id === null" id="myCompteBanqueLabel">Créer un Compte Banque</h4>
        <h4 class="modal-title" ng-show="vm.compteBanque.id" id="myCompteBanqueLabel">Editer un Compte Banque</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required for="field_codeAgence">Code Agence</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="codeAgence" id="field_codeAgence"
                    ng-model="vm.compteBanque.codeAgence"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required for="field_codeBanque">Code Banque</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="codeBanque" id="field_codeBanque"
                    ng-model="vm.compteBanque.codeBanque"
                    required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required for="field_rib">Code Fse</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="rib" id="field_rib"
                       ng-model="vm.compteBanque.rib"
                       required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required for="field_codeFse">Code Fse</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" ng-disabled="vm.isViewing" name="codeFse" id="field_codeFse"
                       ng-model="vm.compteBanque.codeFse"
                       required/>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" ng-if="!vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-if="!vm.isViewing" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
        <button type="button" ng-if="vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;
            <span>Fermer</span>
        </button>
    </div>
</form>
