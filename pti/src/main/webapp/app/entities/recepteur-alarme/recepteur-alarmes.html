<div class="container-fluid">
    <div class="well with-header" style="margin-top:10px ">
        <div class="header bg-blue ">
            <div class="col-xs-8">
                <h4>Liste des recepteurs d'alarme</h4>
            </div>
            <div class="col-md-2">
                <button  class="btn btn-default  btn-circle btn-xs
                                        " ng-click="vm.addItem()">
                    <span class="glyphicon glyphicon-plus"></span>
                </button>
            </div>
            <div class="no-padding-left col-xs-2">
                <div class="btn-group" uib-dropdown >
                    <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}} éléments par page
                        <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40 éléments par page</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div>
        <!--filtes -->
        <button ng-if="! vm.afficheFiltre" class="btn btn-primary mt5" ng-click="vm.afficherFiltre()">
            <span class="glyphicon glyphicon-search" > Filtrer</span>
        </button>
            <div class="row mt5">
                <div class="row mt5">
                <div class="col-sm-3" ng-if="vm.afficheFiltre">
                        <label for="field_etiq" >Etiquette</label>
                        <input type="text" name="etiquette" id="field_etiq" class="form-control" ng-model="vm.itemSearch.etiquette" >
                </div>
                    <div class="col-sm-3" ng-if="vm.afficheFiltre">
                        <label for="field_sms">SMS</label>
                        <input type="text" name="sms" id="field_sms" class="form-control" ng-model="vm.itemSearch.sms">
                    </div>
                </div>
                <div class="col-sm-offset-8 col-sm-4 " ng-if="vm.afficheFiltre">
                    <button  class="btn btn-primary " ng-click="vm.chercherAlarme()">
                        <span class="glyphicon glyphicon-search" > Chercher</span>
                    </button>
                        <button  class="btn btn-danger " ng-click="vm.annulerAlarme()">
                            <span class="glyphicon glyphicon-remove" > Annuler</span>
                        </button>
                </div>
            </div>
            <br>
            <table class="table-responsive table table-hover">
            <thead>
                <tr>
                  
                    <th class="col-md-1" ng-click="vm.sortBy('etiquette')">
                        <span>Etiquette</span>
                        <span ng-if="vm.isCurrentColumn('etiquette')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>
                    <th class="col-md-4" ng-click="vm.sortBy('emails')">
                        <span data-translate="ptiApp.recepteurAlarme.emails">Emails</span>
                        <span ng-if="vm.isCurrentColumn('email')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>
                    <th class="col-md-4" ng-click="vm.sortBy('sms')">
                        <span>Sms</span>
                        <span ng-if="vm.isCurrentColumn('sms')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                    </th>
                    <th class="col-md-2"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="recepteurAlarme in vm.datas track by recepteurAlarme.id">
                   
                    <td>{{recepteurAlarme.etiquette}}</td>
                    <td>{{recepteurAlarme.emails}}</td>
                    <td>{{recepteurAlarme.sms}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit" ng-click="vm.detailItem($event,recepteurAlarme)"
                                    class="btn btn-info btn-xs">
                                <span class="glyphicon glyphicon-eye-open"></span>
                            </button>
                            <button type="submit" ng-click="vm.editItem($event,recepteurAlarme)"
                                    class="btn btn-warning btn-xs">
                                <span class="glyphicon glyphicon-pencil"></span>
                            </button>
                            <button type="submit"ng-click="vm.deleteItem($event,recepteurAlarme)"class="btn btn-danger btn-xs">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
     </div>
        <div class="center-block text-center">
            <uib-pagination ng-show="vm.canShowPagination()" total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage" >
            </uib-pagination>
            <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        </div>

    </div>
</div>
