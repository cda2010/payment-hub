<div class="container-fluid">
   
        <div class="row">
            <div>
                    <div class="well with-header" style="margin-top:10px ">
                            <div class="header bg-blue " >
                                <div class="col-xs-9">
                                    Liste des types de comptes
                                </div>
                                    <div class="no-padding-left col-xs-3" >
                                            <button  class="btn btn-default  btn-circle btn-xs
                                            " ng-click="vm.addItem()">
                                                <span class="glyphicon glyphicon-plus"></span>
                                            </button>
                                            <div class="btn-group mr15" uib-dropdown>
                                                <button type="button" class="btn btn-default dropdown-toggle btn-xs" data-toggle="dropdown" aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}} 
                                                    éléments par page<span class="caret"></span>
                                                </button>
                                                <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                                                    <li>
                                                        <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15 éléments par page</a>
                                                    </li>
                                                    <li>
                                                        <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20 éléments par page</a>
                                                    </li>
                                                    <li>
                                                        <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30 éléments par page</a>
                                                    </li>
                                                    <li>
                                                        <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40 éléments par page</a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                            </div>
                <table class="table table-hover">
                    <thead class="bordered-blue">
                        <tr >
                        <th ng-click="vm.sortBy('code')">
                            <span>Code</span>
                            <span ng-if="vm.isCurrentColumn('code')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th ng-click="vm.sortBy('libelle')" class="text-center">
                            <span data-translate="ptiApp.typeCompte.libelleTypeCompte">Libelle</span>
                            <span ng-if="vm.isCurrentColumn('libelle')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th class="text-right"><span>Actions</span> </th>
                    </tr>
                </thead>
                <tbody infinite-scroll="vm.loadPage(vm.page + 1)" infinite-scroll-disabled="vm.page >= vm.links['last']">
                    <tr ng-repeat="compte in vm.datas track by compte.id">

                        <td>{{compte.codeTypeCompte}}</td>
                        <td class="text-center">{{compte.libelleTypeCompte}} </td>
                        <td class="text-right">
                            <div class="btn-group flex-btn-group-container">
                                <button type="submit" data-toggle="tooltip" data-original-title="Modifier" ng-click="vm.editItem($event, compte)" class="btn btn-warning btn-xs btn-round">
                            <span class="glyphicon glyphicon-pencil"></span>
                        </button>
                                <button type="submit" data-toggle="tooltip" data-original-title="Supprimer" ng-click="vm.deleteItem($event, compte)" class="btn btn-danger btn-xs btn-round">
                            <span class="glyphicon glyphicon-remove-circle"></span>
                        </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="center-block text-center" ng-show="vm.canShowPagination()">
        <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage">
        </uib-pagination>
    </div>

</div>
