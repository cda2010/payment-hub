
<div>
    <h2><span data-translate="ptiApp.localite.detail.title">Localite</span> {{vm.localite.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.localite.nomRegion">Nom Region</span></dt>
        <dd>
            <span>{{vm.localite.nomRegion}}</span>
        </dd>
        <dt><span data-translate="ptiApp.localite.nomProvince">Nom Province</span></dt>
        <dd>
            <span>{{vm.localite.nomProvince}}</span>
        </dd>
        <dt><span data-translate="ptiApp.localite.nomCommune">Nom Commune</span></dt>
        <dd>
            <span>{{vm.localite.nomCommune}}</span>
        </dd>
        <dt><span data-translate="ptiApp.localite.nomVille">Nom Ville</span></dt>
        <dd>
            <span>{{vm.localite.nomVille}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="localite-detail.edit({id:vm.localite.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
