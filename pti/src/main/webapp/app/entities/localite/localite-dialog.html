
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLocaliteLabel" data-translate="ptiApp.localite.home.createOrEditLabel">Create or edit a Localite</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.localite.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.localite.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.localite.nomRegion" for="field_nomRegion">Nom Region</label>
            <input type="text" class="form-control" name="nomRegion" id="field_nomRegion"
                    ng-model="vm.localite.nomRegion"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.localite.nomProvince" for="field_nomProvince">Nom Province</label>
            <input type="text" class="form-control" name="nomProvince" id="field_nomProvince"
                    ng-model="vm.localite.nomProvince"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.localite.nomCommune" for="field_nomCommune">Nom Commune</label>
            <input type="text" class="form-control" name="nomCommune" id="field_nomCommune"
                    ng-model="vm.localite.nomCommune"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.localite.nomVille" for="field_nomVille">Nom Ville</label>
            <input type="text" class="form-control" name="nomVille" id="field_nomVille"
                    ng-model="vm.localite.nomVille"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
