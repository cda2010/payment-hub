<div>
    <h2 data-translate="ptiApp.localite.home.title">Localites</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="localite.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.localite.home.createLabel">
                        Create new Localite
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="nomRegion"><span data-translate="ptiApp.localite.nomRegion">Nom Region</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="nomProvince"><span data-translate="ptiApp.localite.nomProvince">Nom Province</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="nomCommune"><span data-translate="ptiApp.localite.nomCommune">Nom Commune</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="nomVille"><span data-translate="ptiApp.localite.nomVille">Nom Ville</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="localite in vm.localites track by localite.id">
                    <td><a ui-sref="localite-detail({id:localite.id})">{{localite.id}}</a></td>
                    <td>{{localite.nomRegion}}</td>
                    <td>{{localite.nomProvince}}</td>
                    <td>{{localite.nomCommune}}</td>
                    <td>{{localite.nomVille}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="localite-detail({id:localite.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="localite.edit({id:localite.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="localite.delete({id:localite.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
