<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myInfoSuppLabel">Créer ou modifier une information supplémentaire</h4>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" for="field_libelle">Libellé</label>
            <div class="col-sm-6">
                <input type="text" class="form-control" name="libelle" id="field_libelle"
                       ng-model="vm.infoSupp.libelle" required />
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" for="field_description">Description</label>
            <div class="col-sm-6">
                <textarea class="form-control" name="description" id="field_description"
                          ng-model="vm.infoSupp.description" rows="4"></textarea>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle">Annuler</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save">Sauvegarder</span>
        </button>
    </div>
</form>
