<div>
    <h2><span>Détail de l'information supplémentaire</span> {{vm.infosupp.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>

    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Libellé</span></dt>
        <dd>
            <span>{{vm.infosupp.libelle}}</span>
        </dd>

        <dt><span>Description</span></dt>
        <dd>
            <span>{{vm.infosupp.description}}</span>
        </dd>
    </dl>

    <button type="button"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>
    </button>

    <button type="button"
            ui-sref="info-supp-detail.edit({id:vm.infosupp.id})"
            class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"></span>
    </button>
</div>
