<div>
    <h2 data-translate="ptiApp.historique.home.title">Historiques</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="historique.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.historique.home.createLabel">
                        Create new Historique
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="fournisseurService"><span data-translate="ptiApp.historique.fournisseurService">Fournisseur Service</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="dateHistorique"><span data-translate="ptiApp.historique.dateHistorique">Date Historique</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="etiquette"><span data-translate="ptiApp.historique.etiquette">Etiquette</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="historique in vm.historiques track by historique.id">
                    <td><a ui-sref="historique-detail({id:historique.id})">{{historique.id}}</a></td>
                    <td>{{historique.fournisseurService}}</td>
                    <td>{{historique.dateHistorique | date:'medium'}}</td>
                    <td data-translate="{{'ptiApp.HistoryType.' + historique.etiquette}}">{{historique.etiquette}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="historique-detail({id:historique.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="historique.edit({id:historique.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="historique.delete({id:historique.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
