
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myHistoriqueLabel" data-translate="ptiApp.historique.home.createOrEditLabel">Create or edit a Historique</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.historique.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.historique.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.historique.fournisseurService" for="field_fournisseurService">Fournisseur Service</label>
            <input type="text" class="form-control" name="fournisseurService" id="field_fournisseurService"
                    ng-model="vm.historique.fournisseurService"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.historique.dateHistorique" for="field_dateHistorique">Date Historique</label>
                <div class="input-group">
                    <input id="field_dateHistorique" type="text" class="form-control" name="dateHistorique" datetime-picker="{{dateformat}}" ng-model="vm.historique.dateHistorique" is-open="vm.datePickerOpenStatus.dateHistorique"
                    />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('dateHistorique')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.historique.etiquette" for="field_etiquette">Etiquette</label>
            <select class="form-control" name="etiquette" ng-model="vm.historique.etiquette" id="field_etiquette">
                <option value="TABLEAUSOLDE" data-translate="ptiApp.HistoryType.TABLEAUSOLDE">TABLEAUSOLDE</option>
                <option value="SOLDECLIENT" data-translate="ptiApp.HistoryType.SOLDECLIENT">SOLDECLIENT</option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
