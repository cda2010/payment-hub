
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myOperationAuditLabel" data-translate="ptiApp.operationAudit.home.createOrEditLabel">Create or edit a Operation Audit</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.operationAudit.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input autocomplete="off"type="text" class="form-control" id="id" name="id"
                    ng-model="vm.operationAudit.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.operationAudit.date" for="field_date">Date</label>
                <div class="input-group">
                    <input autocomplete="off"id="field_date" type="text" class="form-control" name="date" datetime-picker="{{dateformat}}" ng-model="vm.operationAudit.date" is-open="vm.datePickerOpenStatus.date"
                    />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('date')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.operationAudit.statutPrecedent" for="field_statutPrecedent">Statut Precedent</label>
            <select class="form-control" name="statutPrecedent" ng-model="vm.operationAudit.statutPrecedent" id="field_statutPrecedent">
                <option value="ENCOURS" data-translate="ptiApp.StatutOperation.ENCOURS">ENCOURS</option>
                <option value="ENATTENTE" data-translate="ptiApp.StatutOperation.ENATTENTE">ENATTENTE</option>
                <option value="ANNULLE" data-translate="ptiApp.StatutOperation.ANNULLE">ANNULLE</option>
                <option value="PAYE" data-translate="ptiApp.StatutOperation.PAYE">PAYE</option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.operationAudit.statutApres" for="field_statutApres">Statut Apres</label>
            <select class="form-control" name="statutApres" ng-model="vm.operationAudit.statutApres" id="field_statutApres">
                <option value="ENCOURS" data-translate="ptiApp.StatutOperation.ENCOURS">ENCOURS</option>
                <option value="ENATTENTE" data-translate="ptiApp.StatutOperation.ENATTENTE">ENATTENTE</option>
                <option value="ANNULLE" data-translate="ptiApp.StatutOperation.ANNULLE">ANNULLE</option>
                <option value="PAYE" data-translate="ptiApp.StatutOperation.PAYE">PAYE</option>
            </select>
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.operationAudit.operation" for="field_operation">Operation</label>
            <select class="form-control" id="field_operation" name="operation" ng-model="vm.operationAudit.operationId" ng-options="operation.id as operation.codeOperation for operation in vm.operations"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
