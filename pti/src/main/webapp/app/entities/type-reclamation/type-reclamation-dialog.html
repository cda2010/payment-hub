
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal ">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="mytypeReclamtionLabel">Créer ou modifier un type de reclamation</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required for="field_libelle">Libellé</label>
            <div class="col-sm-6">
            <input autocomplete="off"type="text" ng-disabled="vm.isViewing" class="form-control" name="libelle" id="field_libelle"
                    ng-model="vm.typeReclamation.libelleTypeReclamation"
                    required/>
            </div>
        </div>
    </div>
   <div class="modal-footer">
        <button type="button" ng-if="!vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-if="!vm.isViewing" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
        <button type="button" ng-if="vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;
            <span>Fermer</span>
        </button>
    </div>
</form>
