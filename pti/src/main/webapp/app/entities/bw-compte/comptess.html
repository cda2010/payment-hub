<div>
    <h2>Liste des comptes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="comptes.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>
                        Nouveau
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
        <thead>
        <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
            <!--                <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>-->
            <th jh-sort-by="valeurCompte"><span>Valeur compte</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="codeBanque"><span>Code Banque</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="codeAgence"><span>Code Agence</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="rib"><span>Rib</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="codeFse"><span>Code Fse</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="codeFse"><span>Code Fse Titulaire</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="codeFse"><span>Solde</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th jh-sort-by="categorieCompte"><span>Type compte</span> <span class="glyphicon glyphicon-sort"></span></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr ng-repeat="compte in vm.comptes track by compte.id">
            <td>{{compte.valeurCompte}}</td>
            <td>{{compte.codeBanque}}</td>
            <td>{{compte.codeAgence}}</td>
            <td >{{compte.rib}} </td>
            <td >{{compte.codeFse}} </td>
            <td >{{compte.codeFseProprietaire}} </td>
            <td >{{compte.solde}} </td>
            <td >{{compte.categorieCompte}} </td>
            <td class="text-right">
                <div class="btn-group flex-btn-group-container">
<!--                    <button type="submit"-->
<!--                            ui-sref="comptes-detail({id:compte.id})"-->
<!--                            class="btn btn-info btn-sm">-->
<!--                        <span class="glyphicon glyphicon-eye-open"></span>-->
<!--                        <span class="hidden-sm-down" data-translate="entity.action.view"></span>-->
<!--                    </button>-->
                    <button type="submit"
                            ui-sref="comptes.edit({id:compte.id})"
                            class="btn btn-primary btn-sm">
                        <span class="glyphicon glyphicon-pencil"></span>
                        <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                    </button>
<!--                    <button type="submit"-->
<!--                            ui-sref="comptes.delete({id:compte.id})"-->
<!--                            class="btn btn-danger btn-sm">-->
<!--                        <span class="glyphicon glyphicon-remove-circle"></span>-->
<!--                        <span class="hidden-sm-down" data-translate="entity.action.delete"></span>-->
<!--                    </button>-->
                </div>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
