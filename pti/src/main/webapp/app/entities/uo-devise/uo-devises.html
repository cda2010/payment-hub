<div>
    <h2 data-translate="ptiApp.uoDevise.home.title">Uo Devises</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="uo-devise.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.uoDevise.home.createLabel">
                        Create new Uo Devise
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="defaultDevise"><span data-translate="ptiApp.uoDevise.defaultDevise">Default Devise</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="deviseN"><span data-translate="ptiApp.uoDevise.devise">Devise</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="uniteOrganisationN"><span data-translate="ptiApp.uoDevise.uniteOrganisation">Unite Organisation</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="uoDevise in vm.uoDevises track by uoDevise.id">
                    <td><a ui-sref="uo-devise-detail({id:uoDevise.id})">{{uoDevise.id}}</a></td>
                    <td>{{uoDevise.defaultDevise}}</td>
                    <td>
                        <a ui-sref="devise-detail({id:uoDevise.deviseId})">{{uoDevise.deviseN}}</a>
                    </td>
                    <td>
                        <a ui-sref="unite-organisation-detail({id:uoDevise.uniteOrganisationId})">{{uoDevise.uniteOrganisationN}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="uo-devise-detail({id:uoDevise.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="uo-devise.edit({id:uoDevise.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="uo-devise.delete({id:uoDevise.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
