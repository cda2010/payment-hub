<div class="row">

    <div class="row" ng-if="vm.doFiltre">
        <div class="form-group col-sm-3">
            <label for="field_adresse">Adresse</label>
            <input autocomplete="off" title="Adresse"
                   type="text" class="form-control" name="adresse" id="field_adresse"
                   ng-model="vm.itemSearch.adresse" />
        </div>
    </div>
    <div class="row" ng-if="vm.doFiltre">
        <div class="form-group col-sm-4">
            <div class="col-sm-4">
                <button class="btn btn-warnig btn-md" ng-click="vm.initFiltre()">
                    <span class="glyphicon glyphicon-search">Annuler</span>
                </button>
            </div>
            <div class="col-sm-4">
                <button class="btn btn-info btn-md " ng-click="vm.filtre()">
                    <span class="glyphicon glyphicon-search">Filtrer</span>
                </button>
            </div>
        </div>
    </div>
    <div class="form-group" ng-if="vm.filtrer">
        <div class="col-sm-3">
            <button class="btn btn-info btn-md" ng-click="vm.filtreMachine()">
                <span class="glyphicon glyphicon-search">Filtrer</span>
            </button>
        </div>
    </div>
</div>

<div>
    <h2 data-translate="ptiApp.ville.home.title">Villes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="ville.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.ville.home.createLabel">
                        Create new Ville
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="nom"><span data-translate="ptiApp.ville.nom">Nom</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="ville in vm.villes track by ville.id">
                    <td><a ui-sref="ville-detail({id:ville.id})">{{ville.id}}</a></td>
                    <td>{{ville.nom}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="ville-detail({id:ville.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="ville.edit({id:ville.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="ville.delete({id:ville.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
