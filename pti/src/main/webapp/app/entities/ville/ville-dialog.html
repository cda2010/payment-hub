
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myVilleLabel" data-translate="ptiApp.ville.home.createOrEditLabel">Create or edit a Ville</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.ville.nom" for="field_nom">Nom</label>
            <div class="col-sm-6">
                    <input autocomplete="off" type="text" class="form-control" name="nom" id="field_nom"
                    ng-model="vm.ville.nom"
                    required/>
            </div>
        </div>

        <div class="form-group">
                <label mf-required class="control-label col-sm-4" for="field_pays">Pays</label>
                <div class="col-sm-6">
                    <select required class="form-control" id="field_pays" name="pays" ng-model="vm.ville.paysId" 
                    ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.payss">
                        <option value=""></option>
                    </select>
                </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
