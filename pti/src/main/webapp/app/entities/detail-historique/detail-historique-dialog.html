
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myDetailHistoriqueLabel" data-translate="ptiApp.detailHistorique.home.createOrEditLabel">Create or edit a Detail Historique</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.detailHistorique.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.detailHistorique.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.detailHistorique.numeroCpt" for="field_numeroCpt">Numero Cpt</label>
            <input type="text" class="form-control" name="numeroCpt" id="field_numeroCpt"
                    ng-model="vm.detailHistorique.numeroCpt"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.detailHistorique.libelle" for="field_libelle">Libelle</label>
            <input type="text" class="form-control" name="libelle" id="field_libelle"
                    ng-model="vm.detailHistorique.libelle"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.detailHistorique.solde" for="field_solde">Solde</label>
            <input type="number" class="form-control" name="solde" id="field_solde"
                    ng-model="vm.detailHistorique.solde"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.detailHistorique.historique" for="field_historique">Historique</label>
            <select class="form-control" id="field_historique" name="historique" ng-model="vm.detailHistorique.historiqueId" ng-options="historique.id as historique.id for historique in vm.historiques"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
