
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myTerminalLabel" data-translate="ptiApp.terminal.home.createOrEditLabel">Create or edit a Terminal</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.terminal.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.terminal.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.codePays" for="field_codePays">Code Pays</label>
            <input type="text" class="form-control" name="codePays" id="field_codePays"
                    ng-model="vm.terminal.codePays"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.uuid" for="field_uuid">Uuid</label>
            <input type="text" class="form-control" name="uuid" id="field_uuid"
                    ng-model="vm.terminal.uuid"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.plateform" for="field_plateform">Plateform</label>
            <input type="text" class="form-control" name="plateform" id="field_plateform"
                    ng-model="vm.terminal.plateform"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.model" for="field_model">Model</label>
            <input type="text" class="form-control" name="model" id="field_model"
                    ng-model="vm.terminal.model"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.manufacturer" for="field_manufacturer">Manufacturer</label>
            <input type="text" class="form-control" name="manufacturer" id="field_manufacturer"
                    ng-model="vm.terminal.manufacturer"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.codeTerminal" for="field_codeTerminal">Code Terminal</label>
            <input type="text" class="form-control" name="codeTerminal" id="field_codeTerminal"
                    ng-model="vm.terminal.codeTerminal"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.codeUo" for="field_codeUo">Code Uo</label>
            <input type="text" class="form-control" name="codeUo" id="field_codeUo"
                    ng-model="vm.terminal.codeUo"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.activeTerminal" for="field_activeTerminal">Active Terminal</label>
                <input type="checkbox" name="activeTerminal" id="field_activeTerminal"
                          ng-model="vm.terminal.activeTerminal"/>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.terminal.typeTerminal" for="field_typeTerminal">Type Terminal</label>
            <input type="text" class="form-control" name="typeTerminal" id="field_typeTerminal"
                    ng-model="vm.terminal.typeTerminal"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
