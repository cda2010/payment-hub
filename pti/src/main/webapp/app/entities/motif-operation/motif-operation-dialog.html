<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myMotifOperationLabel"
            data-translate="ptiApp.motifOperation.home.createOrEditLabel">Create or edit a Motif Operation</h4>
    </div>
    <div class="modal-body">
        <!-- <div class="form-group">
            <label mf-required class="control-label col-sm-4" for="field_libelle">Code</label>
            <div class="col-sm-6">
                <input autocomplete="off" type="text" class="form-control" name="libelle" id="field_libelle"
                    ng-model="vm.motifOperation.code" required />
            </div>
        </div> -->
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.motifOperation.libelle"
                for="field_libelle">Libelle</label>
            <div class="col-sm-6">
                <input autocomplete="off" type="text" class="form-control" name="libelle" id="field_libelle"
                    ng-model="vm.motifOperation.libelle" required />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
                data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
