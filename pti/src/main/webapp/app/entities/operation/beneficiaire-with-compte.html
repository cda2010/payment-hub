<div class="col-sm-12 col-lg-12 col-xs-12">
    <div class="row">
        <div class="col-sm-6">
            <div class="form-group" ng-if="vm.isViewing">
                <label class="col-sm-4 control-label" for="field_fournisseur">Teneur compte à créditer</label>
                <div class="col-sm-6">
                    <input autocomplete="off" disabled type="text" class="form-control input-xs" name="fournisseur"
                        id="field_fournisseur" ng-model="vm.operation.fseDest.libelleUniteOrganisation" />
                </div>
            </div>
            <div class="form-group " ng-if="!vm.isViewing && vm.operation.uoAcquereurId!=null">
                <label class="col-sm-4 control-label" mf-required for="field_fournisseur">Teneur compte à
                    créditer</label>
                <div class="col-sm-6">
                    <select ng-disabled="true" class="form-control input-xs" required id="field_fournisseur"
                        name="fournisseur" ng-model="vm.fseDest"
                        ng-options="fse.id as fse.libelleUniteOrganisation for fse in vm.organisationFSEB">
                        <option value=""></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_type">Type compte</label>
                <div class="col-xs-6 col-sm-6 col-lg-6">
                    <select ng-disabled="!vm.searchB || vm.isViewing" class="form-control input-xs" id="field_type" name="fse"
                        ng-model="vm.estCompteBanqueB">
                        <option value="OUI">Compte Banque</option>
                        <option value="NON">Compte Virtuel</option>
                    </select>
                </div>
            </div>

            <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
                <label class="control-label col-sm-4" mf-required data-translate="ptiApp.compteBanque.codeAgence"
                    for="field_codeAgence">Code Agence</label>
                <div class="col-sm-6">
                    <input autocomplete="off" ng-disabled="!vm.searchB || vm.isViewing" type="text" class="form-control"
                        name="codeAgence" id="field_codeAgence" ng-model="vm.compteBanqueB.codeAgence" required />
                </div>
            </div>

            <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
                <label class="control-label col-sm-4" mf-required for="field_numeroCmpt">N compte</label>
                <div class="col-sm-6">
                    <input autocomplete="off" ng-disabled="!vm.searchB  || vm.isViewing" type="text"
                        class="form-control" name="numeroCmpt" id="field_numeroCmpt" ng-model="vm.compteB" required />
                </div>
            </div>


            <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
                <label ng-if="!vm.isViewing" mf-required class="control-label col-sm-4"
                    for="field_codeClient">Rib</label>
                <div class="col-sm-6">
                    <div class="col-sm-9" ng-if="!vm.isViewing">
                        <input autocomplete="off" required ng-disabled="vm.isViewing || !vm.searchB" type="text"
                            class="form-control" name="rib" id="field_rib" ng-model="vm.compteBanqueB.rib" />
                    </div>
                    <div ng-if="!vm.isViewing" class="col-sm-2">
                        <button ng-if="vm.searchB" type="button" class="btn btn-info btn-xs "
                            ng-click="vm.getInfosClient('B',vm.compteBanqueB.rib,vm.compteBanqueB.codeAgence,vm.compteB,vm.fseDest)">
                            <span class="glyphicon glyphicon-search"></span>
                        </button>
                        <button ng-if="!vm.searchB" type="button" class="btn btn-info btn-xs "
                            ng-click="vm.searchB=true">
                            <span class="glyphicon glyphicon-ban-circle"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div ng-if="vm.estCompteBanqueB=='NON'">
                <div class="form-group">
                    <label mf-required class="control-label col-sm-4" for="field_valeurCompte">Refererence</label>
                    <div class="col-sm-6">
                        <input autocomplete="off" required ng-disabled="vm.isViewing" type="text" class="form-control"
                            name="valeurCompte" id="field_valeurCompte" ng-model="vm.refCompteB" />
                    </div>
                </div>
            </div>
        </div>


        <div class="col-sm-6">
            <div class="form-group ">
                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                    data-translate="ptiApp.personne.typePersonne" for="field_typePersonne">Type Personne</label>
                <div class="col-xs-6 col-sm-6 col-lg-6 ">
                    <select ng-disabled="vm.isViewing" class="form-control" name="typePersonne"
                        ng-model="vm.personneB.typePersonne" id="field_typePersonne">
                        <option value="PHYSIQUE" data-translate="ptiApp.TypePersonne.PHYSIQUE">PHYSIQUE</option>
                        <option value="MORALE" data-translate="ptiApp.TypePersonne.MORALE">MORALE</option>
                    </select>
                </div>
            </div>


            <div class="form-group">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.personne.telephone"
                    for="field_telephone">Telephone</label>
                <div class="col-sm-2">
                    <select ng-disabled="vm.isViewing" class="form-control input-xs" id="field_nationalite"
                        name="nationalite" ng-model="vm.personneB.codePaysTelephone"
                        ng-options="nationalite.code as nationalite.libelle for nationalite in vm.nationalites">
                        <option value="">Code</option>
                    </select>
                </div>
                <div class="col-sm-4">
                    <span class="input-icon icon-right">
                        <input autocomplete="off" required ng-disabled="vm.isViewing" type="text" class="form-control"
                            name="telephone" id="field_telephone" ng-model="vm.personneB.telephone" />
                        <!-- <span class="fa fa-eye validity"></span> -->
                    </span>
                </div>
            </div>
            <div ng-if="vm.personneB.typePersonne=='PHYSIQUE' ">
                <div class="form-group ">
                    <label mf-required class="col-sm-4 control-label" for="field_nomClient">Nom</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6">
                        <input autocomplete="off" required ng-disabled="vm.estCompteBanqueB=='OUI'|| vm.isViewing "
                            type="text" class="form-control input-xs" name="nomClient" id="field_nomClient"
                            ng-model="vm.personnePhysiqueB.nomClient" />
                    </div>
                </div>

                <div class="form-group">
                    <label mf-required class="col-sm-4 control-label" for="field_nomClient">Prénom</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6 ">
                        <input autocomplete="off" required ng-disabled="vm.estCompteBanqueB=='OUI'|| vm.isViewing "
                            type="text" class="form-control input-xs" name="nomClient" id="field_prenomClient"
                            ng-model="vm.personnePhysiqueB.prenomClient" />
                    </div>
                </div>
                <div class="form-group">
                    <label class=" col-sm-4 control-label" data-translate="ptiApp.personnePhysique.dateNaissance"
                        for="field_dateNaissance">Date Naissance</label>
                    <div class="col-sm-6">
                        <div class="input-group">
                            <input autocomplete="off" ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing"
                                popup-placement="top" id="field_dateNaissance"
                                show-button-bar="false" type="text" class="form-control input-xs" name="dateNaissance"
                                uib-datepicker-popup="dd/MM/yyyy" ng-model="vm.personnePhysiqueB.dateNaissance"
                                is-open="vm.datePickerOpenStatus.dateNaissance" uib-datepicker-popup="dd/MM/yyyy" />
                            <span class="input-group-btn">
                                <button type="button" class="btn btn-default btn-xs"
                                    ng-click="vm.openCalendar('dateNaissance')"><i
                                        class="glyphicon glyphicon-calendar"></i></button>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-4 control-label" data-translate="ptiApp.personnePhysique.lieuNaissance"
                        for="field_lieuNaissance">Lieu Naissance</label>
                    <div class="col-sm-6">
                        <input autocomplete="off" ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing" type="text"
                            class="form-control input-xs" name="lieuNaissance" id="field_lieuNaissance"
                            ng-model="vm.personnePhysiqueB.lieuNaissance" />
                    </div>
                </div>
                <div class="form-group ">
                    <label class=" col-sm-4 control-label" data-translate="ptiApp.personnePhysique.sexe"
                        for="field_sexe">Sexe</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6">
                        <select ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing" class="form-control input-xs"
                            name="sexe" ng-model="vm.personnePhysiqueB.sexe" id="field_sexe">
                            <option value="MASCULIN" data-translate="ptiApp.Sexe.MASCULIN">MASCULIN</option>
                            <option value="FEMININ" data-translate="ptiApp.Sexe.FEMININ">FEMININ</option>
                        </select>
                    </div>
                </div>
            </div>

            <div ng-if="vm.personneB.typePersonne=='MORALE' ">

                <div class="form-group ">
                    <label class="control-label col-sm-4 col-xs-4 col-lg-4 "
                        data-translate="ptiApp.personneMorale.raisonSociale " for="field_raisonSociale ">Raison
                        Sociale</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6 ">
                        <input autocomplete="off" ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing" type="text "
                            class="form-control " name="raisonSociale " id="field_raisonSociale "
                            ng-model="vm.personneMoraleB.raisonSociale " required />
                    </div>
                </div>

                <div class="form-group ">
                    <label class="control-label col-sm-4 col-xs-4 col-lg-4 "
                        data-translate="ptiApp.personneMorale.registreCommerce " for="field_registreCommerce ">Registre
                        Commerce</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6 ">
                        <input autocomplete="off" ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing" type="text "
                            class="form-control " name="registreCommerce " id="field_registreCommerce "
                            ng-model="vm.personneMoraleB.registreCommerce " />
                    </div>

                </div>

                <div class="form-group ">
                    <label class="control-label col-sm-4 col-xs-4 col-lg-4 "
                        data-translate="ptiApp.personneMorale.numreoIfu " for="field_numreoIfu ">Numreo Ifu</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6 ">
                        <input autocomplete="off" ng-disabled="vm.estCompteBanqueB=='OUI' || vm.isViewing" type="text "
                            class="form-control " name="numreoIfu " id="field_numreoIfu "
                            ng-model="vm.personneMoraleB.numreoIfu " />
                    </div>
                </div>

            </div>

        </div>
    </div>
    <div class="row" ng-if="vm.estCompteBanqueB=='OUI' && vm.personneB.typePersonne=='PHYSIQUE'">
        <fieldset class="mf-fieldset" ng-disabled="vm.searchB && !vm.verifDate(vm.pieceB.dateExpiration)">
            <legend>Document d'identification</legend>
            <div class="form-group col-sm-6">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.piece.typePiece"
                    for="field_typePiece">Type Piece</label>
                <div class="col-sm-8">
                    <select required ng-disabled="vm.isViewing" class="form-control" id="field_typePiece"
                        name="typePiece" ng-model="vm.pieceB.typePieceId"
                        ng-options="typePiece.id as typePiece.libelleTypePiece for typePiece in vm.typepieces">
                        <option value="">Choisir</option>
                    </select>
                </div>
            </div>

            <div class="form-group col-sm-6">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.piece.referencePiece"
                    for="field_referencePiece">Reference Piece</label>
                <div class="col-sm-8">
                    <input autocomplete="off" ng-disabled="vm.isViewing " type="text" class="form-control"
                        name="referencePiece" id="field_referencePiece" ng-model="vm.pieceB.referencePiece" required />
                </div>
            </div>

            <div class="form-group col-sm-6">
                <label class="control-label col-sm-4" data-translate="ptiApp.piece.dateDelivrance"
                    for="field_dateDelivrance">Date Delivrance</label>
                <div class="col-sm-8">
                    <div class="input-group">
                        <input autocomplete="off" ng-disabled="vm.isViewing " show-button-bar="false"
                            popup-placement="top" 
                            id="field_dateDelivrance" type="text" class="form-control" name="dateDelivranceB"
                            uib-datepicker-popup="dd/MM/yyyy" ng-model="vm.pieceB.dateDelivrance"
                            is-open="vm.datePickerOpenStatus.dateDelivranceB" />
                        <span class="input-group-btn">
                            <button type="button" class="btn btn-default btn-xs"
                                ng-click="vm.openCalendar('dateDelivranceB')"><i
                                    class="glyphicon glyphicon-calendar"></i></button>
                        </span>
                    </div>
                </div>
            </div>
            <div class="form-group col-sm-6">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.piece.dateExpiration"
                    for="field_dateExpiration">Date Expiration</label>
                <div class="col-sm-8">
                    <div class="input-group">
                        <input autocomplete="off" required ng-disabled="vm.isViewing " id="field_dateExpiration"
                            show-button-bar="false" popup-placement="top" 
                            type="text" class="form-control" name="dateExpirationE" uib-datepicker-popup="dd/MM/yyyy"
                            ng-model="vm.pieceB.dateExpiration" is-open="vm.datePickerOpenStatus.dateExpirationE" />
                            <span ng-if="vm.verifDate(vm.pieceB.dateExpiration)" class="label label-danger">Le document
                                    d'identification a expiré!</span>
                            <span class="input-group-btn">
                            <button type="button" class="btn btn-default btn-xs"
                                ng-click="vm.openCalendar('dateExpirationE')"><i
                                    class="glyphicon glyphicon-calendar"></i></button>
                        </span>
                    </div>

                </div>
            </div>
            <div class="form-group col-sm-6">
                <label mf-required class="control-label col-sm-4" data-translate="ptiApp.piece.lieuDelivrance"
                    for="field_lieuDelivrance">Lieu Delivrance</label>
                <div class="col-sm-8">
                    <input autocomplete="off" required ng-disabled="vm.isViewing " type="text" class="form-control"
                        name="lieuDelivrance" id="field_lieuDelivrance" ng-model="vm.pieceB.lieuDelivrance" />
                </div>
            </div>
        </fieldset>

    </div>
</div>
