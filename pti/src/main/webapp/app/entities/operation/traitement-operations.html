<div class="container-fluid">
    <div class="row mt5" >
        <div class="row" ng-if="vm.filtrer">
            <div class="form-group col-sm-4">
                    <div class="input-group">
                            <input autocomplete="off" show-button-bar="false" placeholder=" Date operation" is-open="vm.datePickerOpenStatus.dateOperation" uib-datepicker-popup="dd/MM/yyyy" ng-focus="vm.openCalendar('dateOperation')"  class="form-control"  ng-model="vm.itemSearch.dateOperation" name="dateOperation"/>
                            <span class="input-group-btn">
                                    <button type="button" class="btn btn-default btn-xs"
                                        ng-click="vm.openCalendar('dateOperation')"><i
                                            class="glyphicon glyphicon-calendar"></i></button>
                                </span>
                    </div>
            </div>
            <div class="form-group col-sm-4">
                <select  class="form-control input-xs" id="field_pays" name="pays" ng-model="vm.itemSearch.uoAcquereurId" ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                    <option value="">Choisir pays destination</option>
                </select>
            </div>
        </div>
        <div class="row" ng-if="vm.filtrer">
            <div class="form-group col-sm-4">
                <input autocomplete="off" placeholder="Montant op"  class="form-control" type="text" ng-model="vm.itemSearch.montantOp" name="f_montantOp"/>
            </div>
            <div class="form-group col-sm-4">
                <div class="col-sm-4">
                    <button  class="btn btn-warnig btn-md"  ng-click="vm.initFiltre()" >
                        <span class="glyphicon glyphicon-search">Annuler</span>
                    </button>
                </div>
                <div class="col-sm-4">
                    <button class="btn btn-info btn-md "  ng-click="vm.filtre()">
                        <span class="glyphicon glyphicon-search">Filtrer</span>
                    </button>
                </div>
            </div>
        </div>



        <div class="form-group " ng-if="!vm.filtrer">
            <div class="col-sm-3">
                <button class="btn btn-info btn-md" ng-click="vm.filtrer=true">
                    <span class="glyphicon glyphicon-search">Filtrer</span>
                </button>
            </div>
        </div>
    </div>
    <div class="row">
        <div>
            <div class="well with-header" style="margin-top:10px ">
                <div class="header bg-blue " >
                    <div class="col-xs-10">
                        <h4>Liste des opérations en Attente</h4>
                    </div>
                    <div class="no-padding-left col-xs-2" >

                        <div class="btn-group mr15" uib-dropdown>
                            <button type="button" class="btn btn-default dropdown-toggle btn-xs" data-toggle="dropdown" aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}}
                                <span class="caret"></span>
                            </button>
                            <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30</a>
                                </li>
                                <li>
                                    <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <table class="table table-hover">
                    <thead class="bordered-blue">
                    <tr >
                        <th ng-click="vm.sortBy('dateOperation') ">
                            <span>Date</span>
                            <span ng-if="vm.isCurrentColumn('dateOperation')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th ng-click="vm.sortBy('code') ">
                            <span>Type de service</span>
                            <span ng-if="vm.isCurrentColumn('code')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th ng-click="vm.sortBy('statut') ">
                            <span>Statut</span>
                            <span ng-if="vm.isCurrentColumn('statut')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th ng-click="vm.sortBy('montantOp') ">
                            <span>Montant ttc</span>
                            <span ng-if="vm.isCurrentColumn('montantOp')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>

                        <th ng-click="vm.sortBy('montantFrais') ">
                            <span>Montant frais</span>
                            <span ng-if="vm.isCurrentColumn('montantFrais')" ng-class="{'fa fa-sort-amount-asc':vm.reverse, 'fa fa-sort-amount-desc': !vm.reverse}"></span>
                        </th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr ng-repeat="operation in vm.datas track by operation.id">
                        <td>{{operation.dateOperation | date:'medium'}}</td>
                        <td>{{operation.code}}</td>
                        <td data-translate="{{'ptiApp.StatutOperation.' + operation.statut}}">{{operation.statut}}</td>
                        <td>{{operation.montantOp}}</td>
                        <td>{{operation.montantFrais}}</td>
                        <td class="text-right">
                            <div class="btn-group flex-btn-group-container">
                                <button title="Traitement" type="submit" ng-click="vm.detailsOperations($event,operation)" class="btn btn-primary btn-xs btn-round">
                                    <span class="glyphicon glyphicon-eye-open"></span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="center-block text-center" ng-show="vm.canShowPagination()">
                <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage">
                </uib-pagination>
            </div>
        </div>
    </div>
</div>
