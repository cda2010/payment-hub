<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">&times;</button>
    <h4 class="modal-title " id="myValeurCodeLabel" >Commentaire</h4>
</div>
<div class="modal-body">
    <div >
        <textarea  ng-model="vm.commentaire" readonly
                   rows="4"
                   ng-maxlength="1000" class="form-control" name="commentaire" id="field_description">
        </textarea>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default"  ng-click="fermerM()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Fermer</span>
    </button>

</div>
