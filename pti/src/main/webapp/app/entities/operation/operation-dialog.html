
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal ">
    <!-- <div class="panel-header">
        <h4 class="modal-title" id="labelEnvoiCash" ng-if="vm.operation.code=='ENVOI_CASH' && vm.isViewing">Envoi de cash</h4>
        <h4 class="modal-title" id="labelRetrait" ng-if="vm.operation.code=='RETRAIT'&& vm.isViewing">Retrait d'argent</h4>
        <h4 class="modal-title" id="labelEnvoiCashE" ng-if="vm.operation.id==null">Envoi de cash</h4>
        <h4 class="modal-title" id="labelOpExpire" ng-if="vm.isExpired">Traitement operation expirée</h4>
    </div> -->
    <div class="panel-body">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div id="simplewizard" class="wizard" data-target="#simplewizard-steps">
                    <ul class="steps">
                        <li data-target="#simplewizardstep1" ng-repeat="step in vm.steps" ng-class="{active: $index==vm.getCurrentStepIndex()}">
                            <span class="step">{{$index+1}}</span>{{step}}<span class="chevron"></span>
                        </li>
                    </ul>
                </div>
 
                <div class="step-content" id="simplewizard-steps">
                    <div ng-if="vm.showOnglet('Information')" class="step-pane active" ng-class="{active: $index==vm.getCurrentStepIndex()}" id="simplewizardstep1">
                        <div class="row">
                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_paysDest">Pays destination</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select required ng-disabled="vm.isViewing || vm.isFraisDispo" class="form-control input-xs" id="field_paysDest" name="pays" ng-model="vm.operation.uoAcquereurId" ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>
 
                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" data-translate="ptiApp.operation.montantOp" for="field_montantOp">Montant Op</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" required ng-disabled="vm.isViewing || vm.isFraisDispo" type="number" class="form-control input-xs" name="montantOp" id="field_montantOp" ng-model="vm.operation.montantOp" min="0" oninput="validity.valid||(value='');" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" data-translate="ptiApp.operation.motif" for="field_motif">Motif</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <textarea ng-disabled="vm.isViewing" required type="text" class="form-control input-xs" name="motif" id="field_motif" ng-model="vm.operation.motif" />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12 col-lg-12 col-xs-12">
                                <fieldset class="mf-fieldset">
                                    <legend>Calcul frais</legend>
                                    <div class="form-group col-sm-4" ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                        <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_montantFrais">Frais</label>
                                        <div class="col-xs-8 col-sm-8 col-lg-8">
                                            <input autocomplete="off"  required disabled type="number" class="form-control input-xs ft20" name="montantFrais" id="field_montantFrais" ng-model="vm.operation.montantFrais" />
                                        </div>
                                    </div>
                                    <div class="form-group col-sm-6 " ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                        <label mf-required class="control-label col-sm-5 col-xs-5 col-lg-5" for="field_montantTtc">Montant ttc</label>
                                        <div class="col-xs-6 col-sm-6 col-lg-6">
                                            <input autocomplete="off" required disabled type="number" class="form-control input-xs ft20" name="montantTtc" id="field_montantTtc" ng-model="vm.montantOp" />
                                        </div>
                                    </div>
                                    <div class="col-sm-2">
                                        <button ng-click="vm.annulerCalculFrais()" ng-if="vm.isFraisDispo && !vm.isViewing" type="button" class="btn btn-default btn-xs" data-dismiss="modal">
                                                                <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
                                        </button>
                                        <button ng-disabled="!vm.canCalculFrais(vm.operation.uoAcquereurId)" ng-if="!vm.isFraisDispo && !vm.isViewing" ng-click="vm.calculFrais(vm.operation.uoAcquereurId)" type="button" class="btn btn-warning btn-xs">
                                                                <span class="fa fa-calculator"></span>&nbsp;<span></span>Calculer</span>
                                        </button>
                                    </div>
                                </fieldset>
                            </div>
                        </div>
                        <div ng-include="'app/entities/operation/personne-operation.html'"> </div>
 
                    </div>
 
                    <div class="step-pane active" ng-class="{active: $index==vm.getCurrentStepIndex()}" id="simplewizardstep2" ng-if="vm.showOnglet('Validation')">
                       <div class="row">
                        <div class="form-group" ng-if="!vm.isMaster()">
                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_pays">Numéro de versement</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <input autocomplete="off" ng-disabled="vm.isViewing" class="form-control input-xs" id="field_numero" name="numero" ng-model="vm.operation.numVersement" />
                            </div>
                        </div>
                        
                        <div class="form-group">
                                <label  class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_pays">Pays destination</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select disabled class="form-control input-xs" id="field_pays" name="pays" ng-model="vm.operation.uoAcquereurId" ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                                        <option value=""></option>
                                    </select>
                                </div>
                        </div>
 
                        <div class="form-group" ng-if="vm.personneE.typePersonne=='PHYSIQUE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_emetteur">Emetteur</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                        <input autocomplete="off" disabled class="form-control input-xs" id="field_emetteur" name="emetteur" ng-model="vm.emetteur" ng-init="vm.emetteur=vm.personnePhysiqueE.nomClient+' '+vm.personnePhysiqueE.prenomClient"/>
                                </div>
                        </div>
 
                        <div class="form-group" ng-if="vm.personneE.typePersonne=='MORALE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_emetteurM">Emetteur</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                        <input autocomplete="off" disabled class="form-control input-xs" id="field_emetteurM" name="emetteur" ng-model="vm.emetteur" ng-init="vm.emetteur=vm.personneMoraleE.raisonSociale"/>
                                </div>
                        </div>
 
                        <div class="form-group" ng-if="vm.personneB.typePersonne=='PHYSIQUE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_beneficiaire">Béneficiare</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                        <input autocomplete="off" disabled class="form-control input-xs" id="field_beneficiaire" name="beneficiaire" ng-model="vm.beneficiaire" ng-init="vm.beneficiaire=vm.personnePhysiqueB.nomClient+' '+vm.personnePhysiqueB.prenomClient" />
                                </div>
                        </div>
 
                        
 
                        <div class="form-group" ng-if="vm.personneB.typePersonne=='MORALE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"  for="field_beneficiaireM">Béneficiare</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                        <input autocomplete="off" disabled class="form-control input-xs" id="field_beneficiaireM" name="beneficiaire" ng-model="vm.beneficiaire" ng-init="vm.beneficiaire=vm.personneMoraleB.raisonSociale" />
                                </div>
                        </div>
                        <div class="form-group">
                            <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_pays">Montant versement</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <input autocomplete="off" disabled disabled class="form-control input-xs" id="field_montant" name="montant" ng-model="vm.operation.montantOp"  />
                            </div>
                        </div>
 
                        <div class="form-group">
                                <label  class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_montantFraisB">Frais</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off"   disabled type="number" class="form-control input-xs ft20" name="montantOp" id="field_montantFraisB" ng-model="vm.operation.montantFrais" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_montantTtcB">Montant ttc</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off"  disabled type="number" class="form-control input-xs ft20" name="montantOp" id="field_montantTtcB" ng-model="vm.montantOp" />
                                </div>
                            </div>
                       </div>
                    </div>
                </div>
 
            </div>
        </div>
    </div>
    <div class="footer actions actions-footer" id="simplewizard-actions">
        <div class="pull-left mt5" ng-if="vm.isMaj">
            <button ng-if="vm.operation.statut=='SUSPENDU'"  ng-click="vm.majOperation(vm.operation)" type="button" class="btn btn-success btn-sm pull-left" >
                Reactivation
                <span class="glyphicon glyphicon-pencil"></span>
            </button>

            <button ng-if="vm.operation.statut=='ENATTENTE'" ng-click="vm.majOperation(vm.operation)" type="button" class="btn btn-warning btn-sm pull-left">
                Suspension
                <span class="glyphicon glyphicon-pencil"></span>
            </button>
        </div>
        <div class="btn-group">
            <button  ng-click="vm.annulationOperation()" type="button" class="btn btn-warning btn-sm " ng-if="vm.isExpired"> Rembourser</button>
            <button  ng-click="vm.sendCodeRetrait()" type="button" class="btn btn-success btn-sm " ng-if="vm.isExpired"> Renvoyer code</button>
            <button  ng-click="vm.clear()" type="button" class="btn btn-default btn-sm " ng-if="!vm.isViewing"> Annuler</button>
            <button ng-click="vm.clear()" type="button" class="btn btn-default btn-sm" ng-if="vm.isViewing"> Fermer</button>
            <button ng-click="vm.decrementStep()" type="button" ng-if="!vm.isViewing&&vm.hasPreviousStep()" class="btn btn-default btn-sm btn-prev"> <i class="fa fa-angle-left" ></i>Precedent</button>
            <button ng-disabled="!vm.isViewing && editForm.$invalid || vm.isSaving" ng-click=" vm.incrementStep()" type="button" class="btn btn-primary btn-sm btn-next"  ng-click="vm.suivant()"  ng-if="!vm.isViewing && vm.hasNextStep() && vm.isFraisDispo" data-last="Finish">Suivant</button>
            <button ng-if="!vm.hasNextStep() && !vm.isViewing" type="submit" class="btn btn-success btn-sm " ng-disabled="editForm.$invalid || vm.isSaving" data-last="Finish">Valider</button>
        </div>
    </div>
</form>
