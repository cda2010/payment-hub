<form>
    <div class="modal-header">
        <h4 class="modal-title" id="myDeviseLabel">Détail de l'opération</h4>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div id="simplewizard" class="wizard" data-target="#simplewizard-steps">
                    <ul class="steps">
                        <li data-target="#simplewizardstep1" ng-repeat="step in vm.steps"
                            ng-class="{active: $index == vm.getCurrentStepIndex()}">
                            <span class="step">{{$index + 1}}</span>{{step}}<span class="chevron"></span>
                        </li>
                    </ul>
                </div>
                <div class="step-content" id="simplewizard-steps">
                    <div ng-if="vm.showOnglet('Information')" class="step-pane active"
                         ng-class="{active: $index == vm.getCurrentStepIndex()}" id="simplewizardstep1">

                        <div class="row">

                            <div class="form-group"
                                 ng-if="vm.typeService == 'ACCOUNT_CASH' || vm.typeService == 'ACCOUNT_ACCOUNT'">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_paysEm">Pays compte à débiter</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select required ng-disabled="vm.isViewing || vm.isFraisDispo"
                                            class="form-control input-xs" id="field_paysEm" name="pays"
                                            ng-change="vm.getFse(vm.operation.uoEmetteurId, 'E')"
                                            ng-model="vm.operation.uoEmetteurId"
                                            ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.isViewing">
                                <label class="col-sm-4 control-label" for="field_fournisseur">Teneur compte à
                                    débiter</label>
                                <div class="col-sm-6">
                                    <input autocomplete="off" disabled type="text" class="form-control input-xs" name="fournisseur"
                                           id="field_fournisseur"
                                           ng-model="vm.operation.fseSrc.libelleUniteOrganisation" />
                                </div>
                            </div>

                            <div class="form-group"
                                 ng-if="(vm.typeService == 'ACCOUNT_CASH' || vm.typeService == 'ACCOUNT_ACCOUNT') && !vm.isViewing && vm.operation.uoEmetteurId != null">
                                <label class="col-sm-4 control-label" mf-required for="field_fournisseur">Teneur compte
                                    à débiter</label>
                                <div class="col-sm-6">
                                    <select ng-disabled="vm.isViewing || vm.isFraisDispo" class="form-control input-xs"
                                            required id="field_fournisseur" name="fournisseur" ng-model="vm.fseSrc"
                                            ng-options="fse.id as fse.libelleUniteOrganisation for fse in vm.organisationFSE">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeService == 'ACCOUNT_CASH'">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_devise">Devise paiement</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select ng-disabled="vm.isViewing" required class="form-control" id="field_devise"
                                            name="devise" ng-model="vm.operation.devisePaiementId"
                                            ng-options="devise.deviseId as devise.deviseLibelle for devise in vm.devises">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeService == 'ACCOUNT_CASH'">
                                <label ng-if="vm.isViewing" mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_paysDest">Lieu paiement</label>
                                <div class="input-group col-sm-offset-4 col-xs-5 col-sm-5 col-lg-5">
                                    <input autocomplete="off" ng-model="vm.organisation.libelleUniteOrganisation"
                                           class="form-control input-xs" type="text" placeholder="Lieu de paiement"
                                           disabled />
                                    <div ng-if="!vm.isViewing" class="input-group-btn">
                                        <button type="button" class="btn btn-xs btn-primary" ng-click="vm.choisirUo()">
                                            <span class="glyphicon glyphicon-pencil">Choisir</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeService == 'ACCOUNT_ACCOUNT'">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_pays">Pays compte à créditer</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select required ng-disabled="vm.isViewing || vm.isFraisDispo"
                                            class="form-control input-xs" id="field_pays" name="pays"
                                            ng-change="vm.getFse(vm.operation.uoAcquereurId, 'B')"
                                            ng-model="vm.operation.uoAcquereurId"
                                            ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeService == 'ACCOUNT_ACCOUNT' && !vm.isViewing">
                                <label class="col-sm-4 control-label" mf-required for="field_fournisseur">Teneur compte
                                    à créditer</label>
                                <div class="col-sm-6">
                                    <select ng-disabled="vm.isViewing || vm.isFraisDispo" class="form-control input-xs" required id="field_fournisseur"
                                            name="fournisseur" ng-model="vm.fseDest"
                                            ng-options="fse.id as fse.libelleUniteOrganisation for fse in vm.organisationFSEB">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.isViewing && vm.typeService == 'ACCOUNT_ACCOUNT'">
                                <label class="col-sm-4 control-label" for="field_fournisseur">Teneur compte à
                                    créditer</label>
                                <div class="col-sm-6">
                                    <input autocomplete="off" disabled type="text" class="form-control input-xs" name="fournisseur"
                                           id="field_fournisseur"
                                           ng-model="vm.operation.fseDest.libelleUniteOrganisation" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       data-translate="ptiApp.operation.montantOp" for="field_montantOp">Montant</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off"
                                           ng-change="vm.operation.montantOpEnDevise = vm.tauxChange.taux * parseInt(vm.operation.montantOp)"
                                           required ng-disabled="vm.isViewing || vm.isFraisDispo" type="text"
                                           class="form-control input-xs" name="montantOp" id="field_montantOp"
                                           ng-model="vm.operation.montantOp"  min="0" numeric   decimals="0"
                                           oninput="validity.valid||(value='');" />
                                </div>
                            </div>

                            <div class="form-group" ng-if="vm.typeService == 'ACCOUNT_CASH'">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_devise">Devise paiement</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select ng-disabled="vm.isViewing" required class="form-control" id="field_devise"
                                            name="devise" ng-model="vm.operation.devisePaiementId"
                                            ng-options="devise.deviseId as devise.deviseLibelle for devise in vm.devises">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_tauxChange">Taux
                                    change</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled type="text" class="form-control input-xs" name="tauxChange"
                                           min="0" numeric   decimals="0"   id="field_tauxChange" ng-model="vm.tauxChange.taux" min="0"
                                           oninput="validity.valid||(value='');" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       data-translate="ptiApp.operation.motif" for="field_motif">Motif</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select ng-disabled="vm.isViewing" required class="form-control input-xs"
                                            id="field_motif" name="pays" ng-model="vm.operation.motifOperationId"
                                            ng-options="motif.id as motif.libelle for motif in vm.motifs">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div>
                            
                            
                        
                        </div>
                        <div class="row">
                            <div class="col-sm-12 col-lg-12 col-xs-12">
                                <fieldset class="mf-fieldset">
                                    <legend>Calcul frais <span class="label label-danger">{{vm.message}}</span></legend>
                                    <div class="row">
                                        <div class="form-group col-sm-3"
                                             ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                                   for="field_montantFrais">Frais</label>
                                            <div class="col-xs-8 col-sm-8 col-lg-8">
                                                <input autocomplete="off" required disabled type="number"
                                                       class="form-control input-xs ft20" name="montantFrais"
                                                       id="field_montantFrais" ng-value="vm.operation.montantFrais" />
                                            </div>
                                        </div>
                                        <div class="form-group col-sm-5 "
                                             ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                            <label mf-required class="control-label col-sm-5 col-xs-5 col-lg-5"
                                                   for="field_montantTaxe">Taxe </label>
                                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                                <input autocomplete="off" required disabled type="number"
                                                       class="form-control input-xs ft20" name="montantTaxe"
                                                       id="field_montantTaxe" ng-model="vm.operation.montantTaxe" />
                                            </div>
                                            <button ng-if="vm.operation.montantTaxe != null && vm.operation.montantTaxe != 0"
                                                    type="button" ng-click="vm.detailTaxes()" class="btn-info col-sm-1">
                                                <span class="glyphicon glyphicon-eye-open"></span>
                                            </button>
                                        </div>


                                    </div>
                                    <div class="row">
                                        <div class="form-group col-sm-3"
                                             ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                                   for="field_montant_Frais"> TTC</label>
                                            <div class="col-xs-8 col-sm-8 col-lg-8">
                                                <input autocomplete="off" required disabled type="number"
                                                       class="form-control input-xs ft20" name="montantFrais"
                                                       id="field_montant_Frais"
                                                       ng-value="vm.operation.montantOp+ vm.operation.montantTaxe+vm.operation.montantFrais" />
                                            </div>
                                        </div>

                                        <div class="form-group  col-sm-5"
                                             ng-class="{'has-info has-feedback': vm.isFraisDispo}">
                                            <label mf-required class="control-label col-sm-5 col-xs-5 col-lg-5"
                                                   for="field_montantTtc">Montant envoyé <span
                                                    ng-if="vm.defaultDevise != null && vm.defaultDevise.deviseLibelle != null && vm.defaultDevise.deviseLibelle != ''">({{vm.defaultDevise.deviseLibelle}})</span>
                                            </label>
                                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                                <input autocomplete="off" required disabled type="number"
                                                       class="form-control input-xs ft20" name="montantTtc"
                                                       id="field_montantTtc" ng-value="vm.operation.montantOp" />
                                            </div>
                                        </div>


                                    </div>
                                    <div class="row">

                                        <div class="form-group  col-sm-4"
                                             ng-class="{'has-info has-feedback': vm.isFraisDispo}">


                                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                                   for="field_montantTtc">Montant reçu <span
                                                    ng-if="vm.deviseP.deviseLibelle != null && vm.deviseP.deviseLibelle != ''">({{vm.deviseP.deviseLibelle}})</span></label>
                                            <div class="col-xs-7 col-sm-7 col-lg-7">
                                                <input autocomplete="off" required disabled type="number"
                                                       class="form-control input-xs ft20" name="montantTtc"
                                                       id="field_montantTtc" ng-value="vm.operation.montantOpEnDevise" />
                                            </div>
                                        </div>
                                    </div>

                                    
                                      
                                    
                                </fieldset>
                            </div>
                        </div>
                    </div>

                    <div class="step-pane active" ng-class="{active: $index == vm.getCurrentStepIndex()}"
                         id="simplewizardstep3" ng-if="vm.showOnglet('Expéditeur')">
                        <div class="row">
                            <div ng-include="'app/entities/operation/emetteur-with-compte.html'"> </div>
                        </div>
                    </div>

                    <div class="step-pane active" ng-class="{active: $index == vm.getCurrentStepIndex()}"
                         id="simplewizardstep4" ng-if="vm.showOnglet('Bénéficiaire')">

                        <div class="row" ng-if="vm.typeService == 'ACCOUNT_ACCOUNT'">
                            <div ng-include="'app/entities/operation/beneficiaire-with-compte.html'"> </div>
                        </div>

                        <div class="row" ng-if="vm.typeService == 'ACCOUNT_CASH'">
                            <div ng-include="'app/entities/operation/beneficiaire-without-compte.html'"></div>
                        </div>
                    </div>

                    <div class="step-pane active" ng-class="{active: $index == vm.getCurrentStepIndex()}"
                         id="simplewizardstep5" ng-if="vm.showOnglet('validation') && vm.typeService == 'ACCOUNT_CASH'">
                        <div class="row">
                            <div class="form-group" ngf-drop ngf-change="vm.setBordereau($file, vm.operation)">
                                <label mf-required class="control-label col-sm-4"
                                       for="field_bordereau">Bordereau</label>
                                <div class="col-sm-6">
                                    <div ng-if="vm.operation.bordereau" class="help-block clearfix">
                                        <a class="pull-left"
                                           ng-click="vm.openFile(vm.operation.bordereauContentType, vm.operation.bordereau)"
                                           data-translate="entity.action.open">open</a><br>
                                        <span class="pull-left">{{vm.operation.bordereauContentType}}, {{vm.byteSize(vm.operation.bordereau)}}</span>
                                        <button ng-if="!vm.isViewing" type="button"
                                                ng-click="vm.operation.bordereau = null;
                                                    vm.operation.bordereauContentType = null;"
                                                class="btn btn-default btn-xs pull-right">
                                            <span class="glyphicon glyphicon-remove"></span>
                                        </button>
                                    </div>
                                    <button ngf-pattern="'image/*,application/pdf'"
                                            ngf-accept="'image/*,application/pdf'" ng-if="!vm.isViewing" type="button" ngf-select
                                            class="btn btn-default btn-block"
                                            ngf-change="vm.setBordereau($file, vm.operation)">
                                        Ajouter
                                    </button>
                                </div>
                                <input autocomplete="off" required type="hidden" class="form-control" name="bordereau" id="field_bordereau"
                                       ng-model="vm.operation.bordereau"
                                       />
                                <input autocomplete="off" required type="hidden" class="form-control" name="bordereauContentType"
                                       id="field_bordereauContentType"
                                       ng-model="vm.operation.bordereauContentType"/>
                            </div>
                        </div>
                    </div>


                    <div class="step-pane active" ng-class="{active: $index == vm.getCurrentStepIndex()}"
                         id="simplewizardstep2" ng-if="vm.showOnglet('Confirmation')">
                        <div class="row">
                            <!--
                                 <div class="form-group" ng-if="!vm.isMaster() && !vm.isViewing vm.typeService=='ACCOUNT_CASH'">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                    for="field_pays">Numéro de versement</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select required class="form-control input-xs" id="field_numVersement"
                                        name="numVersement" ng-model="vm.operation.codeExterne"
                                        ng-options="evenement.eve as evenement.eve for evenement in vm.evenements">
                                        <option value="">Choisir</option>
                                    </select>
                                </div>
                                <button type="button"
                                    ng-click="vm.getListEvenement(vm.operation.montantOp+ vm.operation.montantTaxe+vm.operation.montantFrais)"
                                    class="btn-info">
                                    <span class="glyphicon glyphicon-search"></span>
                                </button>
                            </div> -->

                            <div class="form-group" ng-if="!vm.isViewing">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_codeOperation">Code validation</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" required  type="text"  class="form-control input-xs" name="codeOperation"
                                           id="field_codeOperation" ng-model="vm.token" />
                                </div>
                            </div>

                            <!-- <div class="form-group" ng-if="vm.operation.uoAcquereurId!=null">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_pays">Pays
                                    destination</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <select disabled class="form-control input-xs" id="field_pays" name="pays"
                                        ng-model="vm.operation.uoAcquereurId"
                                        ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                                        <option value=""></option>
                                    </select>
                                </div>
                            </div> -->

                            <div class="form-group" ng-if="vm.personneE.typePersonne == 'PHYSIQUE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_emetteur">Expéditeur</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled class="form-control input-xs" id="field_emetteur" name="emetteur"
                                           ng-model="vm.emetteur"
                                           ng-init="vm.emetteur = vm.personnePhysiqueE.nomClient + ' ' + vm.personnePhysiqueE.prenomClient" />
                                </div>
                                <button ng-if="!vm.isViewing" type="button" ng-click="vm.goToStepNotVerif(1)"
                                        class=" btn-warning">
                                    <span class="glyphicon glyphicon-pencil"></span>
                                </button>
                            </div>

                            <!-- <div class="form-group" ng-if="vm.personneE.typePersonne=='PHYSIQUE'"
                                ng-if="vm.typeBeneficiaire=='Titulaire'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                    for="field_emetteur">Béneficiare</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled class="form-control input-xs" id="field_emetteur" name="emetteur"
                                        ng-model="vm.emetteur"
                                        ng-init="vm.emetteur=vm.personnePhysiqueE.nomClient+' '+vm.personnePhysiqueE.prenomClient" />
                                </div>
                                <button ng-if="!vm.isViewing" type="button" ng-click="vm.goToStepNotVerif(1)"
                                    class=" btn-warning">
                                    <span class="glyphicon glyphicon-pencil"></span>
                                </button>
                            </div> -->

                            <div class="form-group"
                                 ng-if="vm.personneB.typePersonne == 'PHYSIQUE' && vm.personnePhysiqueB != null">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_beneficiaire">Béneficiare</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled class="form-control input-xs" id="field_beneficiaire"
                                           name="beneficiaire" ng-model="vm.beneficiaire"
                                           ng-init="vm.beneficiaire = vm.personnePhysiqueB.nomClient + ' ' + vm.personnePhysiqueB.prenomClient" />
                                </div>
                                <button ng-if="!vm.isViewing" type="button" ng-click="vm.goToStepNotVerif(2)"
                                        class="btn-warning">
                                    <span class="glyphicon glyphicon-pencil"></span>
                                </button>
                            </div>

                            <div class="form-group" ng-if="vm.personneB.typePersonne == 'MORALE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       for="field_beneficiaireM">Béneficiare</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled class="form-control input-xs" id="field_beneficiaireM"
                                           name="beneficiaire" ng-model="vm.beneficiaire"
                                           ng-init="vm.beneficiaire = vm.personneMoraleB.raisonSociale" />
                                </div>
                            </div>



                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_pays">Montant envoyé
                                    <span
                                        ng-if="vm.defaultDevise != null && vm.defaultDevise.deviseLibelle != null && vm.defaultDevise.deviseLibelle != ''">({{vm.defaultDevise.deviseLibelle}})</span></label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled disabled class="form-control input-xs" id="field_montant"
                                           name="montant" ng-model="vm.operation.montantOp" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_tauxChange">Taux
                                    change</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled type="number" class="form-control input-xs" name="tauxChange"
                                           id="field_tauxChange" ng-model="vm.tauxChange.taux" min="0"
                                           oninput="validity.valid||(value='');" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_pays">Montant à
                                    recevoir <span
                                        ng-if=" vm.deviseP.deviseLibelle != null && vm.deviseP.deviseLibelle != ''">({{vm.deviseP.deviseLibelle}})</span></label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled disabled class="form-control input-xs" id="field_montant"
                                           name="montant" ng-model="vm.operation.montantOpEnDevise" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_montantFraisB">Frais
                                    de transfert</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled type="number" class="form-control input-xs ft20" name="montantOp"
                                           id="field_montantFraisB" ng-value="vm.operation.montantFrais" />
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_taxe">Taxe </label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled type="number" class="form-control input-xs ft20" name="taxe"
                                           id="field_taxe" ng-model="vm.operation.montantTaxe" />
                                </div>
                                <button type="button" ng-click="vm.detailTaxes()" class="btn-info">
                                    <span class="glyphicon glyphicon-eye-open"></span>
                                </button>
                            </div>

                            <div class="form-group">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_montantTtcB">Montant
                                    total</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled type="number" class="form-control input-xs ft20" name="montantOp"
                                           id="field_montantTtcB" ng-model="vm.montantOp" />
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <div class="footer actions actions-footer" id="simplewizard-actions" >
        <div class="btn-group">
            <div ng-if="vm.operation.statut == 'ENATTENTE_ANNULATION'" class="btn-group" uib-dropdown is-open="status.isopen">
                <button id="single-button" type="button" class="btn btn-danger btn-sm" uib-dropdown-toggle
                        ng-disabled="disabled">
                    Rembourser <span class="caret"></span>
                </button>
                <ul class="dropdown-menu" uib-dropdown-menu role="menu" aria-labelledby="single-button">
                    <li role="menuitem"><a href="#" ng-click="vm.validerOperationAnnulation(true)"> Annuler avec les frais</a></li>
                    <li role="menuitem"><a ng-click="vm.validerOperationAnnulation(false)" href="#">Annuler sans les frais</a></li>
                </ul>
            </div>
            <button ng-click="vm.clear()" type="button" class="btn btn-default btn-sm" ng-if="vm.isViewing"> Fermer
            </button>
            <button ng-click="vm.decrementStep()" type="button" ng-if="vm.hasPreviousStep()"
                    class="btn btn-default btn-sm btn-prev"><i class="fa fa-angle-left"></i>Precedent
            </button>

            <button ng-disabled="!vm.isViewing && (editForm.$invalid || vm.isSaving || !vm.isFraisDispo)"
                    ng-click="vm.incrementStep()" type="button" ng-if="vm.hasNextStep()"
                    class="btn btn-primary btn-sm btn-next"  data-last="Finish">Suivant
            </button>
        </div>
    </div>
</form>
