<form name="editForm" role="form" novalidate ng-submit="vm.verification()" show-validation class="form-horizontal ">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myDeviseLabel">Traitement operations expirées</h4>
    </div>
    <div class="modal-body">
        <fieldset class="mf-fieldset">
            <legend>Vérification</legend>
            <div class="form-group" ng-if="!vm.isViewing">
                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" data-translate="ptiApp.operation.codeRetrait" for="field_codeRetrait">Code retrait</label>
                <div class="col-xs-6 col-sm-6 col-lg-6">
                    <input autocomplete="off"  type="text" class="form-control input-xs" name="codeRetrait" id="field_codeRetrait" ng-model="vm.operation.codeRetrait" />
                </div>
            </div>
            
            <div class="form-group">
                    <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_typeServiceLibelle">Type service</label>
                    <div class="col-xs-6 col-sm-6 col-lg-6">
                        <input autocomplete="off" disabled type="text" class="form-control input-xs" name="typeServiceLibelle" id="field_typeServiceLibelle" ng-model="vm.operation.code" />
                    </div>
            </div>

        </fieldset>

    </div>
    <div class="modal-footer">
        <button type="button" ng-if="!vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="!vm.canVerif || vm.operation.codeRetrait==null || vm.operation.codeRetrait==''" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.valid">Save</span>
        </button>
        <button type="button" ng-if="vm.isViewing" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;
            <span>Fermer</span>
        </button>
    </div>
</form>
