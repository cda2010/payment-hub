<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal well">

    <div class="modal-header">
        <h4 class="modal-title" id="myDeviseLabel">Création</h4>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div id="simplewizard" class="wizard" data-target="#simplewizard-steps">
                    <ul class="steps">
                        <li data-target="#simplewizardstep1" ng-repeat="step in vm.steps"
                            ng-class="{active: $index==vm.getCurrentStepIndex()}">
                            <span class="step">{{$index+1}}</span>{{step}}<span class="chevron"></span>
                        </li>
                    </ul>
                </div>

                <div class="step-content" id="simplewizard-steps">
                    <div ng-if="vm.showOnglet('Information')" class="step-pane active"
                        ng-class="{active: $index==vm.getCurrentStepIndex()}" id="simplewizardstep1">
                        
                       

                        <div class="form-group">
                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                data-translate="ptiApp.operation.montantOp" for="field_montantOpInit">Montant Op</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <input autocomplete="off" ng-disabled="vm.isViewing" type="number" class="form-control input-xs"
                                    name="montantOp" id="field_montantOpInit" ng-model="vm.operation.montantOp" min="0"
                                    oninput="validity.valid||(value='');" />
                            </div>
                        </div>

                        <fieldset class="mf-fieldset">
                            <legend>Choisir l'organisation à approvisionner</legend>
                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4" for="field_pays">Pays</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_pays" name="pays"
                                        ng-model="vm.paysId"
                                        ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationPays">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" title="Sélectionnez le pays" class="btn btn-primary btn-xs"
                                    j-select-dialog j-multiple="false" j-model="vm.paysId" j-list="vm.organisationPays"
                                    j-columns='vm.organisationColums' j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>

                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4" for="field_fse">FSE</label>
                                <div class="col-sm-6">
                                    <select disabled required class="form-control" id="field_fse" name="fse"
                                        ng-model="vm.fseId"
                                        ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationFSE">
                                        <option value=""></option>
                                    </select>
                                </div>
                                <i ng-if="!vm.isViewing" ng-disabled="vm.paysId==null " title="Sélectionnez le fse"
                                    class="btn btn-primary btn-xs" j-select-dialog j-multiple="false" j-model="vm.fseId"
                                    j-list="vm.organisationFSE" j-columns='vm.organisationColums'
                                    j-event-name="onLoadOrganisation">Choisir...</i>
                            </div>
                         
                            

                         

                          
                        </fieldset>
                    </div>
                    <div class="step-pane active" ng-class="{active: $index==vm.getCurrentStepIndex()}"
                        id="simplewizardstep2" ng-if="vm.showOnglet('Confirmation')">
                       

                        <div class="form-group" ng-if="!vm.isViewing">
                            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_codeOperation">Code validation</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <input autocomplete="off"  required type="text" class="form-control input-xs" name="codeOperation" id="field_codeOperation" ng-model="vm.token" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                data-translate="ptiApp.operation.montantOp" for="field_montantOp">Montant Op</label>
                            <div class="col-xs-6 col-sm-6 col-lg-6">
                                <input autocomplete="off" disabled type="number" class="form-control input-xs" name="montantOp"
                                    id="field_montantOp" ng-model="vm.operation.montantOp" />
                            </div>
                        </div>

                        <div class="form-group" ng-if="vm.typeActeur=='MASTER'" ng-if="!vm.isMaster()">
                            <label class="control-label col-sm-4" for="field_master">Master</label>
                            <div class="col-sm-6">
                                <select disabled class="form-control" id="field_master" name="master"
                                    ng-model="vm.masterId"
                                    ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationMaster">
                                    <option value=""></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" ng-if="vm.typeActeur=='SOUS_DISTRIBUTEUR'">
                            <label class="control-label col-sm-4" for="field_sousDistributeur2">SousDistributeur</label>
                            <div class="col-sm-6">
                                <select disabled class="form-control" id="field_sousDistributeur2"
                                    name="sousDistributeur" ng-model="vm.sousDistributeurId"
                                    ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.organisationSousDistributeur">
                                    <option value=""></option>
                                </select>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="footer actions actions-footer" id="simplewizard-actions">
        <div class="btn-group">
              <button ng-click="vm.traitementOperationC()" type="button" class="btn btn-warning btn-sm"
                ng-if="!vm.hasNextStep()&&vm.isViewing&& vm.operation.statut=='ENATTENTE_VALIDATION'">
                Traiter
            </button>
            <button ng-if="!vm.isViewing" ng-click="vm.clear()" type="button" class="btn btn-default btn-sm btn-prev"
                ng-click="vm.precedent()">Annuler</button>
            <button ng-if="vm.isViewing" ng-click="vm.clear()" type="button" class="btn btn-default btn-sm btn-prev"
                ng-click="vm.precedent()">Fermer</button>
            <button ng-click="vm.decrementStep()" ng-show="vm.hasPreviousStep()" type="button"
                class="btn btn-default btn-sm btn-prev" ng-click="vm.precedent()">Precedent</button>
            <button ng-if="vm.hasNextStep()" ng-click=" vm.incrementStep()" type="button"
                class="btn btn-primary btn-sm btn-next" ng-click="vm.suivant()"
                ng-disabled="editForm.$invalid || vm.isSaving" data-last="Finish">Suivant</button>
            <button ng-if="!vm.hasNextStep() && !vm.isViewing" type="submit" class="btn btn-success btn-sm "
                ng-click="vm.suivant()" ng-disabled="editForm.$invalid || vm.isSaving" data-last="Finish"><span
                    class="glyphicon glyphicon-save"></span>Valider</button>
        </div>
    </div>
</form>
