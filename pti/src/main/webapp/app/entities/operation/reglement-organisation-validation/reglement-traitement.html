
<form name="editForm" class="form-horizontal" role="form" novalidate ng-submit="vm.confirm()">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myValeurCodeLabel" >Traitement de l'operation</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_codeOperation">Code validation</label>
            <div class="col-xs-6 col-sm-6 col-lg-6">
                <input autocomplete="off"  required type="text" class="form-control input-xs" name="codeOperation" id="field_codeOperation" ng-model="vm.token" />
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_typePersonne">Commentaire</label>
            <div class="col-sm-6">
                    <textarea  ng-model="vm.operation.commentaire"
                               rows="4"
                               ng-maxlength="1000" class="form-control" name="commentaire" id="field_description">
                    </textarea>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Annuler</span>
        </button>

        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Valider</span>
        </button>
    </div>
</form>
