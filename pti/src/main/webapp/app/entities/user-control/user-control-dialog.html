
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myUserControlLabel" data-translate="ptiApp.userControl.home.createOrEditLabel">Create or edit a User Control</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.userControl.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.userControl.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.userControl.action" for="field_action">Action</label>
            <select class="form-control" name="action" ng-model="vm.userControl.action" id="field_action">
                <option value="DESABLE" data-translate="ptiApp.TypeControl.DESABLE">DESABLE</option>
                <option value="RESET_PASSWORD" data-translate="ptiApp.TypeControl.RESET_PASSWORD">RESET_PASSWORD</option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.userControl.codePays" for="field_codePays">Code Pays</label>
            <input type="text" class="form-control" name="codePays" id="field_codePays"
                    ng-model="vm.userControl.codePays"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.userControl.login" for="field_login">Login</label>
            <input type="text" class="form-control" name="login" id="field_login"
                    ng-model="vm.userControl.login"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.userControl.password" for="field_password">Password</label>
            <input type="text" class="form-control" name="password" id="field_password"
                    ng-model="vm.userControl.password"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.userControl.typeActeur" for="field_typeActeur">Type Acteur</label>
            <input type="text" class="form-control" name="typeActeur" id="field_typeActeur"
                    ng-model="vm.userControl.typeActeur"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
