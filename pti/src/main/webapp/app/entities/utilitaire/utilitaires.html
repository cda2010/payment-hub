<div class="container-fluid">
<div class="row">
    <div class="well with-header" style="margin-top:10px ">
        <div class="header bg-blue " >
            <div class="col-xs-9" data-translate="ptiApp.utilitaire.home.createLabel">
                <h4>Create new Utilitaire</h4>
            </div>
            <div class="no-padding-left col-xs-3" >
                <button class="btn btn-default btn-circle btn-xs"  ui-sref="utilitaire.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <!-- <span  data-translate="ptiApp.credentialApi.home.createLabel">
                           Create new Credential Api
                      </span>-->
                </button>
                <div class="btn-group mr15" uib-dropdown>
                    <button type="button" class="btn btn-default dropdown-toggle btn-xs" data-toggle="dropdown" aria-expanded="false" uib-dropdown-toggle>{{vm.itemsPerPage}}
                        éléments par page <span class="caret"></span>
                    </button>
                    <ul class="dropdown-menu" role="menu" uib-dropdown-menu>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(15)">15 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(20)">20 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(30)">30 éléments par page</a>
                        </li>
                        <li>
                            <a href="javascript:;" ng-click="vm.setItemsPerPage(40)">40 éléments par page</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <table class="table table-hover">
            <thead class="bordered-blue">
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
<!--
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
-->
                    <th jh-sort-by="nom"><span data-translate="ptiApp.utilitaire.nom">Nom</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="description"><span data-translate="ptiApp.utilitaire.description">Description</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="utilitaire in vm.utilitaires track by utilitaire.id">
<!--
                    <td><a ui-sref="utilitaire-detail({id:utilitaire.id})">{{utilitaire.id}}</a></td>
-->
                    <td>{{utilitaire.nom}}</td>
                    <td>{{utilitaire.description}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <!--<button type="submit"
                                    ui-sref="utilitaire-detail({id:utilitaire.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>-->
                            <button type="submit"
                                    ui-sref="utilitaire.edit({id:utilitaire.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="utilitaire.delete({id:utilitaire.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
</div>
