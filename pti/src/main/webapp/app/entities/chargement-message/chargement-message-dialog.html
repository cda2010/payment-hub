
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myChargementMessageLabel" data-translate="ptiApp.chargementMessage.home.createOrEditLabel">Create or edit a Chargement Message</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.chargementMessage.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.chargementMessage.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.chargementMessage.nom_fichier" for="field_nom_fichier">Nom Fichier</label>
            <input type="text" class="form-control" name="nom_fichier" id="field_nom_fichier"
                    ng-model="vm.chargementMessage.nom_fichier"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.chargementMessage.date_chargement" for="field_date_chargement">Date Chargement</label>
                <div class="input-group">
                    <input id="field_date_chargement" type="text" class="form-control" name="date_chargement" datetime-picker="{{dateformat}}" ng-model="vm.chargementMessage.date_chargement" is-open="vm.datePickerOpenStatus.date_chargement"
                    />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('date_chargement')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
