
<div>
    <h2><span data-translate="ptiApp.chargementMessage.detail.title">Chargement Message</span> {{vm.chargementMessage.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.chargementMessage.nom_fichier">Nom Fichier</span></dt>
        <dd>
            <span>{{vm.chargementMessage.nom_fichier}}</span>
        </dd>
        <dt><span data-translate="ptiApp.chargementMessage.date_chargement">Date Chargement</span></dt>
        <dd>
            <span>{{vm.chargementMessage.date_chargement | date:'medium'}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="chargement-message-detail.edit({id:vm.chargementMessage.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
