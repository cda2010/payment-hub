
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myListeDiffusionLabel" data-translate="ptiApp.listeDiffusion.home.createOrEditLabel">Create or edit a Liste Diffusion</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.listeDiffusion.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.listeDiffusion.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.listeDiffusion.nomListe" for="field_nomListe">Nom Liste</label>
            <input type="text" class="form-control" name="nomListe" id="field_nomListe"
                    ng-model="vm.listeDiffusion.nomListe"
                    />
        </div>
        <fieldset  style="background-color: lightblue;max-height: 200px; overflow-y: scroll;" class=" mf-fieldset p10 ">
            <div class="col-sm-12 mb5">
                <span style="float: right" class="btn btn-primary" ng-click="vm.addDetail()">
                    <span class="glyphicon glyphicon-plus-sign"></span>
                </span>
            </div>
            <legend>Contact(s)</legend>
            <div class="form-group margin-5" ng-repeat="contact in vm.detaillistediffusions track by $index">
                <div class="col-sm-10">
                    <input type="text" class="form-control" ng-model="contact.numero" required>
                </div>
                <span class="btn btn-danger btn-sm" ng-click="vm.deleteDetail($index)">
                    <span class="glyphicon glyphicon-remove"></span>
                </span>
            </div>
        </fieldset>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
