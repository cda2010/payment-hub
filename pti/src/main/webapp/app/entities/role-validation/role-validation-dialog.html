
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myRoleValidationLabel" data-translate="ptiApp.roleValidation.home.createOrEditLabel">Create or edit a Role Validation</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.roleValidation.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.roleValidation.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.roleValidation.typeService" for="field_typeService">Type Service</label>
            <select class="form-control input-xs" ng-disabled="vm.isViewing" id="field_typeService" name="typeService"
                    ng-model="vm.roleValidation.typeServiceId" ng-options="typeService.id as typeService.libelle for typeService in vm.typeServices" required >
                <option value=""></option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.roleValidation.operateur" for="field_operateur">Operateur</label>
            <select class="form-control input-xs" ng-disabled="vm.isViewing" id="field_operateur" name="operateur"
                    ng-model="vm.roleValidation.operateur" ng-options="operateur as operateur for operateur in vm.operateurs"
                    required >
                <option value=""></option>
            </select>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.roleValidation.montant" for="field_montant">Montant</label>
            <input type="text" class="form-control" name="montant" id="field_montant"
                    ng-model="vm.roleValidation.montant" numeric
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.roleValidation.role" for="field_role">Role</label>
            <select class="form-control input-xs" ng-disabled="vm.isViewing" id="field_role" name="operateur"
                    ng-model="vm.roleValidation.roleName" ng-options="role.name as role.name for role in vm.roles"
                    required >
                <option value=""></option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
