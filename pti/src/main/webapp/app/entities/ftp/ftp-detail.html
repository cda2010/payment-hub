
<div>
    <h2><span data-translate="ptiApp.ftp.detail.title">Ftp</span> {{vm.ftp.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.ftp.url">Url</span></dt>
        <dd>
            <span>{{vm.ftp.url}}</span>
        </dd>
        <dt><span data-translate="ptiApp.ftp.username">Username</span></dt>
        <dd>
            <span>{{vm.ftp.username}}</span>
        </dd>
        <dt><span data-translate="ptiApp.ftp.password">Password</span></dt>
        <dd>
            <span>{{vm.ftp.password}}</span>
        </dd>
        <dt><span data-translate="ptiApp.ftp.repertoire">Repertoire</span></dt>
        <dd>
            <span>{{vm.ftp.repertoire}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="ftp-detail.edit({id:vm.ftp.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
