
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myFtpLabel" data-translate="ptiApp.ftp.home.createOrEditLabel">Create or edit a Ftp</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ftp.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ftp.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ftp.url" for="field_url">Url</label>
            <input type="text" class="form-control" name="url" id="field_url"
                    ng-model="vm.ftp.url"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ftp.username" for="field_username">Username</label>
            <input type="text" class="form-control" name="username" id="field_username"
                    ng-model="vm.ftp.username"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ftp.password" for="field_password">Password</label>
            <input type="text" class="form-control" name="password" id="field_password"
                    ng-model="vm.ftp.password"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ftp.repertoire" for="field_repertoire">Repertoire</label>
            <input type="text" class="form-control" name="repertoire" id="field_repertoire"
                    ng-model="vm.ftp.repertoire"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
