
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myListeLabel" data-translate="ptiApp.liste.home.createOrEditLabel">Create or edit a Liste</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.liste.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.liste.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.liste.options" for="field_options">Options</label>
            <input type="text" class="form-control" name="options" id="field_options"
                    ng-model="vm.liste.options"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.liste.multiple" for="field_multiple">Multiple</label>
                <input type="checkbox" name="multiple" id="field_multiple"
                          ng-model="vm.liste.multiple"/>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
