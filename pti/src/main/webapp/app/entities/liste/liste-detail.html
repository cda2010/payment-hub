
<div>
    <h2><span data-translate="ptiApp.liste.detail.title">Liste</span> {{vm.liste.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.liste.options">Options</span></dt>
        <dd>
            <span>{{vm.liste.options}}</span>
        </dd>
        <dt><span data-translate="ptiApp.liste.multiple">Multiple</span></dt>
        <dd>
            <span>{{vm.liste.multiple}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="liste-detail.edit({id:vm.liste.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
