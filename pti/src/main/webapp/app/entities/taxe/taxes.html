<div>
    <h2 data-translate="ptiApp.taxe.home.title">Taxes</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="taxe.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.taxe.home.createLabel">
                        Create new Taxe
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="modeCalcul"><span data-translate="ptiApp.taxe.modeCalcul">Mode Calcul</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="appliqueSur"><span data-translate="ptiApp.taxe.appliqueSur">Applique Sur</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="valeur"><span data-translate="ptiApp.taxe.valeur">Valeur</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="taxe in vm.taxes track by taxe.id">
                    <td><a ui-sref="taxe-detail({id:taxe.id})">{{taxe.id}}</a></td>
                    <td data-translate="{{'ptiApp.TypeTarif.' + taxe.modeCalcul}}">{{taxe.modeCalcul}}</td>
                    <td data-translate="{{'ptiApp.MontantsAComptabilise.' + taxe.appliqueSur}}">{{taxe.appliqueSur}}</td>
                    <td>{{taxe.valeur}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="taxe-detail({id:taxe.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="taxe.edit({id:taxe.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="taxe.delete({id:taxe.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
