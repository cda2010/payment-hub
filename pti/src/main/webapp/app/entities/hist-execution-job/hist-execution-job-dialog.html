
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myHistExecutionJobLabel" data-translate="ptiApp.histExecutionJob.home.createOrEditLabel">Create or edit a Hist Execution Job</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.histExecutionJob.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.histExecutionJob.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.typeTrigger" for="field_typeTrigger">Type Trigger</label>
            <input type="text" class="form-control" name="typeTrigger" id="field_typeTrigger"
                    ng-model="vm.histExecutionJob.typeTrigger"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.debutExecution" for="field_debutExecution">Debut Execution</label>
                <div class="input-group">
                    <input id="field_debutExecution" type="text" class="form-control" name="debutExecution" datetime-picker="{{dateformat}}" ng-model="vm.histExecutionJob.debutExecution" is-open="vm.datePickerOpenStatus.debutExecution"
                    />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('debutExecution')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.finExecution" for="field_finExecution">Fin Execution</label>
                <div class="input-group">
                    <input id="field_finExecution" type="text" class="form-control" name="finExecution" datetime-picker="{{dateformat}}" ng-model="vm.histExecutionJob.finExecution" is-open="vm.datePickerOpenStatus.finExecution"
                    />
                    <span class="input-group-btn">
                        <button type="button" class="btn btn-default" ng-click="vm.openCalendar('finExecution')"><i class="glyphicon glyphicon-calendar"></i></button>
                    </span>
                </div>
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.statut" for="field_statut">Statut</label>
            <input type="text" class="form-control" name="statut" id="field_statut"
                    ng-model="vm.histExecutionJob.statut"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.messageErreur" for="field_messageErreur">Message Erreur</label>
            <input type="text" class="form-control" name="messageErreur" id="field_messageErreur"
                    ng-model="vm.histExecutionJob.messageErreur"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.histExecutionJob.erreurLog" for="field_erreurLog">Erreur Log</label>
            <input type="text" class="form-control" name="erreurLog" id="field_erreurLog"
                    ng-model="vm.histExecutionJob.erreurLog"
                    />
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.histExecutionJob.ptiJobDetail" for="field_ptiJobDetail">Pti Job Detail</label>
            <select class="form-control" id="field_ptiJobDetail" name="ptiJobDetail" ng-model="vm.histExecutionJob.ptiJobDetailId" ng-options="ptiJobDetails.id as ptiJobDetails.id for ptiJobDetails in vm.ptijobdetails"            >
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
