<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEtapeServiceLabel" data-translate="ptiApp.canalApplication.home.createOrEditLabel">
            Create or edit a Type Service Reseau Organisation</h4>
    </div> 
    <!--  {{vm.canals}} -->
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Code Pays</label>  
            <div class="col-sm-6">
                <select name="type" id="field_codePays"  class="form-control"  ng-model="vm.typeServiceReseauOrganisation.codePays" ng-change="vm.onChangeCodePays()">
                            <option value="226">226</option>
                            <option value="225">225</option>
                            <option value="224">224</option>
                            <option value="223">223</option>
                </select>
<!--                 <input class="form-control" id="field_codePays" name="codePays" type="text" ng-model="vm.typeServiceReseauOrganisation.codePays" ng-change="vm.onChangeCodePays()" required/>
 -->            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Code PV</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_codePv" name="codePv" type="text" ng-model="vm.typeServiceReseauOrganisation.codePv" required/>
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-4" for="field_uniteOrganisation">FSE</label>
        <!-- <div class="col-sm-6">
            <ui-select multiple tagging tagging-label="false" ng-model="vm.typeServiceReseauOrganisation.uniteOrganisation" theme="bootstrap" title="Choose a type">
                <ui-select-match placeholder="Sélectionner un Fse...">{{$item.libelleUniteOrganisation}}</ui-select-match>
                <ui-select-choices repeat="uo in vm.FSEs | filter: $select.search">
                    <span ng-bind="uo.libelleUniteOrganisation"></span>
                </ui-select-choices>
            </ui-select>
        </div> -->
        <div class="col-sm-6">
            <select required class="form-control" id="field_pays" name="uniteOrganisation" ng-model="vm.typeServiceReseauOrganisation.uniteOrganisation"
                ng-options="uniteOrganisation as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.FSEs">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-sm-4" for="field_typeService">Type Service</label>
        <div class="col-sm-6">
            <ui-select multiple tagging tagging-label="false" ng-model="vm.typeServiceReseauOrganisation.typeService" theme="bootstrap" title="Choose a type">
                <ui-select-match placeholder="Sélectionner un type de service...">{{$item.libelle}}</ui-select-match>
                <ui-select-choices repeat="typeService in vm.typeservices | filter: $select.search">
                    <span ng-bind="typeService.libelle"></span>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
            data-translate="entity.action.cancel">Cancel</span>
    </button>
    <!--  <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">-->
    <button type="submit" class="btn btn-primary">
        <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
    </button>
</div>
</form>
