<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal well">
    <div class="modal-header">
        <h4 class="modal-title" id="labelEnvoiCash" ng-if="vm.operation.code=='ENVOI_CASH' && vm.isViewing">Envoi de
            cash</h4>
        <h4 class="modal-title" id="labelRetrait" ng-if="vm.operation.code=='RETRAIT'&& vm.isViewing">Retrait d'argent
        </h4>
        <h4 class="modal-title" id="labelEnvoiCashE" ng-if="vm.operation.id==null">Evènement Opération</h4>
        <h4 class="modal-title" id="labelOpExpire" ng-if="vm.isExpired">Traitement operation expirée</h4>
    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-lg-12 col-sm-12 col-xs-12">
                <div id="simplewizard" class="wizard" data-target="#simplewizard-steps">
                    <ul class="steps">
                        <li data-target="#simplewizardstep1" ng-repeat="step in vm.steps"
                            ng-class="{active: $index==vm.getCurrentStepIndex()}">
                            <span class="step">{{$index+1}}</span>{{step}}<span class="chevron"></span>
                        </li>
                    </ul>
                </div>
                <div class="step-content" id="simplewizard-steps">


                    <div class="step-pane active" ng-class="{active: $index==vm.getCurrentStepIndex()}"
                        id="simplewizardstep3" ng-if="vm.showOnglet('Expéditeur')">
                        <div class="row">
                            <div ng-include="'app/entities/evenement-operation/personne.html'"> </div>
                        </div>
                    </div>

                    <div class="step-pane active" ng-class="{active: $index==vm.getCurrentStepIndex()}"
                        id="simplewizardstep2" ng-if="vm.showOnglet('Confirmation')">
                        <div class="row">
                           
                            <div class="form-group" ng-if="!vm.isViewing">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                    for="field_codeOperation">Code validation</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input  autocomplete="off" required  type="text" class="form-control input-xs"
                                        name="codeOperation" id="field_codeOperation" ng-model="vm.token" />
                                </div>
                            </div>


                            <div class="form-group" ng-if="vm.personneE.typePersonne=='PHYSIQUE'">
                                <label class="control-label col-sm-4 col-xs-4 col-lg-4"
                                    for="field_emetteur">Expéditeur</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input autocomplete="off" disabled class="form-control input-xs" id="field_emetteur"
                                        name="emetteur" ng-model="vm.emetteur"
                                        ng-init="vm.emetteur=vm.personnePhysiqueE.nomClient+' '+vm.personnePhysiqueE.prenomClient" />
                                </div>

                            </div>


                            <div class="form-group">
                                <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4"
                                       data-translate="ptiApp.operation.montantOp" for="field_montantOp">Montant</label>
                                <div class="col-xs-6 col-sm-6 col-lg-6">
                                    <input type="text" autocomplete="off" required ng-disabled="vm.isViewing || vm.isFraisDispo"
                                           class="form-control input-xs" name="montantOp"
                                           numeric   decimals="0"    id="field_montantOp" ng-model="vm.operation.montantOp" min="0"
                                           oninput="validity.valid||(value='');" />
                                </div>
                            </div>

                            <div class="form-group" >
                                    <label mf-required class="control-label col-sm-4 col-xs-4 col-lg-4" for="field_motif">Motif</label>
                                    <div class="col-sm-6">
                                    <textarea  ng-model="vm.operation.motif" required
                                   rows="4"
                                   ng-maxlength="1000" class="form-control" name="commentaire" id="field_description">
                                    </textarea>
                                    </div>
                            </div>






                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    <div class="footer actions actions-footer" id="simplewizard-actions">
        <div class="pull-left mt5" ng-if="vm.isMaj || vm.validation">


            <button ng-click="vm.traitementOperation()" type="button" class="btn btn-warning btn-sm"
                ng-if="!vm.hasNextStep()&&vm.isViewing&& vm.operation.statut=='ENATTENTE_VALIDATION'">
                Traiter
            </button>
        </div>

        <div class="btn-group">


            <button ng-click="vm.clear()" type="button" class="btn btn-warning btn-sm " ng-if="!vm.isViewing">
                Annuler</button>

            <button ng-click="vm.clear()" type="button" class="btn btn-default btn-sm" ng-if="vm.isViewing">
                Fermer</button>

            <button ng-click="vm.decrementStep()" type="button" ng-if="vm.hasPreviousStep()"
                class="btn btn-default btn-sm btn-prev"> <i class="fa fa-angle-left"></i>Precedent</button>

            <button ng-disabled="!vm.isViewing && (editForm.$invalid || vm.isSaving )"
                ng-click=" vm.incrementStep()" type="button" class="btn btn-primary btn-sm btn-next"
                ng-click="vm.suivant()" ng-if="vm.hasNextStep()" data-last="Finish">Suivant</button>

            <button ng-disabled="editForm.$invalid || vm.isSaving " ng-if="!vm.hasNextStep() && !vm.isViewing"
                type="submit" class="btn btn-success btn-sm" data-last="Finish"
                ng-disabled="editForm.$invalid || vm.isSaving">Valider</button>
        </div>
    </div>
</form>
