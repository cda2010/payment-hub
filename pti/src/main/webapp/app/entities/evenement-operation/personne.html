<div class="col-sm-12 col-lg-12 col-xs-12">
    <div class="row" ng-if="!vm.isViewing">
        <button type="button" ng-click="vm.searchPersonne()" class="btn-info">
            <span class="glyphicon glyphicon-search"></span>
            <span>Rechercher l'expéditeur</span>
        </button>
    </div>
    <div class="row">

        <div class="form-group col-sm-6">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.personne.typePersonne"
                for="field_typePersonne">Type Personne</label>
            <div class="col-sm-8">
                <select ng-disabled="vm.isViewing" class="form-control" name="typePersonne" readonly
                    ng-model="vm.personneE.typePersonne" id="field_typePersonne">
                    <option value="PHYSIQUE" data-translate="ptiApp.TypePersonne.PHYSIQUE">PHYSIQUE</option>
                    <option value="MORALE" data-translate="ptiApp.TypePersonne.MORALE">MORALE</option>
                </select>
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.personne.telephone"
                for="field_telephone">Telephone</label>
            <div class="col-sm-3">
                <select ng-disabled="vm.isViewing" class="form-control input-xs" id="field_nationalite" readonly
                    name="nationalite" ng-model="vm.personneE.codePaysTelephone"
                    ng-options="nationalite.code as nationalite.libelle for nationalite in vm.nationalites">
                    <option value="">Code</option>
                </select>
            </div>
            <div class="col-sm-5">
                <span class="input-icon icon-right">
                    <input autocomplete="off" required ng-disabled="vm.isViewing" type="text" class="form-control"
                        name="telephone" id="field_telephone" ng-model="vm.personneE.telephone" readonly />
                    <span class="fa fa-eye validity"></span>
                </span>
            </div>
        </div>

    </div>
    <div class="row">
        <div class="form-group col-sm-6">
            <label  class="col-sm-4 control-label" for="field_nomClient">Nom</label>
            <div class="col-sm-8">
                <input autocomplete="off" ng-disabled="vm.isViewing" type="text" class="form-control input-xs"
                    name="nomClient" id="field_nomClient" ng-model="vm.personnePhysiqueE.nomClient" readonly />
            </div>
        </div>

        <div class="form-group col-sm-6">
            <label  class="col-sm-4 control-label" for="field_PrenomClient">Prénom</label>
            <div class="col-sm-8">
                <input autocomplete="off" ng-disabled="vm.isViewing" type="text" class="form-control input-xs"
                    name="nomClient" id="field_PrenomClient" ng-model="vm.personnePhysiqueE.prenomClient" readonly />
            </div>
        </div>
    </div>
    <div class="row">
        <div class="form-group col-sm-6">
            <label class=" col-sm-4 control-label" data-translate="ptiApp.personnePhysique.sexe"
                for="field_sexe">Sexe</label>
            <div class="col-sm-8">
                <select ng-disabled="vm.isViewing" class="form-control input-xs" name="sexe" readonly
                    ng-model="vm.personnePhysiqueE.sexe" id="field_sexe">
                    <option value="MASCULIN" data-translate="ptiApp.Sexe.MASCULIN">MASCULIN</option>
                    <option value="FEMININ" data-translate="ptiApp.Sexe.FEMININ">FEMININ</option>
                </select>
            </div>
        </div>

        <div class="form-group col-sm-6">
            <label class=" col-sm-4 control-label" data-translate="ptiApp.personnePhysique.dateNaissance"
                for="field_dateNaissance">Date Naissance</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input autocomplete="off" ng-disabled="vm.isViewing" show-button-bar="false" popup-placement="top"
                        ng-disabled="vm.isViewing" id="field_dateNaissance" show-button-bar="false" type="text"
                        class="form-control input-xs" name="dateNaissance" uib-datepicker-popup="dd/MM/yyyy" readonly
                        ng-model="vm.personnePhysiqueE.dateNaissance" is-open="vm.datePickerOpenStatus.dateNaissance" />

                </div>
            </div>
        </div>



    </div>
    <div class="row">

        <div class="form-group col-sm-6">
            <label class="col-sm-4 control-label" data-translate="ptiApp.personnePhysique.lieuNaissance"
                for="field_lieuNaissance">Lieu Naissance</label>
            <div class="col-sm-8">
                <input autocomplete="off" ng-disabled="vm.isViewing" type="text" class="form-control input-xs"
                    name="lieuNaissance" id="field_lieuNaissance" ng-model="vm.personnePhysiqueE.lieuNaissance" readonly />
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label class=" col-sm-4 control-label" for="field_nationalite">Pays de résidence</label>
            <div class="col-sm-8">
                <select ng-disabled="vm.isViewing" class="form-control input-xs" id="field_nationalite" readonly
                    name="nationalite" ng-model="vm.personnePhysiqueE.nationaliteId"
                    ng-options="nationalite.id as nationalite.libelle for nationalite in vm.nationalites">
                    <option value="">Choisir</option>
                </select>
            </div>
        </div>

    </div>

    <div class="row">
        <div class="form-group col-sm-6">
            <label class="col-sm-4 control-label" for="field_adresse">Adresse</label>
            <div class="col-sm-8">
                <input autocomplete="off"  ng-disabled="vm.isViewing" type="text" class="form-control input-xs" readonly
                    name="adresse" id="field_adresse" ng-model="vm.personneE.adresse" />
            </div>
        </div>
        <div class="form-group col-sm-6">
            <label  class=" col-sm-4 control-label" for="field_profession">Profession</label>
            <div class="col-sm-8">
                <select ng-model="vm.personneE.brancheActiviteId"  ng-disabled="vm.isViewing" readonly
                    class="form-control input-xs" id="field_profession" name="profession"
                    ng-model="vm.personnePhysiqueE.professionId"
                    ng-options="profession.id as profession.libelle for profession in vm.branchesActivites">
                    <option value="">Choisir</option>
                </select>
            </div>
        </div>
    </div>

</div>
