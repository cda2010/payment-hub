<div>
    <h2 data-translate="ptiApp.canalCommunication.home.title">Canal Communications</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="canal-communication.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.canalCommunication.home.createLabel">
                        Create new Canal Communication
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr>
                    <th><span data-translate="global.field.id">ID</span></th>
                    <th><span data-translate="ptiApp.canalCommunication.facturier">Facturier</span></th>
                    <th><span data-translate="ptiApp.canalCommunication.ftp">Ftp</span></th>
                    <th><span data-translate="ptiApp.canalCommunication.recepteurEmail">Recepteur Email</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="canalCommunication in vm.canalCommunications track by canalCommunication.id">
                    <td><a ui-sref="canal-communication-detail({id:canalCommunication.id})">{{canalCommunication.id}}</a></td>
                    <td>
                        <a ui-sref="facturier-detail({id:canalCommunication.facturier.id})">{{canalCommunication.facturier.id}}</a>
                    </td>
                    <td>
                        <a ui-sref="ftp-detail({id:canalCommunication.ftp.id})">{{canalCommunication.ftp.id}}</a>
                    </td>
                    <td>
                        <a ui-sref="recepteur-email-detail({id:canalCommunication.recepteurEmail.id})">{{canalCommunication.recepteurEmail.id}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="canal-communication-detail({id:canalCommunication.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="canal-communication.edit({id:canalCommunication.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="canal-communication.delete({id:canalCommunication.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
