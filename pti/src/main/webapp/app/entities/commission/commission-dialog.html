<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true" ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myCommissionLabel" data-translate="ptiApp.commission.home.createOrEditLabel">Create or edit a Commission</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.commission.montant" for="field_montant">Montant</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="number" class="form-control" name="montant" id="field_montant" ng-model="vm.commission.montant" />
            </div>
        </div>
        <div class="form-group">
            <div class="checkbox col-sm-6 col-sm-offset-4">
                <label>
                <input autocomplete="off"type="checkbox"  class="colored-success" name="estPaye" id="field_estPaye" ng-model="vm.commission.estPaye" />
                    <span class="text">Est Paye?</span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.commission.datePaiement" for="field_datePaiement">Date Paiement</label>
            <div class="col-sm-6">
                <input autocomplete="off"ng-focus="vm.openCalendar('datePaiement')" id="field_datePaiement" type="text" class="form-control" name="datePaiement" datetime-picker="{{dateformat}}" ng-model="vm.commission.datePaiement" is-open="vm.datePickerOpenStatus.datePaiement" />
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.commission.operation" for="field_operation">Operation</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_operation" name="operation" ng-model="vm.commission.operationId" ng-options="operation.id as operation.codeOperation for operation in vm.operations">
                    <option value=""></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.commission.organisation" for="field_organisation">Organisation</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_organisation" name="organisation" ng-model="vm.commission.organisationId" ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.uniteorganisations">
                    <option value=""></option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
    </form>
