
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myLigneChargementLabel" data-translate="ptiApp.ligneChargement.home.createOrEditLabel">Create or edit a Ligne Chargement</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.ligneChargement.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.ligneChargement.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.nom" for="field_nom">Nom</label>
            <input type="text" class="form-control" name="nom" id="field_nom"
                    ng-model="vm.ligneChargement.nom"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.prenom" for="field_prenom">Prenom</label>
            <input type="text" class="form-control" name="prenom" id="field_prenom"
                    ng-model="vm.ligneChargement.prenom"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.numeroCompte" for="field_numeroCompte">Numero Compte</label>
            <input type="number" class="form-control" name="numeroCompte" id="field_numeroCompte"
                    ng-model="vm.ligneChargement.numeroCompte"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.numeroTelephone" for="field_numeroTelephone">Numero Telephone</label>
            <input type="number" class="form-control" name="numeroTelephone" id="field_numeroTelephone"
                    ng-model="vm.ligneChargement.numeroTelephone"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.montant" for="field_montant">Montant</label>
            <input type="number" class="form-control" name="montant" id="field_montant"
                    ng-model="vm.ligneChargement.montant"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.error" for="field_error">Error</label>
            <input type="text" class="form-control" name="error" id="field_error"
                    ng-model="vm.ligneChargement.error"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.ligneChargement.statutLigne" for="field_statutLigne">Statut Ligne</label>
            <input type="number" class="form-control" name="statutLigne" id="field_statutLigne"
                    ng-model="vm.ligneChargement.statutLigne"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
