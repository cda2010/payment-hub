
<div>
    <h2><span data-translate="ptiApp.operationCommentaire.detail.title">Operation Commentaire</span> {{vm.operationCommentaire.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.operationCommentaire.commentaire">Commentaire</span></dt>
        <dd>
            <span>{{vm.operationCommentaire.commentaire}}</span>
        </dd>
        <dt><span data-translate="ptiApp.operationCommentaire.operation">Operation</span></dt>
        <dd>
            <a ui-sref="operation-detail({id:vm.operationCommentaire.operation.id})">{{vm.operationCommentaire.operation.id}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="operation-commentaire-detail.edit({id:vm.operationCommentaire.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
