
<div>
    <h2><span data-translate="ptiApp.commerciale.detail.title">Commerciale</span> {{vm.commerciale.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.commerciale.nom">Nom</span></dt>
        <dd>
            <span>{{vm.commerciale.nom}}</span>
        </dd>
        <dt><span data-translate="ptiApp.commerciale.prenom">Prenom</span></dt>
        <dd>
            <span>{{vm.commerciale.prenom}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="commerciale-detail.edit({id:vm.commerciale.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
