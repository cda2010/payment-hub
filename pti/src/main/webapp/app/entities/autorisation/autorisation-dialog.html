<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myAutorisationLabel" data-translate="ptiApp.autorisation.home.createOrEditLabel">Create or edit a Autorisation</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.autorisation.code" for="field_code">Code</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" class="form-control" name="code" id="field_code"
                    ng-model="vm.autorisation.code"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.autorisation.uniteOrganisation" for="field_uniteOrganisation">Unite Organisation</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_uniteOrganisation" name="uniteOrganisation" ng-model="vm.autorisation.uniteOrganisationId" ng-options="uniteOrganisation.id as uniteOrganisation.libelleUniteOrganisation for uniteOrganisation in vm.uniteorganisations"            >
                            <option value=""></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.autorisation.typeService" for="field_typeService">Type Service</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_typeService" name="typeService" ng-model="vm.autorisation.typeServiceId" ng-options="typeService.id as typeService.libelle for typeService in vm.typeservices"            >
                            <option value=""></option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
