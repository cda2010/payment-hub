
<form class="form-horizontal" name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myHoraireAuthentificationLabel" data-translate="ptiApp.horaireAuthentification.home.createOrEditLabel">Create or edit a Horaire Authentification</h4>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.horaireAuthentification.jour" for="field_jour">Jour</label>
            <div class="col-sm-6">
                <select class="form-control" name="jour" ng-model="vm.horaireAuthentification.jour" id="field_jour" required>
                    <option value="LUNDI" data-translate="ptiApp.Jour.LUNDI">LUNDI</option>
                    <option value="MARDI" data-translate="ptiApp.Jour.MARDI">MARDI</option>
                    <option value="MERCREDI" data-translate="ptiApp.Jour.MERCREDI">MERCREDI</option>
                    <option value="JEUDI" data-translate="ptiApp.Jour.JEUDI">JEUDI</option>
                    <option value="VENDREDI" data-translate="ptiApp.Jour.VENDREDI">VENDREDI</option>
                    <option value="SAMEDI" data-translate="ptiApp.Jour.SAMEDI">SAMEDI</option>
                    <option value="DIMANCHE" data-translate="ptiApp.Jour.DIMANCHE">DIMANCHE</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label mf-required  class="control-label col-sm-4" data-translate="ptiApp.horaireAuthentification.heureDebut" for="field_heureDebut">Heure Debut</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" data-mask="99:99" placeholder="00:00" class="form-control" name="heureDebut" id="field_heureDebut"
                ng-model="vm.horaireAuthentification.heureDebut"
                required/>
            </div>
        </div>
        <div class="form-group">
            <label mf-required class="control-label col-sm-4" data-translate="ptiApp.horaireAuthentification.heureFin" for="field_heureFin">Heure Fin</label>
            <div class="col-sm-6">
                <input autocomplete="off"type="text" data-mask="99:99" placeholder="00:00" class="form-control" name="heureFin" id="field_heureFin"
                ng-model="vm.horaireAuthentification.heureFin"
                required/>
            </div>
        </div>

        <div class="form-group">
                <div class="checkbox col-sm-6 col-sm-offset-4">
                    <label>
                        <input autocomplete="off"class="colored-success" type="checkbox" name="obligatoire" id="field_obligatoire"
                            ng-model="vm.horaireAuthentification.activated" />
                        <b class="text">Active ?</b>
                    </label>
                </div>
            </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
