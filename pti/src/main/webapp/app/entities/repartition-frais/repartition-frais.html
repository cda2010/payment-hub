<div>
    <h2 data-translate="ptiApp.repartitionFrais.home.title">Repartition Frais</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="repartition-frais.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="ptiApp.repartitionFrais.home.createLabel">
                        Create new Repartition Frais
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="jh-table table table-striped">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                    <th jh-sort-by="id"><span data-translate="global.field.id">ID</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="min"><span data-translate="ptiApp.repartitionFrais.min">Min</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="max"><span data-translate="ptiApp.repartitionFrais.max">Max</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="typeTarif"><span data-translate="ptiApp.repartitionFrais.typeTarif">Type Tarif</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="acteur"><span data-translate="ptiApp.repartitionFrais.acteur">Acteur</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="typeServiceId"><span data-translate="ptiApp.repartitionFrais.typeService">Type Service</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="repartitionFrais in vm.repartitionFrais track by repartitionFrais.id">
                    <td><a ui-sref="repartition-frais-detail({id:repartitionFrais.id})">{{repartitionFrais.id}}</a></td>
                    <td>{{repartitionFrais.min}}</td>
                    <td>{{repartitionFrais.max}}</td>
                    <td data-translate="{{'ptiApp.TypeTarif.' + repartitionFrais.typeTarif}}">{{repartitionFrais.typeTarif}}</td>
                    <td data-translate="{{'ptiApp.Acteur.' + repartitionFrais.acteur}}">{{repartitionFrais.acteur}}</td>
                    <td>
                        <a ui-sref="type-service-detail({id:repartitionFrais.typeServiceId})">{{repartitionFrais.typeServiceId}}</a>
                    </td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="repartition-frais-detail({id:repartitionFrais.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartition-frais.edit({id:repartitionFrais.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.edit"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="repartition-frais.delete({id:repartitionFrais.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.delete"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
