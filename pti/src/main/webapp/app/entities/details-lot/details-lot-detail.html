                    <input type="text" class="form-control" id="id" name="id"
                           ng-model="vm.lot.id" readonly />
                </div>

                <div class="col-sm-4 form-group">
                    <label class="control-label" for="field_numero">Numero</label>

                </div>
                <div class="col-sm-4 form-group">
                    <label class="control-label" for="field_date_ouverture">Date Ouverture</label>
                    <input type="text" class="form-control" name="dateouverture" id="field_dateouverture"
                           ng-model="vm.lot.dateOuverture" disabled
                    />
                </div>
                <div class="col-sm-4 form-group">
                    <label class="control-label" for="field_date_fermeture">Date Fermeture</label>
                    <input class="form-control" id="field_date_fermeture" name="date_fermeture" ng-model="vm.lot.dateFermeture"
                           disabled/>
                </div>
                <div class="col-sm-4 form-group">
                    <label class="control-label" for="field_etat">Etat</label>
                    <input class="form-control" id="field_etat" name="etat"
                            ng-model="vm.lot.etat" disabled/>

                </div>
