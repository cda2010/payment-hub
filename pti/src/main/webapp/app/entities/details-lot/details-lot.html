        <table class="jh-table table table-hover">
            <thead>
            <tr>
               <th><span data-translate="global.field.id">ID</span></th>
                <th><span>Numero</span></th>
                <th><span>Unite org </span></th>
                <th><span>Date ouverture</span></th>
                <th><span>Date fermeture</span></th>
                <th><span>Etat</span></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr  ng-repeat="lot in vm.lots track by lot.id">
               <td><a ui-sref="lot-detail({id:lot.id})">{{lot.id}}</a></td> 
                <td>0554</td>
                <td>{{lot.organisation.libelleUniteOrganisation}}</td>
                <td>{{lot.dateOuverture}}</td>
                <td>{{lot.dateFermeture}}</td>
                <!-- <td>{{llot.etat}}</td> -->
                <td>
                    <button class="btn btn-danger btn-xs" ng-click="vm.setActive(lot, true)"
                            ng-show="lot.etat == false"
                            >Fermé
                    </button>
                    <button class="btn btn-success btn-xs" ng-click="vm.setActive(lot, false)"
                            ng-show="lot.etat == true"
                           >Ouvert
                    </button>
                </td>
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                ng-click="vm.viewLot(lot.id)"
                                class="btn btn-info btn-xs">
                            <span class="glyphicon glyphicon-eye-open"></span>
                        </button>
                        <button
                                ui-sref="lot.edit({id:lot.id})"
                                class="btn btn-warning btn-xs">
                            <span class="glyphicon glyphicon-pencil"></span>
                        </button>
                        <button type="submit"
                                ui-sref="lot.delete({id:lot.id})"
                                class="btn btn-danger btn-xs">
                            <span class="glyphicon glyphicon-remove-circle"></span>
                        </button>
                    </div>
                </td>
              
            </tr>
            </tbody>
        </table>
