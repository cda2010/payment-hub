
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEntityAuditEventLabel" data-translate="ptiApp.entityAuditEvent.home.createOrEditLabel">Create or edit a Entity Audit Event</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.entityAuditEvent.id">
            <label for="id" data-translate="global.field.id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.entityAuditEvent.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.action" for="field_action">Action</label>
            <input type="text" class="form-control" name="action" id="field_action"
                    ng-model="vm.entityAuditEvent.action"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.commitVersion" for="field_commitVersion">Commit Version</label>
            <input type="number" class="form-control" name="commitVersion" id="field_commitVersion"
                    ng-model="vm.entityAuditEvent.commitVersion"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.entityId" for="field_entityId">Entity Id</label>
            <input type="text" class="form-control" name="entityId" id="field_entityId"
                    ng-model="vm.entityAuditEvent.entityId"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.entityType" for="field_entityType">Entity Type</label>
            <input type="text" class="form-control" name="entityType" id="field_entityType"
                    ng-model="vm.entityAuditEvent.entityType"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.entityValue" for="field_entityValue">Entity Value</label>
            <input type="text" class="form-control" name="entityValue" id="field_entityValue"
                    ng-model="vm.entityAuditEvent.entityValue"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" data-translate="ptiApp.entityAuditEvent.adresse" for="field_adresse">Adresse</label>
            <input type="text" class="form-control" name="adresse" id="field_adresse"
                    ng-model="vm.entityAuditEvent.adresse"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
