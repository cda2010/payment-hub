<form name="editForm" role="form" novalidate ng-submit="vm.verifeCompte()">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" >Ajout de compte banque</h4>

    </div>
    <div class="modal-body">
        <div class="form-group">
            <label mf-required class="control-label" id="field_paysEm"
                   for="field_paysEm">Pays compte</label>
            <div>
                <select required ng-disabled="vm.isViewing || vm.isFraisDispo"
                        class="form-control input-xs" id="field_paysEms" name="pays"
                        ng-change="vm.getUoFils(vm.uoEmetteurId,'FSE')" ng-model="vm.uoEmetteurId"
                        ng-options="pays.id as pays.libelleUniteOrganisation for pays in vm.pays">
                    <option value=""></option>
                </select>
            </div>
        </div>
        <div class="form-group ">
            <label class="control-label" mf-required for="field_fournisseur">Teneur
                compte </label>
            <div >
                <select class="form-control input-xs" required id="field_fournisseur"
                        name="fournisseur" ng-model="vm.fseCompteId" ng-change="vm.getFournisseurMonnaie(vm.uoEmetteurId)"
                        ng-options="fse.id as fse.libelleUniteOrganisation for fse in vm.fses">
                    <option value=""></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label mf-required class="control-label"
                   for="field_typeFse">Type
                compte</label>
            <div >
                <select required class="form-control input-xs" id="field_typeFse" name="fse"
                        ng-model="vm.estCompteBanqueB">
                    <option value="OUI">Compte Banque</option>
                    <option value="NON">Compte Carte</option>
                </select>
            </div>
        </div>

        <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
            <label class="control-label " mf-required
                   data-translate="ptiApp.compteBanque.codeAgence" for="field_codeAgence">Code
                Agence</label>
            <div >
                <input autocomplete="off" type="text" class="form-control" name="codeAgence"
                       id="field_codeAgence" ng-model="vm.compteBanque.codeAgence" required />
            </div>
        </div>
        <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
            <label class="control-label " mf-required for="field_codeBanque">Code
                Banque</label>
            <div >
                <input autocomplete="off" type="text" class="form-control" name="codeBanque"
                       id="field_codeBanque" ng-model="vm.compteBanque.codeBanque" required />
            </div>
        </div>

        <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
            <label class="control-label " mf-required for="field_numeroCmpt">N
                compte</label>
            <div >
                <input autocomplete="off" type="text" class="form-control" name="numeroCmpt"
                       id="field_numeroCmpt" ng-model="vm.compteBanque.valeurCompte" required />
            </div>
        </div>


        <div class="form-group" ng-if="vm.estCompteBanqueB=='OUI'">
            <label ng-if="!vm.isViewing" mf-required class="control-label "
                   for="field_rib">Rib</label>
            <div >
                <input autocomplete="off" required type="text" class="form-control" name="rib"
                       id="field_rib" ng-model="vm.compteBanque.rib" />
            </div>
        </div>
        <!--COMPTE CARTE-->
        <div class="form-group" ng-if="vm.estCompteBanqueB=='NON'">
            <label ng-if="!vm.isViewing" mf-required class="control-label "
                   for="field_nom_carte">Nom de la carte</label>
            <div >
                <input autocomplete="off" required type="text" class="form-control" name="nomOnCard"
                       id="field_nom_carte" ng-model="vm.compteCarte.nomOnCard" />
            </div>
        </div>

        <div class="form-group" ng-if="vm.estCompteBanqueB=='NON'">
            <label class="control-label " mf-required
                    for="field_last_digit">4 dernères chiffres
                </label>
            <div >
                <input autocomplete="off" type="text" class="form-control" name="last4Digit"
                       id="field_last_digit" ng-model="vm.compteCarte.last4Digit" required />
            </div>
        </div>
        <div class="form-group" ng-if="vm.estCompteBanqueB=='NON'">
            <label class="control-label " mf-required for="field_dateExpiration">Date d'expiration
            </label>
            <div >
                <input autocomplete="off" type="text" class="form-control" name="dateExpired"
                       id="field_dateExpiration" ng-model="vm.compteCarte.dateExpired" required />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
