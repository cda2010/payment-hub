<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
            ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEtapeServiceLabel" data-translate="ptiApp.etapeService.home.createOrEditLabel">
            Create or edit a Service Step</h4>
    </div> 
    <div class="modal-body">
        <div class="form-group">
            <label class="col-sm-4 control-label" mf-required class="control-label"
                   for="field_nom">Service</label>
            <div class="col-sm-6">
                <select class="form-control" id="field_typeService" name="typeService"
                    ng-model="vm.etapeService.typeService"
                    ng-options="typeService as typeService.libelle for typeService in vm.typeservices track by typeService.id"></select> 
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" data-translate="ptiApp.serviceProfil.actionService"
                for="field_actionService">Action Service</label>
            <div class="col-sm-6">
                <select class="form-control" name="field_actionService" id="field_actionService" multiple ng-model="vm.etapeService.actionService">
                    <option value="ACT_DEBIT">COMPTABILISATION CLIENT</option>
                    <option value="ACT_SETTLEMENT">SETTLEMENT</option>
                    <option value="ACT_COMPA_COMMISSION">COMPTABILISATION COMMISSION</option> 
                    <option value="ACT_ENVOI_SMS">ENVOI SMS</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
                data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
