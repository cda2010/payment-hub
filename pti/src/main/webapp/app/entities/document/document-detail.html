
<div>
    <h2><span data-translate="ptiApp.document.detail.title">Document</span> {{vm.document.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.document.valeur">Valeur</span></dt>
        <dd>
            <div ng-if="vm.document.valeur">
                <a ng-click="vm.openFile(vm.document.valeurContentType, vm.document.valeur)" data-translate="entity.action.open">open</a>
                {{vm.document.valeurContentType}}, {{vm.byteSize(vm.document.valeur)}}
            </div>
        </dd>
        <dt><span data-translate="ptiApp.document.typeDocument">Type Document</span></dt>
        <dd>
            <a ui-sref="type-document-detail({id:vm.document.typeDocumentId})">{{vm.document.typeDocumentId}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="document-detail.edit({id:vm.document.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
