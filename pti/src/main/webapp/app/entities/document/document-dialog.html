<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation>
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myDocumentLabel" data-translate="ptiApp.document.home.createOrEditLabel">Create or edit a Document</h4>
    </div>
    <div class="modal-body">
        <div class="form-group" ngf-drop ngf-change="vm.setValeur($file, vm.document)">
            <label class="control-label" data-translate="ptiApp.document.valeur" for="field_valeur">Valeur</label>
            <div>
                <div ng-if="vm.document.valeur" class="help-block clearfix">
                    <a class="pull-left" ng-click="vm.openFile(vm.document.valeurContentType, vm.document.valeur)" data-translate="entity.action.open">open</a><br>
                    <span class="pull-left">{{vm.document.valeurContentType}}, {{vm.byteSize(vm.document.valeur)}}</span>
                    <button type="button" ng-click="vm.document.valeur = null;vm.document.valeurContentType = null;"
                            class="btn btn-default btn-xs pull-right">
                        <span class="glyphicon glyphicon-remove"></span>
                    </button>
                </div>
                <button type="button" ngf-select class="btn btn-default btn-block"
                        ngf-change="vm.setValeur($file, vm.document)" data-translate="entity.action.addblob">
                    Add blob
                </button>
            </div>
            <div>
                <input autocomplete="off"type="hidden" class="form-control" name="valeur" id="field_valeur"
                       ng-model="vm.document.valeur"
                       required/>
                <input autocomplete="off"type="hidden" class="form-control" name="valeurContentType" id="field_valeurContentType"
                       ng-model="vm.document.valeurContentType" />
                <input autocomplete="off"-show="editForm.valeur.$invalid">
                <p class="help-block"
                   ng-show="editForm.valeur.$error.required" data-translate="entity.validation.required">
                   
                </p>
            </div>
        </div>

        <div class="form-group">
            <label data-translate="ptiApp.document.typeDocument" for="field_typeDocument">Type Document</label>
            <select class="form-control" id="field_typeDocument" name="typeDocument" ng-model="vm.document.typeDocumentId" ng-options="typeDocument.id as typeDocument.id for typeDocument in vm.typedocuments">
                <option value=""></option>
            </select>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span data-translate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
        </button>
    </div>
</form>
