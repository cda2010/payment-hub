<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true"
                ng-click="vm.clear()">&times;</button>
        <h4 class="modal-title" id="myEtapeServiceLabel" data-translate="ptiApp.canalApplication.home.createOrEditLabel">
            Create or edit a Groupe Fse</h4>
    </div> 
    <!--  {{vm.canals}} -->
    <div class="modal-body">
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Code Groupe</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_code" name="code" type="text" ng-model="vm.groupeFse.code" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-4" mf-required 
                   for="field_canal">Libelle Groupe</label>
            <div class="col-sm-6">
                <input class="form-control" id="field_libelleGroupeFse" name="libelleGroupeFse" type="text" ng-model="vm.groupeFse.libelle" required/>
            </div>
        </div>
    </div>
    <!-- <div class="form-group">
        <div class="col-sm-6">
            <button type="button" class="btn btn-info" ng-click="vm.showFse = !vm.showFse">
                Lier les FSE
            </button>
        </div>
    </div> -->
    <div class="form-group" ng-show="vm.showFse">
        <label class="control-label col-sm-4" for="field_uniteOrganisation">FSE</label>
        <div class="col-sm-6">
            <ui-select multiple tagging tagging-label="false" ng-model="vm.groupeFse.uniteOrganisation" theme="bootstrap" title="Choose a type">
                <ui-select-match placeholder="Sélectionner un Fse...">{{$item.libelleUniteOrganisation}}</ui-select-match>
                <ui-select-choices repeat="uo in vm.FSEs | filter: $select.search">
                    <span ng-bind="uo.libelleUniteOrganisation"></span>
                </ui-select-choices>
            </ui-select>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
        <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span
            data-translate="entity.action.cancel">Cancel</span>
    </button>
    <!--  <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">-->
    <button type="submit" class="btn btn-primary">
        <span class="glyphicon glyphicon-save"></span>&nbsp;<span data-translate="entity.action.save">Save</span>
    </button>
</div>
</form>
