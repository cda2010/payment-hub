<div>
    <div class="well with-header" style="margin-top:10px ">
        <div class="header bg-blue ">
            <div class="col-xs-11 text-center">
                <h4 >Traitement</h4>
            </div>

        </div>
        <!--filtes -->

        <div  class="contaner-fluid mt5">
            <div class="col-sm-12">
                <div class="col-sm-3">
                    <div class="radio " >
                        <label>
                            <input autocomplete="off" ng-model="vm.itemSearch.hash" value="0" name="form-field-radio"
                                   type="checkbox" class="colored-blue" id="t1">
                            <span class="text">Hash code</span>
                        </label>

                    </div>
                </div>
                <div class="col-sm-3">
                    <select  class="form-control" id="field_typePiece" name="typePiece"
                            ng-model="vm.itemSearch.typePieceId"
                            ng-options="typePiece.id as typePiece.libelleTypePiece for typePiece in vm.typepieces">
                        <option value="">Choisir</option>
                    </select>
                </div>
            </div>

            <br>
            <div class="col-sm-12" >
                <div class="col-sm-3">
                    <button   ng-click="vm.clearSelect()" class="btn btn-danger mt5">
                        <span class="glyphicon glyphicon-remove-circle"></span>&nbsp;<span>Annuler</span>
                    </button>
                </div>

                <div class="col-sm-3">
                    <button class="btn btn-primary mt5" ng-click="vm.getDoublon()">
                        <span class="glyphicon glyphicon-search" > Chercher</span>
                    </button>
                </div>
                <div class="col-sm-3" ng-if="vm.flag">
                    <button class="btn btn-success mt5" >
                        <span > </span>
                    </button>
                </div>
            </div>
        </div>
        <div class="row primary" ng-if="vm.canShowResultCount">
            <i ng-if="vm.totalItems>1">{{vm.totalItems}} éléments trouvés</i>
            <i ng-if="vm.totalItems==1">{{vm.totalItems}} élément trouvé</i>
            <i ng-if="vm.totalItems<1">Aucun résultat</i>
        </div>
        <!--/filtes -->
        <table  class="table table-hover">
            <thead>
            <tr>
             <!--   <th >
                    <span class="text">Sélectionner</span>
                </th>
                <th><span>Id</span></th>-->
                 <th><span>Type personne</span></th>
                <!--<th>Indicatif</th>-->
                <th><span>Téléphone</span></th>
                <th><span>Adresse</span></th>
                <th><span>Type piece</span></th>
                <th><span>Reférence piece</span></th>
                <th><span>Hash</span></th>
               <!-- <th><span>Nom</span></th>
                <th><span>Prenom</span></th>
                <th><span>Date naissance</span></th>
                <th><span>Nom mère</span></th>
                <th><span>Lien</span></th>-->
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr  ng-repeat="liste in vm.datas track by liste.id ">
                <!--                <td><a ui-sref="facturier-detail({id:facturier.id})">{{facturier.id}}</a></td>-->
<!--
                <td>{{liste.id}}</td>-->
              <!--  <td>
                    <label>
                        <input autocomplete="off" ng-model="liste.isChecked"  value="0" name="form-field-radio"
                               ng-change="vm.selectEntity()"     type="checkbox" class="colored-blue" id={{liste.id}}>
                        <span class="text">Cocher</span>
                    </label>
                </td>-->
               <!-- <td>{{liste.id}}</td>-->
                <td>{{liste.typePersonne}}</td>
<!--
                <td>{{liste.codePaysTelephone}}</td>
-->
                <td>{{liste.telephone}}</td>
                <td>{{liste.adresse}}</td>
                <td>{{liste.typePiece}}</td>
                <td>{{liste.refPiece}}</td>
                <td>{{liste.keyHash}}</td>
               <!-- <td>{{liste.personnePhysiqueNomClient}}</td>
                <td>{{liste.personnePhysiquePrenomClient}}</td>
                <td>{{liste.personneDateNaissance}}</td>
                <td>{{liste.personneNomMereClient}}</td>
                <td>{{liste.personneLien}}</td>-->
                <td class="text-right">
                    <div class="btn-group flex-btn-group-container">
                        <button type="submit"
                                ng-click="vm.viewPersonneLien(liste)"
                                class="btn btn-info btn-xs">
                            <span class="glyphicon glyphicon-eye-open" title="Voir Lien"></span>
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="center-block text-center" ng-show="vm.canShowPagination">
        <uib-pagination total-items="vm.totalItems" ng-model="vm.page" items-per-page="vm.itemsPerPage">
        </uib-pagination>
    </div>
</div>
