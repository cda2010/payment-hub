
<div>
    <h2><span data-translate="ptiApp.notification.detail.title">Notification</span> {{vm.notification.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span data-translate="ptiApp.notification.dateHeureEnvoie">Date Heure Envoie</span></dt>
        <dd>
            <span>{{vm.notification.dateHeureEnvoie | date:'medium'}}</span>
        </dd>
        <dt><span data-translate="ptiApp.notification.contenu">Contenu</span></dt>
        <dd>
            <span>{{vm.notification.contenu}}</span>
        </dd>
        <dt><span data-translate="ptiApp.notification.destinataire">Destinataire</span></dt>
        <dd>
            <span>{{vm.notification.destinataire}}</span>
        </dd>
        <dt><span data-translate="ptiApp.notification.isDelivred">Is Delivred</span></dt>
        <dd>
            <span>{{vm.notification.isDelivred}}</span>
        </dd>
        <dt><span data-translate="ptiApp.notification.typeNotification">Type Notification</span></dt>
        <dd>
            <span data-translate="{{'ptiApp.TypeNotification.' + vm.notification.typeNotification}}">{{vm.notification.typeNotification}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span data-translate="entity.action.back"> Back</span>
    </button>

    <button type="button" ui-sref="notification-detail.edit({id:vm.notification.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down" data-translate="entity.action.edit"> Edit</span>
    </button>
</div>
