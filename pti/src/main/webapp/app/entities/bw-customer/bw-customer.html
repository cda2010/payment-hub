<div class="card-box widget-user">
    <h2 data-translate="nafaApp.agence.home.title">Agences</h2>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <button class="btn btn-primary" ui-sref="agence.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span  data-translate="nafaApp.agence.home.createLabel">
                        Create new Agence
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
  
    <div class="table-responsive">
        <table class="jh-table  table table-hover m-0" id ="datatable-editable">
            <thead>
                <tr jh-sort="vm.predicate" ascending="vm.reverse" callback="vm.transition()">
                  
                    <th jh-sort-by="nomAgence"><span data-translate="nafaApp.agence.nomAgence">Nom Agence</span> <span class="glyphicon glyphicon-sort"></span></th>
                    <th jh-sort-by="codeAgence"><span data-translate="nafaApp.agence.codeAgence">Code Agence</span> <span class="glyphicon glyphicon-sort"></span></th>
                 
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="agence in vm.agences track by agence.id">
                  
                    <td>{{agence.nomAgence}}</td>
                    <td>{{agence.codeAgence}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            
                               <div class="actions">
                          <a    ui-sref="agence.edit({id:agence.id})" class="on-default edit-row"><i class="fa fa-pencil"></i></a>
                           
                            
                                                            <a ui-sref="agence.delete({id:agence.id})" class="on-default remove-row"><i class="fa fa-trash-o"></i></a>  
                          
                        </div>
                        
                      
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
