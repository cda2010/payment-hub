
<div class="row">
    <div class="well with-header" style="margin-top:10px ">
    
    <div class="card-box widget-user">
        <div class="container-fluid">
            <div class="col-lg-12">
        <div class="row">
            <div class="col-xs-4 no-padding-left">
                <div class="form-group">
            <label class="control-label"  for="field_codeBanque">Nom</label>
            <input type="text" class="form-control" name="codeBanque" id="field_codeBanque"
                    ng-model="vm.nom"
                    required/>
          
        </div>
            </div>
             <div class="col-xs-4 no-padding-left">
                <div class="form-group">
            <label class="control-label"  for="field_codeBanque">Prenom</label>
            <input type="text" class="form-control" name="codeBanque" id="field_codeBanque"
                    ng-model="vm.prenom"
                    required/>
          
        </div>
            </div>
            
             <div class="col-xs-4 no-padding-left">
                <div class="form-group">
            <label class="control-label"  for="field_codeBanque">Télephone</label>
            <input type="text" class="form-control" name="codeBanque" id="field_codeBanque"
                    ng-model="vm.telephone"
                    required/>
          
        </div>
            </div>
           
            
        </div>
        <div class="row">
            <div class="modal-footer">
                 <button type="button" class="btn btn-raised btn-info  waves-effect"  ng-click="vm.rechercher()">
            <span class="glyphicon glyphicon-search"></span>&nbsp;<span >Rechercher</span>
        </button>
            </div>
           
        </div>
</div>
        </div>
      </div>   



<div class="row">
                                       
    <div class="card-box widget-user">
        <div class="container-fluid">
             <div class="col-lg-12">

                                            <ul class="nav nav-tabs nav-justified">
                                                <li role="presentation" ng-class="{'active' : vm.activetab === 'encours'}">
                                                    <a ng-click="vm.activerTab('encours', 0)" role="tab" data-toggle="tab">En encours</a>
                                                </li>
                                                <li role="presentation" ng-class="{'active' : vm.activetab === 'valide'}">
                                                    <a ng-click="vm.activerTab('valide',1)" role="tab" data-toggle="tab">Validé</a>
                                                </li>
                                               
                                            </ul>
                                            <div class="tab-content">
                                                <div role="tabpanel" class="tab-pane fade in active" id="encours"
                                                     aria-labelledby="home-tab" ng-if="vm.activetab == 'encours'">
                                                <div ng-include src="'bw-customer'"></div> 
                                                </div>
                                                <div role="tabpanel" class="tab-pane fade in active" id="profile"
                                                     aria-labelledby="profile-tab"  ng-if="vm.activetab == 'valide'">
                                                         
                                                    <div ng-include src="'bw-customer'"></div> 
                                                </div>
                                               
                                               
                                            </div>
                                        </div><!-- end col -->
            
        </div>
        
        
    </div>

                                       

                                    </div>

    </div>
 </div>


<script type="text/ng-template" id="bw-customer">
  <div class="row">
    <div class="col-sm-12" >
        <div class="row"> 
          
            <div class="container-fluid">
                 <div class="table-responsive">
        <table class="jh-table table">
            <thead>
                <tr>
                    <th><span data-translate="partnerApp.bwCustomer.nomCustomer">Nom Customer</span></th>
                    <th><span data-translate="partnerApp.bwCustomer.prenomCustomer">Prenom Customer</span></th>
                    <th><span data-translate="partnerApp.bwCustomer.typePiece">Type Piece</span></th>
                    <th><span data-translate="partnerApp.bwCustomer.numeroPiece">Numero Piece</span></th>
                    <th><span data-translate="partnerApp.bwCustomer.codePays">Code Pays</span></th>
                    <th><span data-translate="partnerApp.bwCustomer.msisdn">Msisdn</span></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="bwCustomer in vm.bwCustomers track by bwCustomer.id">
                   
                    <td>{{bwCustomer.nomCustomer}}</td>
                    <td>{{bwCustomer.prenomCustomer}}</td>
                    <td>{{bwCustomer.typePiece}}</td>
                    <td>{{bwCustomer.numeroPiece}}</td>
                    <td>{{bwCustomer.codePays}}</td>
                    <td>{{bwCustomer.msisdn}}</td>
                    <td class="text-right">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit" 
                                  ng-click="vm.openModal(bwCustomer)"   
                                  
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down" data-translate="entity.action.view"></span>
                            </button>
                         
                             <button type="submit" ng-show="!bwCustomer.valide"
                                    ui-sref="bw-customer.valide({id:bwCustomer.id})"
                                    class="btn btn-success btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down" >Valider</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
            
                  <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition(vm.nom,vm.prenom,vm.telephone)"></uib-pagination>
    </div>
                
 </div>
           
          </div>  
            
       
         </div>
 </div>

</script>
