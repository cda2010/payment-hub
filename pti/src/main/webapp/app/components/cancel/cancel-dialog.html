<div class="modal-header bg-danger">
    <button  ng-click="vm.clear()"  type="button" class="close" data-dismiss="modal" aria-hidden="true"
    ng-click="">&times;</button>
    <h4 class="modal-title" >Confirmation</h4>
</div>
<div class="modal-body">
    <div class="text-danger">
        <span class="fa fa-warning "></span>
        <span class="h5" style="white-space: pre-line">{{vm.msg}}</span>
    </div>
    <div class="form-group" ng-if="vm.withForm">
        <label mf-required class="control-label col-sm-6" for="field_cle">Clé d'activation</label>
        <div class="col-sm-6">
            <input required type="password" ng-model="vm.code"/>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-default btn-xs" data-dismiss="modal" ng-click="vm.clear()">
    <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Non</span>
    </button>
    <button type="button"  class="btn btn-primary btn-xs" ng-click="vm.confirmCancel()">
    <span class="glyphicon  glyphicon-ok"></span>&nbsp;<span >Oui</span>
    </button>
</div>
