<div class="container-fluid">
    <h2 class="text-primary text-center mb-4">
        <i class="fa fa-cogs text-warning me-2"></i>
        Gestion des Paramètres
    </h2>
    <jhi-alert></jhi-alert>
    
    <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" ui-sref="parametre.new" style="background-color: #2610ee;">
            <span class="glyphicon glyphicon-plus"></span>
            <span>Nouveau</span>
        </button>
    </div>

    <div class="panel" style="border: 2px solid #1939f1; border-radius: 5px;">
        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead style="background-color: #5d4cf5; color: white;">
                        <tr>
                            <th class="text-white"><span>ID</span></th>
                            <th class="text-white"><span>Nom Parametre</span></th>
                            <th class="text-white"><span>Type Parametre</span></th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="parametre in vm.parametres track by parametre.id" style="background-color: #f8f9fa;">
                            <td><span class="badge" style="background-color: #7485e6;">{{parametre.id}}</span></td>
                            <td>{{parametre.nomParametre}}</td>
                            <td><span class="text-primary">{{parametre.typeParametre}}</span></td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button type="submit"
                                            ui-sref="parametre-detail({id:parametre.id})"
                                            class="btn btn-info btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-eye-open"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre.edit({id:parametre.id})"
                                            class="btn btn-primary btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre.delete({id:parametre.id})"
                                            class="btn btn-danger btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-remove-circle"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
