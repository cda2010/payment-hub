<div>
    <div class="container-fluid">
        <div class="col-lg-12">
            <div class="panel m-b-none" style="border: 2px solid #7485e6; border-radius: 5px;">
                <div class="panel-body">
                    <h3 class="m-b-xs text-center m-t-n">
                        <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                        <span class="text-primary">Paramètre Méthodes</span>
                    </h3>
                    <hr style="border-top: 2px solid #7485e6;"/>
                </div>
            </div>
        </div>
    </div>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-6">
                <button class="btn btn-default" ui-sref="ligne-schema-ecriture({idSchema:vm.schema})" style="border: 1px solid #7485e6; color: #7485e6;">
                    <span class="glyphicon glyphicon-arrow-left"></span>
                    <span>Retour</span>
                </button>
            </div>
            <div class="col-xs-6 text-right">
                <button class="btn btn-primary" ui-sref="parametre-schema.new" style="background-color: #2610ee;">
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>Nouveau</span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="panel" style="border: 2px solid #1939f1; border-radius: 5px;">
        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered table-hover" style="border: 2px solid #7485e6;">
                    <thead>
                        <tr class="bg-primary text-white">
                            <th class="text-white"><span>ID</span></th>
                            <th class="text-white"><span>Nom Paramètre</span></th>
                            <th class="text-white"><span>Code Paramètre</span></th>
                            <th class="text-white"><span>Catégorie</span></th>
                            <th class="text-white"><span>Paramètre Méthode</span></th>
                            <th class="text-center text-white">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="parametreSchema in vm.parametreSchemas track by parametreSchema.id" style="background-color: #f8f9fa;">
                            <td>{{parametreSchema.id}}</td>
                            <td><span class="text-primary">{{parametreSchema.nomParametre}}</span></td>
                            <td><span class="badge" style="background-color: #7485e6;">{{parametreSchema.codeParametre}}</span></td>
                            <td>{{parametreSchema.categorieParam}}</td>
                            <td><span class="badge badge-info">{{parametreSchema.codeParametreMethode}}</span></td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button type="submit"
                                            ui-sref="parametre-schema-detail({id:parametreSchema.id})"
                                            class="btn btn-info btn-sm" 
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-eye-open"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre-schema.edit({id:parametreSchema.id})"
                                            class="btn btn-primary btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre-schema.delete({id:parametreSchema.id})"
                                            class="btn btn-danger btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-remove-circle"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
