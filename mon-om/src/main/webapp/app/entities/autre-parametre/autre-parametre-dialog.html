
<form name="editForm" role="form" novalidate ng-submit="vm.save()" show-validation class="form-horizontal">

    <div class="modal-header bg-primary">
        <h4 class="modal-title text-white" id="myAutreParametreLabel" ng-show="vm.autreParametre.id">
            <i class="fa fa-edit"></i> Editer un paramètre
        </h4>
        <h4 class="modal-title text-white" id="myAutreParametreLabel" ng-show="vm.autreParametre.id == undefined">
            <i class="fa fa-plus-circle"></i> Ajouter un paramètre
        </h4>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>

        <div class="form-group row" ng-show="vm.autreParametre.id">
            <label class="col-sm-3 col-form-label" for="id">ID</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.autreParametre.id" readonly />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_codeParametre">Code Paramètre</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="codeParametre" id="field_codeParametre"
                    ng-model="vm.autreParametre.codeParametre"
                    placeholder="Entrez le code paramètre" required/>
                <div ng-show="editForm.codeParametre.$invalid">
                    <p class="help-block text-danger"
                        ng-show="editForm.codeParametre.$error.required">
                        Ce champ est obligatoire
                    </p>
                </div>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_nomParametre">Nom Paramètre</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nomParametre" id="field_nomParametre"
                    ng-model="vm.autreParametre.nomParametre"
                    placeholder="Entrez le nom paramètre"/>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_valeur">Valeur</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="valeur" id="field_valeur"
                    ng-model="vm.autreParametre.valeur"
                    placeholder="Entrez la valeur"/>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_fournisseurService">Fournisseur Service</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_fournisseurService" name="fournisseurService" 
                    ng-model="vm.autreParametre.fournisseurService" 
                    ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurservices track by fournisseurService.id">
                    <option value="">Sélectionnez un fournisseur</option>
                </select>
            </div>
        </div>

    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-light" data-dismiss="modal" ng-click="vm.clear()">
            <i class="fa fa-times"></i>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <i class="fa fa-save"></i>&nbsp;<span>Enregistrer</span>
        </button>
    </div>

</form>
