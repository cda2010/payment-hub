
<div>
    <h2><span>Operation</span> {{vm.operation.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Date Operation</span></dt>
        <dd>
            <span>{{vm.operation.dateOperation | date:'medium'}}</span>
        </dd>
        <dt><span>Fse Code Source</span></dt>
        <dd>
            <span>{{vm.operation.fseCodeSource}}</span>
        </dd>
        <dt><span>Fse Code Dest</span></dt>
        <dd>
            <span>{{vm.operation.fseCodeDest}}</span>
        </dd>
        <dt><span data-translate="exempleApp.operation.user_id">User Id</span></dt>
        <dd>
            <span>{{vm.operation.user_id}}</span>
        </dd>
        <dt><span>Type Service</span></dt>
        <dd>
            <span>{{vm.operation.typeService}}</span>
        </dd>
        <dt><span>Terminal</span></dt>
        <dd>
            <span>{{vm.operation.terminal}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="operation-detail.edit({id:vm.operation.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
