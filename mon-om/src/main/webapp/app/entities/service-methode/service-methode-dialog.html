
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">

        <h4 class="modal-title" id="myServiceMethodeLabel">Create or edit a Service Methode</h4>
    </div>



    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.serviceMethode.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.serviceMethode.id" readonly />
        </div>
        <div class="form-group">
            <label for="field_methode">Méthode ou fonction</label>
            <select class="form-control" id="field_fournisseurService" name="methode" ng-model="vm.serviceMethode.methode" ng-options="methode as methode.nomMethode for methode in vm.methodes track by methode.id">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
