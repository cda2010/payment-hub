
<form name="editForm" role="form" novalidate ng-submit="vm.save()" class="form-horizontal">

    <div class="modal-header bg-primary">
        <h4 class="modal-title text-white" id="myTypeCompteLabel" ng-show="vm.typeCompte.id">
            <i class="fa fa-edit"></i> Editer un type de compte
        </h4>
        <h4 class="modal-title text-white" id="myTypeCompteLabel" ng-show="vm.typeCompte.id == undefined">
            <i class="fa fa-plus-circle"></i> Ajouter un type de compte
        </h4>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>

        <div class="form-group row" ng-show="vm.typeCompte.id">
            <label class="col-sm-3 col-form-label" for="id">ID</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.typeCompte.id" readonly />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_nomTypeCompte">Nom Type Compte</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nomTypeCompte" id="field_nomTypeCompte"
                    ng-model="vm.typeCompte.nomTypeCompte"
                    placeholder="Entrez le nom du type de compte"/>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_codeParametre">Code Paramètre</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="codeParametre" id="field_codeParametre"
                    ng-model="vm.typeCompte.codeParametre"
                    placeholder="Le code paramètre doit être celui défini dans le schéma d'écriture"/>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" ng-click="vm.clear()">
            <i class="fa fa-ban"></i>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <i class="fa fa-save"></i>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
