<form name="editForm" role="form" novalidate ng-submit="vm.save()" class="form-horizontal">

    <div class="modal-header bg-primary">
        <h4 class="modal-title text-white" id="myRelationLabel" ng-show="vm.relation.id">
            <i class="fa fa-edit"></i> Editer une relation
        </h4>
        <h4 class="modal-title text-white" id="myRelationLabel" ng-show="vm.relation.id == undefined">
            <i class="fa fa-plus-circle"></i> Ajouter une relation
        </h4>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>

        <div class="form-group row" ng-show="vm.relation.id">
            <label class="col-sm-3 col-form-label" for="id">ID</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.relation.id" readonly />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_fournisseurService">Fournisseur Service Source</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_fournisseurService" name="fournisseurServiceSource" 
                    ng-model="vm.relation.fseSource" 
                    ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurServices track by fournisseurService.id">
                    <option value="">Sélectionnez un fournisseur source</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_fournisseurService">Fournisseur Service Destination</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_fournisseurService" name="fournisseurServiceDest" 
                    ng-model="vm.relation.fseDestination" 
                    ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurServices track by fournisseurService.id">
                    <option value="">Sélectionnez un fournisseur destination</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_fournisseurService">Fournisseur Service Partenaire</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_fournisseurService" name="fournisseurServicePart" 
                    ng-model="vm.relation.fsePartenaire" 
                    ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurServices track by fournisseurService.id">
                    <option value="">Sélectionnez un fournisseur partenaire</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_service">Service</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_service" name="service" 
                    ng-model="vm.relation.service" 
                    ng-options="traitementService as traitementService.libelleTypeService for traitementService in vm.traitementServices track by traitementService.id">
                    <option value="">Sélectionnez un service</option>
                </select>
            </div>
        </div>

    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" ng-click="vm.clear()">
            <i class="fa fa-ban"></i>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <i class="fa fa-save"></i>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
