<div>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <div class="panel m-b-none" style="border: 2px solid #dddfec; border-radius: 5px;">
                    <div class="panel-body">
                        <h3 class="m-b-xs text-center m-t-n">
                            <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                            <span class="text-primary">Relations</span>
                        </h3>
                        <hr style="border-top: 2px solid #7485e6;"/>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xs-12 text-right">
                <button class="btn btn-primary" ui-sref="relation.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>
                        Nouveau
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover" style="border: 2px solid #e1e3ee;">
            <thead>
                <tr class="bg-primary">
                    <th class="text-center text-white"><span>Relation</span></th>
                    <th class="text-center text-white"><span>Partenaire</span></th>
                    <th class="text-center text-white"><span>Service</span></th>
                    <th class="text-center text-white">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="relation in vm.relations track by relation.id">
                    <td class="text-center">
                        <span class="badge badge-info">{{relation.fseSource.nom}}</span>
                        <i class="fa fa-arrow-right text-primary"></i>
                        <span class="badge badge-primary">{{relation.fseDestination.nom}}</span>
                    </td>
                    <td class="text-center">{{relation.fsePartenaire.nom}}</td>
                    <td class="text-center">
                        <span class="badge badge-success">{{relation.service.libelleTypeService}}</span>
                    </td>
                    <td class="text-center">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="relation-detail({id:relation.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="relation.edit({id:relation.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="relation.delete({id:relation.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="compte({idrelation:relation.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-cog"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
