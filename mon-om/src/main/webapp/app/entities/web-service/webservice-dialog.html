
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">

        <h4 class="modal-title" id="myWebserviceLabel">Create or edit a Webservice</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.webservice.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.webservice.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_endPoint">End Point</label>
            <input type="text" class="form-control" name="endPoint" id="field_endPoint"
                    ng-model="vm.webservice.endPoint"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_useSsl">Use Ssl</label>
                <input type="checkbox" name="useSsl" id="field_useSsl"
                          ng-model="vm.webservice.useSsl"/>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
