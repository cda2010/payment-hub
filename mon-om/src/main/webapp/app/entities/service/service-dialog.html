<form name="editForm" role="form" novalidate ng-submit="vm.save()" class="form-horizontal">

    <div class="modal-header bg-primary">
        <h4 class="modal-title text-white" id="myServiceLabel" ng-show="vm.service.id">
            <i class="fa fa-edit"></i> Editer un service
        </h4>
        <h4 class="modal-title text-white" id="myServiceLabel" ng-show="vm.service.id == undefined">
            <i class="fa fa-plus-circle"></i> Ajouter un service
        </h4>
    </div>

    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>

        <div class="form-group row" ng-show="vm.service.id">
            <label class="col-sm-3 col-form-label" for="id">ID</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.service.id" readonly />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_codeService">Code Service</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="codeService" id="field_codeService"
                    ng-model="vm.service.codeService"
                    placeholder="Entrez le code service"/>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_nomService">Nom Service</label>
            <div class="col-sm-9">
                <input type="text" class="form-control" name="nomService" id="field_nomService"
                    ng-model="vm.service.nomService"
                    placeholder="Entrez le nom service"/>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_fournisseurService">Fournisseur Service</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_fournisseurService" name="fournisseurService" 
                    ng-model="vm.service.fournisseurService" 
                    ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurservices track by fournisseurService.id">
                    <option value="">Sélectionnez un fournisseur</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_interfaceUtilisateur">Interface Utilisateur</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_interfaceUtilisateur" name="interfaceUtilisateur" 
                    ng-model="vm.service.interfaceUtilisateur" 
                    ng-options="interfaceUtilisateur as interfaceUtilisateur.nomInterface for interfaceUtilisateur in vm.interfaceutilisateurs track by interfaceUtilisateur.id">
                    <option value="">Sélectionnez une interface</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_utilise">Méthodes utilisées</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_utilise" multiple name="utilise" 
                    ng-model="vm.service.utilises" 
                    ng-options="methode as methode.nomMethode for methode in vm.methodes track by methode.id">
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label" for="field_typeService">Type Service</label>
            <div class="col-sm-9">
                <select class="form-control" id="field_typeService" name="typeService" 
                    ng-model="vm.service.typeService" 
                    ng-options="typeService as typeService.libelle for typeService in vm.typeservices track by typeService.id">
                    <option value="">Sélectionnez un type</option>
                </select>
            </div>
        </div>

    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-light" data-dismiss="modal" ng-click="vm.clear()">
            <i class="fa fa-times"></i>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <i class="fa fa-save"></i>&nbsp;<span>Enregistrer</span>
        </button>
    </div>

</form>
