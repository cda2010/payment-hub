<div>
    <div class="container-fluid">
        <div class="col-lg-12">
            <div class="panel m-b-none" style="border: 2px solid #e4e5ee; border-radius: 5px;">
                <div class="panel-body">
                    <h3 class="m-b-xs text-center m-t-n">
                        <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                        <span class="text-primary">Ligne Schema Ecritures</span>
                    </h3>
                    <hr style="border-top: 2px solid #7485e6;"/>
                </div>
            </div>
        </div>
    </div>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-6">
                <button class="btn btn-default" ng-click="vm.retour()" style="border: 1px solid #7485e6; color: #7485e6;">
                    <span class="glyphicon glyphicon-arrow-left"></span>
                    <span>Retour</span>
                </button>
            </div>
            <div class="col-xs-6 text-right">
                <button class="btn btn-primary" ui-sref="ligne-schema-ecriture.new" style="background-color: #2610ee;">
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>Création Ligne Schéma</span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="panel" style="border: 2px solid #3551eb; border-radius: 5px;">
        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-striped table-bordered table-hover" style="border: 2px solid #7485e6;">
                    <thead>
                        <tr class="bg-primary text-white">
                            <th class="text-white"><span>Type Methode</span></th>
                            <th class="text-white"><span>Priorité</span></th>
                            <th class="text-white"><span>Ordre</span></th>
                            <th class="text-white"><span>Source Api</span></th>
                            <th class="text-white"><span>Agence Imputation</span></th>
                            <th class="text-center text-white">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="ligneSchemaEcriture in vm.ligneSchemaEcritures track by ligneSchemaEcriture.id" style="background-color: #f8f9fa;">
                            <td><span class="text-primary">{{ligneSchemaEcriture.typeMethode}}</span></td>
                            <td><span class="badge" style="background-color: #7485e6;">{{ligneSchemaEcriture.priorite}}</span></td>
                            <td>{{ligneSchemaEcriture.ordre}}</td>
                            <td><span class="badge badge-info">{{ligneSchemaEcriture.apiUtil}}</span></td>
                            <td>{{ligneSchemaEcriture.agenceImput}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button type="submit"
                                            ui-sref="ligne-schema-ecriture-detail({id:ligneSchemaEcriture.id})"
                                            class="btn btn-info btn-sm" 
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-eye-open"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="ligne-schema-ecriture.edit({id:ligneSchemaEcriture.id})"
                                            class="btn btn-primary btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="ligne-schema-ecriture.delete({id:ligneSchemaEcriture.id})"
                                            class="btn btn-danger btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-remove-circle"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre-schema({idligne:ligneSchemaEcriture.id,idSchema:ligneSchemaEcriture.schemaEcriture.id})"
                                            class="btn btn-warning btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-cog"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
