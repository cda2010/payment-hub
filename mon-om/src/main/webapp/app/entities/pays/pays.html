<div>
    <jhi-alert></jhi-alert>
    <div class="container-fluid">
        <div class="row">
            <div class="row">
                <div class="col-lg-12">
                    <div class="panel m-b-none" style="border: 2px solid #f2f3fa; border-radius: 5px;">
                        <div class="panel-body">
                            <h3 class="m-b-xs text-center m-t-n">
                                <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                                <span class="text-primary">Pays</span>
                            </h3>
                            <hr style="border-top: 2px solid #7485e6;"/>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xs-12 text-right">
                <button class="btn btn-primary" ui-sref="pays.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>
                        Nouveau
                    </span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover" style="border: 2px solid #e9e9ec;">
            <thead>
                <tr class="bg-primary">
                    <th class="text-center text-white"><span>ID</span></th>
                    <th class="text-center text-white"><span>Nom Pays</span></th>
                    <th class="text-center text-white"><span>Devise</span></th>
                    <th class="text-center text-white">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="pays in vm.pays track by pays.id">
                    <td class="text-center"><a ui-sref="pays-detail({id:pays.id})">{{pays.id}}</a></td>
                    <td class="text-center">{{pays.nomPays}}</td>
                    <td class="text-center"><span class="badge badge-info">{{pays.devise}}</span></td>
                    <td class="text-center">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="pays-detail({id:pays.id})"
                                    class="btn btn-info btn-sm">
                                <span class="glyphicon glyphicon-eye-open"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="pays.edit({id:pays.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="pays.delete({id:pays.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="text-center">
        <jhi-item-count page="vm.page" total="vm.queryCount" items-per-page="vm.itemsPerPage"></jhi-item-count>
        <uib-pagination class="pagination-sm" total-items="vm.totalItems" items-per-page="vm.itemsPerPage" ng-model="vm.page" ng-change="vm.transition()"></uib-pagination>
    </div>
</div>
