<div class="container-fluid">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <div class="panel m-b-none" style="border: 2px solid #e5e6ec; border-radius: 5px;">
                    <div class="panel-body">
                        <h3 class="m-b-xs text-center m-t-n">
                            <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                            <span class="text-primary">Parametre Methodes</span>
                        </h3>
                        <hr style="border-top: 2px solid #7485e6;"/>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <jhi-alert></jhi-alert>
    <div class="row">
        <div class="col-xs-6">
            <button class="btn btn-default" ui-sref="methode({idapi:vm.methodeId})" style="border: 1px solid #7485e6; color: #7485e6;">
                <span class="glyphicon glyphicon-arrow-left"></span>
                <span>Retour</span>
            </button>
        </div>
        <div class="col-xs-6 text-right">
            <button class="btn btn-primary" ui-sref="parametre-methode.new" style="background-color: #2610ee;">
                <span class="glyphicon glyphicon-plus"></span>
                <span>Nouveau</span>
            </button>
        </div>
    </div>

    <div class="panel" style="border: 2px solid #e7e8ee; border-radius: 5px;">
        <div class="panel-body">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead>
                        <tr class="bg-primary text-white">
                            <th class="text-white"><span>ID</span></th>
                            <th class="text-white"><span>Nom Parametre</span></th>
                            <th class="text-white"><span>Code Parametre</span></th>
                            <th class="text-white"><span>Valeur</span></th>
                            <th class="text-white"><span>Catégorie</span></th>
                            <th class="text-white"><span>Code Parametre Revers</span></th>
                            <th class="text-center text-white">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="parametreMethode in vm.parametreMethodes track by parametreMethode.id" style="background-color: #f8f9fa;">
                            <td><span class="badge" style="background-color: #2545f7;">{{parametreMethode.id}}</span></td>
                            <td>{{parametreMethode.nomParametre}}</td>
                            <td>{{parametreMethode.codeParametre}}</td>
                            <td>{{parametreMethode.valeur}}</td>
                            <td><span class="text-primary">{{parametreMethode.categorieParam}}</span></td>
                            <td>{{parametreMethode.codeParametreRevers}}</td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button type="submit"
                                            ui-sref="parametre-methode-detail({id:parametreMethode.id})"
                                            class="btn btn-info btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-eye-open"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre-methode.edit({id:parametreMethode.id})"
                                            class="btn btn-primary btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-pencil"></span>
                                    </button>
                                    <button type="submit"
                                            ui-sref="parametre-methode.delete({id:parametreMethode.id})"
                                            class="btn btn-danger btn-sm"
                                            style="margin: 0 2px;">
                                        <span class="glyphicon glyphicon-remove-circle"></span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
