<div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12">
                <div class="panel m-b-none" style="border: 2px solid #ececec; border-radius: 5px;">
                    <div class="panel-body">
                        <h3 class="m-b-xs text-center m-t-n">
                            <i class="pe pe-7s-config text-warning m-r-xs"></i> 
                            <span class="text-primary">Paramètres Utilisateurs</span>
                        </h3>
                        <hr style="border-top: 2px solid #7485e6;"/>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-xs-6">
                <button class="btn btn-default" ui-sref="interface-utilisateur" style="border: 1px solid #7485e6; color: #7485e6;">
                    <span class="glyphicon glyphicon-arrow-left"></span>
                    <span>Retour</span>
                </button>
            </div>
            <div class="col-xs-6 text-right">
                <button class="btn btn-primary" ui-sref="parametre-utilisateur.new" >
                    <span class="glyphicon glyphicon-plus"></span>
                    <span>Nouveau</span>
                </button>
            </div>
        </div>
    </div>
    <br/>
    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover" style="border: 2px solid #eaebee;">
            <thead>
                <tr class="bg-primary">
                    <th class="text-center text-white"><span>ID</span></th>
                    <th class="text-center text-white"><span>Code Paramètre</span></th>
                    <th class="text-center text-white"><span>Nom Paramètre</span></th>
                    <th class="text-center text-white"><span>Valeur</span></th>
                    <th class="text-center text-white"><span>Paramètre de</span></th>
                    <th class="text-center text-white">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="parametreUtiliateur in vm.parametreUtiliateurs track by parametreUtiliateur.id" class="align-middle">
                    <td class="text-center">
                        <a class="text-primary">{{parametreUtiliateur.id}}</a>
                    </td>
                    <td class="text-center">{{parametreUtiliateur.codeParametre}}</td>
                    <td class="text-center">{{parametreUtiliateur.nomParametre}}</td>
                    <td class="text-center">{{parametreUtiliateur.valeur}}</td>
                    <td class="text-center"><span class="badge badge-info">{{parametreUtiliateur.parametreApi}}</span></td>
                    <td class="text-center">
                        <div class="btn-group flex-btn-group-container">
                            <button type="submit"
                                    ui-sref="parametre-utilisateur.edit({id:parametreUtiliateur.id})"
                                    class="btn btn-primary btn-sm">
                                <span class="glyphicon glyphicon-pencil"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                            <button type="submit"
                                    ui-sref="parametre-utilisateur.delete({id:parametreUtiliateur.id})"
                                    class="btn btn-danger btn-sm">
                                <span class="glyphicon glyphicon-remove-circle"></span>
                                <span class="hidden-sm-down"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
