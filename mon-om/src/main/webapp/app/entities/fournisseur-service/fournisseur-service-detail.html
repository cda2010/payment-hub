
<div>
    <h2><span>Fournisseur Service</span> {{vm.fournisseurService.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Code Fse</span></dt>
        <dd>
            <span>{{vm.fournisseurService.codeFse}}</span>
        </dd>
        <dt><span>Nom</span></dt>
        <dd>
            <span>{{vm.fournisseurService.nom}}</span>
        </dd>
        <dt><span>Statut</span></dt>
        <dd>
            <span>{{vm.fournisseurService.statut}}</span>
        </dd>
        <dt><span>Groupe</span></dt>
        <dd>
            <span>{{vm.fournisseurService.groupe}}</span>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="fournisseur-service-detail.edit({id:vm.fournisseurService.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
