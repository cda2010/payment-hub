
<div>
    <h2><span>Methode</span> {{vm.methode.id}}</h2>
    <hr>
    <jhi-alert-error></jhi-alert-error>
    <dl class="dl-horizontal jh-entity-details">
        <dt><span>Code Methode</span></dt>
        <dd>
            <span>{{vm.methode.codeMethode}}</span>
        </dd>
        <dt><span>Api</span></dt>
        <dd>
            <a ui-sref="api-detail({id:vm.methode.api.id})">{{vm.methode.api.id}}</a>
        </dd>
    </dl>

    <button type="submit"
            ui-sref="{{ vm.previousState }}"
            class="btn btn-info">
        <span class="glyphicon glyphicon-arrow-left"></span>&nbsp;<span> Back</span>
    </button>

    <button type="button" ui-sref="methode-detail.edit({id:vm.methode.id})" class="btn btn-primary">
        <span class="glyphicon glyphicon-pencil"></span>
        <span class="hidden-sm-down"> Edit</span>
    </button>
</div>
