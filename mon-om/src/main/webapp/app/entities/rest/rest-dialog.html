
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">

        <h4 class="modal-title" id="myRestLabel">Create or edit a Rest</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.rest.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.rest.id" readonly />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_typeAppel">Type Appel</label>
            <input type="text" class="form-control" name="typeAppel" id="field_typeAppel"
                    ng-model="vm.rest.typeAppel"
                    />
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
