
<form name="editForm" role="form" novalidate ng-submit="vm.save()">

    <div class="modal-header">

        <h4 class="modal-title" id="myAgenceLabel">Create or edit a Agence</h4>
    </div>
    <div class="modal-body">
        <jhi-alert-error></jhi-alert-error>
        <div class="form-group" ng-show="vm.agence.id">
            <label for="id">ID</label>
            <input type="text" class="form-control" id="id" name="id"
                    ng-model="vm.agence.id" readonly />
        </div>
 <div class="form-group">
            <label class="control-label" for="field_codeAgence">code agence</label>
            <input   type="text" class="form-control" name="codeAgence" id="field_codeAgence"
                    ng-model="vm.agence.codeAgence"
                    />
        </div>
        <div class="form-group">
            <label class="control-label" for="field_nomAgence">Nom agence</label>
            <input   type="text" class="form-control" name="nomAgence" id="field_nomAgence"
                    ng-model="vm.agence.nomAgence"
                    />
        </div>
          <div class="form-group" ng-show="false">
            <label for="field_fournisseurService">Fournisseur Service</label>
            <select class="form-control" id="field_fournisseurService" name="fournisseurService" ng-model="vm.agence.fournisseurService" ng-options="fournisseurService as fournisseurService.nom for fournisseurService in vm.fournisseurservices track by fournisseurService.id">
                <option value=""></option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" ng-click="vm.clear()">
            <span class="glyphicon glyphicon-ban-circle"></span>&nbsp;<span>Retour</span>
        </button>
        <button type="submit" ng-disabled="editForm.$invalid || vm.isSaving" class="btn btn-primary">
            <span class="glyphicon glyphicon-save"></span>&nbsp;<span>Enregistrer</span>
        </button>
    </div>
</form>
