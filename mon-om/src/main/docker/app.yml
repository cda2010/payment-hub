version: '2'
services:
    omnicanal-app:
        image: omnicanal
        environment:
            - SPRING_PROFILES_ACTIVE=prod,swagger
            - SPRING_DATASOURCE_URL=jdbc:mysql://omnicanal-mysql:3306/omnicanal?useUnicode=true&characterEncoding=utf8&useSSL=false
            - JHIPSTER_SLEEP=10 # gives time for the database to boot before the application
        ports:
            - 8080:8080
    omnicanal-mysql:
        extends:
            file: mysql.yml
            service: omnicanal-mysql
